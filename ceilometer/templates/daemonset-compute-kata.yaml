{{/*
The polling agent of the Kata Containers compute (openstack-nova-kata) on
nodes labelled for it: Ceilometer's Kata inspector reads each instance's
counters from the host's Kata gateway over its socket. Its host is the
node's, as nova-compute-kata's is; ceilometer-kata.conf and the polling
file of conf.polling_kata follow ceilometer.conf.
*/}}

{{- if .Values.manifests.daemonset_compute_kata }}
{{- $envAll := . }}

{{- $mounts_ceilometer_compute_kata := .Values.pod.mounts.ceilometer_compute_kata.ceilometer_compute_kata }}
{{- $mounts_ceilometer_compute_kata_init := .Values.pod.mounts.ceilometer_compute_kata.init_container }}

{{- $serviceAccountName := "ceilometer-compute-kata" }}
{{ tuple $envAll "compute" $serviceAccountName | include "helm-toolkit.snippets.kubernetes_pod_rbac_serviceaccount" }}

{{- $etcSources := .Values.pod.etcSources.ceilometer_compute_kata }}
---
apiVersion: v1
kind: Secret
metadata:
  name: ceilometer-compute-kata-etc
type: Opaque
data:
  ceilometer-kata.conf: {{ include "helm-toolkit.utils.to_oslo_conf" .Values.conf.ceilometer_compute_kata | b64enc }}
  polling-kata.yaml: {{ toYaml .Values.conf.polling_kata | b64enc }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ceilometer-compute-kata
  annotations:
    {{ tuple $envAll | include "helm-toolkit.snippets.release_uuid" }}
  labels:
{{ tuple $envAll "ceilometer" "compute-kata" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
spec:
  selector:
    matchLabels:
{{ tuple $envAll "ceilometer" "compute-kata" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 6 }}
{{ tuple $envAll "compute" | include "helm-toolkit.snippets.kubernetes_upgrades_daemonset" | indent 2 }}
  template:
    metadata:
      labels:
{{ tuple $envAll "ceilometer" "compute-kata" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 8 }}
      annotations:
{{ tuple $envAll | include "helm-toolkit.snippets.release_uuid" | indent 8 }}
        configmap-bin-hash: {{ tuple "configmap-bin.yaml" . | include "helm-toolkit.utils.hash" }}
        configmap-etc-hash: {{ tuple "configmap-etc.yaml" . | include "helm-toolkit.utils.hash" }}
        kata-etc-hash: {{ list .Values.conf.ceilometer_compute_kata .Values.conf.polling_kata | toJson | sha256sum }}
{{ tuple "ceilometer_compute_kata" . | include "helm-toolkit.snippets.custom_pod_annotations" | indent 8 }}
    spec:
      serviceAccountName: {{ $serviceAccountName }}
      affinity:
{{ tuple $envAll "ceilometer" "compute-kata" | include "helm-toolkit.snippets.kubernetes_pod_anti_affinity" | indent 8 }}
      # The node's name is the agent's host, as it is nova-compute-kata's.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        {{ .Values.labels.compute_kata.node_selector_key }}: {{ .Values.labels.compute_kata.node_selector_value }}
{{ if $envAll.Values.pod.tolerations.ceilometer.enabled }}
{{ tuple $envAll "ceilometer" | include "helm-toolkit.snippets.kubernetes_tolerations" | indent 6 }}
{{ end }}
      initContainers:
{{ tuple $envAll "compute" $mounts_ceilometer_compute_kata_init | include "helm-toolkit.snippets.kubernetes_entrypoint_init_container" | indent 8 }}
{{- $heartbeat := dig "polling" "heartbeat_socket_dir" "" .Values.conf.ceilometer }}
{{- if $heartbeat }}
        # The polling heartbeat's directory is the agent user's.
        - name: heartbeat-dir-owner
{{ tuple $envAll "ceilometer_compute_kata" | include "helm-toolkit.snippets.image" | indent 10 }}
          securityContext:
            runAsUser: 0
          command:
            - chown
            - "{{ .Values.pod.user.ceilometer_compute_kata.uid }}:{{ .Values.pod.user.ceilometer_compute_kata.uid }}"
            - {{ $heartbeat }}
{{ if $mounts_ceilometer_compute_kata.volumeMounts }}          volumeMounts:
{{ toYaml $mounts_ceilometer_compute_kata.volumeMounts | indent 12 }}{{ end }}
{{- end }}
      containers:
        - name: ceilometer-compute-kata
{{ tuple $envAll "ceilometer_compute_kata" | include "helm-toolkit.snippets.image" | indent 10 }}
{{ tuple $envAll $envAll.Values.pod.resources.compute | include "helm-toolkit.snippets.kubernetes_resources" | indent 10 }}
          # The Kata gateway serves an instance's counters only to
          # nova-compute-kata's user.
          securityContext:
            runAsUser: {{ .Values.pod.user.ceilometer_compute_kata.uid }}
            runAsGroup: {{ .Values.pod.user.ceilometer_compute_kata.uid }}
          command:
            - ceilometer-polling
            - --polling-namespaces
            - compute
            - --config-file
            - /etc/ceilometer/ceilometer.conf
            - --config-file
            - /etc/ceilometer/ceilometer-kata.conf
            - --config-dir
            - /etc/ceilometer/ceilometer.conf.d
          volumeMounts:
            - name: pod-tmp
              mountPath: /tmp
            - name: oslo-lock-path
              mountPath: {{ .Values.conf.ceilometer.oslo_concurrency.lock_path }}
            - name: pod-etc-ceilometer
              mountPath: /etc/ceilometer
            - name: ceilometer-etc
              mountPath: /etc/ceilometer/ceilometer.conf
              subPath: ceilometer.conf
              readOnly: true
            - name: ceilometer-compute-kata-etc
              mountPath: /etc/ceilometer/ceilometer-kata.conf
              subPath: ceilometer-kata.conf
              readOnly: true
            - name: ceilometer-compute-kata-etc
              mountPath: /etc/ceilometer/polling-kata.yaml
              subPath: polling-kata.yaml
              readOnly: true
            - name: ceilometer-etc-snippets
              mountPath: /etc/ceilometer/ceilometer.conf.d/
              readOnly: true
            - name: ceilometer-etc
              mountPath: /etc/ceilometer/pipeline.yaml
              subPath: pipeline.yaml
              readOnly: true
            - name: ceilometer-etc
              mountPath: /etc/ceilometer/gnocchi_resources.yaml
              subPath: gnocchi_resources.yaml
              readOnly: true
            - name: kata-gateway
              mountPath: {{ .Values.conf.ceilometer_compute_kata.DEFAULT.kata_runtime_socket | dir }}
            - name: machine-id
              mountPath: /etc/machine-id
              readOnly: true
{{ if $mounts_ceilometer_compute_kata.volumeMounts }}{{ toYaml $mounts_ceilometer_compute_kata.volumeMounts | indent 12 }}{{ end }}
      volumes:
        - name: pod-tmp
          emptyDir: {}
        - name: oslo-lock-path
          emptyDir: {}
        - name: pod-etc-ceilometer
          emptyDir: {}
        - name: ceilometer-etc
          secret:
            secretName: ceilometer-etc
            defaultMode: 0444
        - name: ceilometer-compute-kata-etc
          secret:
            secretName: ceilometer-compute-kata-etc
            defaultMode: 0444
        - name: ceilometer-etc-snippets
{{- if $etcSources }}
          projected:
            sources:
{{ toYaml $etcSources | indent 14 }}
{{- else }}
          emptyDir: {}
{{ end }}
        - name: kata-gateway
          hostPath:
            path: {{ .Values.conf.ceilometer_compute_kata.DEFAULT.kata_runtime_socket | dir }}
            type: Directory
        - name: machine-id
          hostPath:
            path: /etc/machine-id
{{ if $mounts_ceilometer_compute_kata.volumes }}{{ toYaml $mounts_ceilometer_compute_kata.volumes | indent 8 }}{{ end }}
{{- end }}
