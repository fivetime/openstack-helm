{{/*
The passthrough every deployment here needs: the shared gateway route
table (overrides/gateway-common.yaml) is handed to each release as
values and rendered through this. ⚠️ A bare manifest passed with
--values and *not* under `extraObjects` is silently nothing -- helm
exits 0 and the object is never created.
*/}}
{{ range .Values.extraObjects }}
---
{{ if typeIs "string" . }}
    {{- tpl . $ }}
{{- else }}
    {{- tpl (toYaml .) $ }}
{{- end }}
{{ end }}
