{{/*
⚠️ A migration that adds a column must run *before* the code that reads
it, and a `rollout restart` does not run this. So an upgrade carrying a
migration runs this job first and rolls the deployment after -- which is
the order the deploy runbook spells out, and the order this hook keeps:
pre-upgrade, before the deployment is patched.
*/}}
{{- if .Values.manifests.job_db_sync }}
{{- $envAll := . }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: daas-db-sync
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
  labels:
{{ tuple $envAll "daas" "db-sync" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
{{ tuple $envAll "daas" "db-sync" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 8 }}
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        {{ .Values.labels.job.node_selector_key }}: {{ .Values.labels.job.node_selector_value }}
      containers:
        - name: daas-db-sync
{{ tuple $envAll "daas_db_sync" | include "helm-toolkit.snippets.image" | indent 10 }}
{{ tuple $envAll $envAll.Values.pod.resources.jobs.db_sync | include "helm-toolkit.snippets.kubernetes_resources" | indent 10 }}
          command:
            - daas-db-manage
          args:
            - --config-file
            - /etc/daas/daas.conf
            - upgrade
          volumeMounts:
            - name: etc
              mountPath: /etc/daas/daas.conf
              subPath: daas.conf
              readOnly: true
      volumes:
        - name: etc
          secret:
            secretName: {{ .Values.secrets.config.gateway }}
            defaultMode: 0444
{{- end }}
