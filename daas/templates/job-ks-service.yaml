{{/*
Registers the *self-service* API, not the Engine API. Only one of them
belongs in a catalog: a client that discovered the Docker endpoint there
would speak OpenStack to something that answers Docker.

⚠️ The Horizon panels declare `permissions = openstack.services.daas`,
so without this service type they vanish from the navigation with no
error on either side. And openstack_auth snapshots the catalog into the
session at login: after registering, an already-signed-in user must log
out and back in before the panels appear.
*/}}
{{- if .Values.manifests.job_ks_service }}
{{- $ksServiceJob := dict "envAll" . "serviceName" "daas" "serviceTypes" ( tuple "daas" ) -}}
{{ $ksServiceJob | include "helm-toolkit.manifests.job_ks_service" }}
{{- end }}
