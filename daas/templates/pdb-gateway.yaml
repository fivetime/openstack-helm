{{/*
A node drain that takes both gateway pods at once cuts every
tenant's docker session and every build in flight; one must stay.
*/}}
{{- if .Values.manifests.pdb_gateway }}
{{- $envAll := . }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: daas-gateway
spec:
  minAvailable: {{ .Values.pod.lifecycle.disruption_budget.gateway.min_available }}
  selector:
    matchLabels:
{{ tuple $envAll "daas" "gateway" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 6 }}
{{- end }}
