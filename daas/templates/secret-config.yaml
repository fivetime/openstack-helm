{{/*
daas.conf, for a deployment that keeps it here.

Off by default (`conf.rendered`), because the file names a database
password, a service credential and the tenant CA's passphrase: an
existing deployment keeps them in a secret it made itself and points
`secrets.config.gateway` at it. Rendering here is for a fresh install
whose values already carry those.
*/}}
{{- if and .Values.manifests.secret_config .Values.conf.rendered }}
{{- $envAll := . }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.config.gateway }}
type: Opaque
data:
  daas.conf: {{ include "helm-toolkit.utils.to_oslo_conf" .Values.conf.daas | b64enc }}
{{- end }}
