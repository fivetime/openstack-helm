{{/*
ClusterIP, deliberately. This is management-plane HTTP -- the dashboard
calls it from inside the cluster with the signed-in user's token. It is
also the only pod holding the tenant CA key, which is a second reason
not to publish it on a load balancer.
*/}}
{{- if .Values.manifests.service_api }}
{{- $envAll := . }}
---
apiVersion: v1
kind: Service
metadata:
  name: daas-api
  labels:
{{ tuple $envAll "daas" "api" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
spec:
  type: ClusterIP
  selector:
    application: daas
    component: api
  ports:
    - name: api
      protocol: TCP
      port: {{ .Values.conf.daas.selfservice.bind_port }}
      targetPort: {{ .Values.conf.daas.selfservice.bind_port }}
{{- end }}
