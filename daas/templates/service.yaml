{{- if .Values.manifests.service_gateway }}
{{- $envAll := . }}
---
apiVersion: v1
kind: Service
metadata:
  name: daas-gateway
  labels:
{{ tuple $envAll "daas" "gateway" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
{{- range $key, $value := .Values.network.gateway.service.labels }}
    {{ $key }}: {{ $value | quote }}
{{- end }}
{{- if .Values.network.gateway.service.annotations }}
  annotations:
{{ toYaml .Values.network.gateway.service.annotations | indent 4 }}
{{- end }}
spec:
  type: {{ .Values.network.gateway.service.type }}
{{- if .Values.network.gateway.service.ip_families }}
  # Dual-stack where the pool has both. ⚠️ Not cosmetic: the name tenants
  # type has an AAAA somewhere (a public DNS zone, most likely), and a
  # client that prefers IPv6 will follow it. If that address is not this
  # gateway, the tenant's docker hangs on something else entirely and the
  # error names neither.
  ipFamilyPolicy: {{ .Values.network.gateway.service.ip_family_policy }}
  ipFamilies:
{{ toYaml .Values.network.gateway.service.ip_families | indent 4 }}
{{- end }}
{{- if eq .Values.network.gateway.service.type "LoadBalancer" }}
  # The Engine API checks the client certificate in this process, so
  # nothing in front may terminate that handshake. See values for why
  # the policy is Cluster: BGP here speaks only from the network nodes.
  externalTrafficPolicy: {{ .Values.network.gateway.service.externalTrafficPolicy }}
{{- end }}
  # ⚠️ The two labels that identify this workload, not the full set.
  # `kubernetes_metadata_labels` also carries `release_group`, and a
  # selector holding it drops every endpoint the moment a release is
  # renamed or a Deployment is replaced -- which is exactly when the
  # connections it is carrying (a `logs -f`, a build) must not be cut.
  selector:
    application: daas
    component: gateway
  {{/*
  Ports from the same endpoint entries the tenant-facing addresses are
  derived from. Written twice, they agree until somebody moves one.
  */}}
  ports:
    - name: docker-api
      protocol: TCP
      port: {{ tuple "daas_docker" "internal" "api" . | include "helm-toolkit.endpoints.endpoint_port_lookup" }}
      targetPort: {{ tuple "daas_docker" "internal" "api" . | include "helm-toolkit.endpoints.endpoint_port_lookup" }}
    - name: docker-ssh
      protocol: TCP
      port: {{ tuple "daas_ssh" "internal" "ssh" . | include "helm-toolkit.endpoints.endpoint_port_lookup" }}
      targetPort: {{ tuple "daas_ssh" "internal" "ssh" . | include "helm-toolkit.endpoints.endpoint_port_lookup" }}
{{/*
  No self-service port here. That API is management-plane HTTP served by
  daas-api on a ClusterIP -- this Service is the one tenants dial with a
  docker client, and it publishes only what speaks Docker.
*/}}
{{- end }}
