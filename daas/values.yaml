---
# The Docker Engine API gateway.
#
# Two ways in and one process. The Engine API (2376) authenticates with a
# client certificate and the ssh:// entrance (2222) with a public key --
# both belong to the tenant's docker client. The self-service API (9518)
# authenticates with a keystone token, because a tenant who has no
# account yet has neither of the other two, and that is the one a
# browser (and the Horizon plugin) reaches.

labels:
  gateway:
    node_selector_key: openstack-control-plane
    node_selector_value: enabled
  api:
    node_selector_key: openstack-control-plane
    node_selector_value: enabled
  job:
    node_selector_key: openstack-control-plane
    node_selector_value: enabled

images:
  tags:
    daas: ghcr.io/fivetime/openstackhelm/daas:2026.1-ubuntu_noble
    daas_db_sync: ghcr.io/fivetime/openstackhelm/daas:2026.1-ubuntu_noble
    ks_service: docker.io/openstackhelm/heat:2024.1-ubuntu_jammy
    ks_endpoints: docker.io/openstackhelm/heat:2024.1-ubuntu_jammy
    dep_check: quay.io/airshipit/kubernetes-entrypoint:latest-ubuntu_jammy
    image_repo_sync: docker.io/library/docker:17.07.0
  pull_policy: Always
  local_registry:
    active: false
    exclude:
      - dep_check
      - image_repo_sync

pod:
  replicas:
    gateway: 2
    api: 2
  spread:
    gateway:
      # Spread across nodes for availability; nothing depends on it now
      # that traffic policy is Cluster, so a skewed placement during a
      # rolling update is allowed rather than left Pending.
      enabled: true
      when_unsatisfiable: ScheduleAnyway
  lifecycle:
    upgrades:
      deployments:
        revision_history: 3
        pod_replacement_strategy: RollingUpdate
        rolling_update:
          max_unavailable: 1
          max_surge: 1
    # A tenant's `docker logs -f`, `attach` and buildx session live on a
    # connection this process holds. Given time to finish rather than cut
    # at the default 30s, which is how a build that was nearly done ends
    # in a transport error the tenant cannot read.
    termination_grace_period:
      gateway:
        timeout: 300
  resources:
    enabled: false
    gateway:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "2048Mi"
        cpu: "2000m"
    api:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "1024Mi"
        cpu: "1000m"
    jobs:
      db_sync:
        requests:
          memory: "128Mi"
          cpu: "100m"
      ks_service:
        requests:
          memory: "128Mi"
          cpu: "100m"
      ks_endpoints:
        requests:
          memory: "128Mi"
          cpu: "100m"
  # ⚠️ The tenant CA's key is mounted 0400 and owned by root. Without an
  # fsGroup the kubelet leaves it that way and the process -- which is
  # not root -- cannot read it: every pod crashes at start with
  # `PermissionError` on load_cert_chain, and the deployment looks like
  # an image problem. 42430 is the uid the image's `daas` user has.
  security_context:
    gateway:
      pod:
        runAsUser: 42430
        runAsGroup: 42430
        fsGroup: 42430
    api:
      pod:
        runAsUser: 42430
        runAsGroup: 42430
        fsGroup: 42430
  probes:
    gateway:
      daas:
        readiness:
          enabled: true
          params:
            initialDelaySeconds: 5
            periodSeconds: 10
        liveness:
          enabled: true
          params:
            initialDelaySeconds: 20
            periodSeconds: 20

network:
  gateway:
    # LoadBalancer rather than an ingress: the Engine API's client
    # certificate is checked by this process, so nothing in front of it
    # may terminate that TLS handshake. Layer 4 all the way in.
    #
    # ⚠️ Cluster, not Local. cilium BGP speaks only from the network
    # nodes here, and with Local it advertises a service only from
    # nodes holding a backend -- the gateway runs on control nodes, so
    # its address was never announced at all and reached the cluster
    # by a fabric aggregate route nobody had chosen. Local would buy
    # the tenant's source address, and nothing reads it: the audit log
    # records project and certificate, not where the connection came
    # from (checked, 2026-09-06).
    service:
      type: LoadBalancer
      externalTrafficPolicy: Cluster
      labels:
        # Which pool the address comes from …
        io.cilium/ip-pool-public: "true"
        # … and ⚠️ that it is advertised at all. The BGP advertisement
        # selects on this key existing (`bgp-advertisement-external-ip`,
        # matchExpressions: Exists). Without it the address is allocated
        # and looks perfectly healthy in `kubectl get svc` while nothing
        # outside the cluster is told where to send it.
        io.cilium/bgp-advertise-external-ip: "true"
      # Both families where the pool offers both; a deployment with an
      # IPv4-only pool sets ip_families to null.
      ip_family_policy: PreferDualStack
      ip_families:
        - IPv4
        - IPv6
      annotations: {}

conf:
  # Whether this chart writes /etc/daas/daas.conf. A deployment that
  # keeps its configuration in a secret of its own (with a database
  # password and service credentials in it) sets this false and names
  # that secret in `secrets.config.gateway`.
  rendered: false
  daas:
    DEFAULT:
      debug: false
    gateway:
      # `::` and not `0.0.0.0`: with IPV6_V6ONLY cleared this one socket
      # serves both families, and a dual-stack Service in front needs it
      # to. Bound to 0.0.0.0 the v6 half of that Service reaches a pod
      # where nothing is listening, and the tenant gets a connection
      # reset from a service every dashboard says is healthy.
      bind_host: '::'
      bind_port: 2376
      docker_api_version: "1.44"
    selfservice:
      enabled: true
      # See gateway.bind_host.
      bind_host: '::'
      bind_port: 9518
      # How long a validated keystone token is remembered.
      token_cache_seconds: 300
      # ⚠️ Left empty on purpose. Both are derived from the
      # `daas_docker` / `daas_ssh` endpoints below, as nova derives its
      # console proxy URLs -- setting one here overrides that, which is
      # for a deployment whose tenants reach the gateway by some path
      # the endpoint entry cannot describe.
      engine_endpoint: null
      ssh_endpoint: null

secrets:
  identity:
    # The catalog jobs run as the cloud's own admin, out of the secret
    # keystone's chart already publishes -- OS_* keys, which is exactly
    # what those jobs read. No password passes through this chart's
    # values, and there is no second copy to drift.
    admin: keystone-keystone-admin
  # Secrets this chart does not make, because they outlive it: the
  # tenant CA and the config that names a database password.
  config:
    gateway: daas-etc
  tls:
    gateway: daas-tls
    # ⚠️ The tenant CA's private key, and the only pod that mounts it is
    # daas-api. Made outside this chart, as the signing Job's is -- a
    # deployment that keeps the CA off the cluster entirely does not
    # create it, and runs the API with `manifests.deployment_api: false`.
    ca: daas-ca

dependencies:
  dynamic:
    common:
      local_image_registry:
        jobs:
          - daas-image-repo-sync
        services:
          - endpoint: node
            service: local_image_registry
  static:
    db_sync:
      jobs: null
    ks_service:
      services:
        - endpoint: internal
          service: identity
    ks_endpoints:
      jobs:
        - daas-ks-service
      services:
        - endpoint: internal
          service: identity
    gateway:
      services:
        - endpoint: internal
          service: identity
        - endpoint: internal
          service: container
    api:
      services:
        - endpoint: internal
          service: identity

endpoints:
  cluster_domain_suffix: cluster.local
  local_image_registry:
    name: docker-registry
    namespace: docker-registry
    hosts:
      default: localhost
      internal: docker-registry
      node: localhost
    host_fqdn_override:
      default: null
    port:
      registry:
        node: 5000
  identity:
    name: keystone
    auth:
      admin:
        region_name: RegionOne
        username: admin
        password: password
        project_name: admin
        user_domain_name: default
        project_domain_name: default
      daas:
        role: admin,service
        region_name: RegionOne
        username: daas
        password: password
        project_name: service
        user_domain_name: service
        project_domain_name: service
    hosts:
      default: keystone
      internal: keystone-api
    host_fqdn_override:
      default: null
    path:
      default: /v3
    scheme:
      default: http
    port:
      api:
        default: 80
        internal: 5000
  # The self-service API, as the catalog will carry it. The Engine API is
  # deliberately *not* in the catalog: it speaks Docker's protocol, not
  # OpenStack's, and a client that found it there would try to.
  #
  # The public entry goes through whatever fronts this cloud's public
  # names; the internal one is what Horizon uses (it is configured with
  # OPENSTACK_ENDPOINT_TYPE = internalURL) and what has to work first.
  daas:
    name: daas
    hosts:
      # The management-plane service, not the docker gateway: this is
      # the one in the catalog, and the one a dashboard calls.
      default: daas-api
      public: daas
    host_fqdn_override:
      default: null
    path:
      default: null
    scheme:
      default: http
    port:
      api:
        default: 9518
        public: 80
  # The two addresses a tenant types at their docker client. Structured
  # entries rather than strings in `conf`, the way nova carries the
  # console proxies: the Service publishes the port from here, and the
  # sentence handed to the tenant is derived from here, so the two
  # cannot say different things.
  #
  # ⚠️ `host_fqdn_override.public` is the real name tenants resolve, and
  # it must be in the gateway certificate's SANs -- a name that is not
  # there fails the TLS handshake with an error about the certificate,
  # which reads as the tenant's problem and is not.
  daas_docker:
    name: daas-gateway
    hosts:
      default: daas-gateway
      public: daas
    host_fqdn_override:
      default: null
    path:
      default: null
    scheme:
      # docker's own scheme for a TLS endpoint. It is what goes in
      # `docker context create --docker host=...`.
      default: tcp
    port:
      api:
        default: 2376
        public: 2376
  daas_ssh:
    name: daas-gateway
    hosts:
      default: daas-gateway
      public: daas
    host_fqdn_override:
      default: null
    path:
      default: null
    scheme:
      default: ssh
    port:
      ssh:
        default: 2222
        public: 2222
  container:
    name: zun
    hosts:
      default: zun-api
      public: zun
    host_fqdn_override:
      default: null
    path:
      default: /v1
    scheme:
      default: http
    port:
      api:
        default: 9517
        public: 80

# Objects handed in by a deployment: the shared gateway route table, a
# companion Service for a public FQDN, anything else that belongs beside
# this release rather than in the chart.
extraObjects: []

manifests:
  configmap_bin: true
  configmap_api_conf: true
  deployment_gateway: true
  deployment_api: true
  service_gateway: true
  service_api: true
  secret_config: false
  job_db_sync: false
  job_ks_service: true
  job_ks_endpoints: true
  job_image_repo_sync: false
...
