{{/*
dashboards/incus.json is grafana/incus.json of github.com/fivetime/incus at
9d31814a93669e38d6b6a2a8215175f546f582d1, the official Incus dashboard (grafana.com
19727), without its two Loki log panels and with the uid incus-official.
The Prometheus data source input is filled in here, because the Grafana
sidecar provisions dashboards as they are and does not resolve inputs.
*/}}

{{- if .Values.manifests.configmap_grafana_dashboard }}
{{- $envAll := . }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: incus-grafana-dashboard
  labels:
{{ tuple $envAll .Chart.Name "incusd" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
    grafana_dashboard: "1"
data:
  incus.json: |
{{ .Files.Get "dashboards/incus.json" | replace "${DS_PROMETHEUS}" .Values.monitoring.grafana.prometheus_datasource_uid | indent 4 }}
{{- end }}
