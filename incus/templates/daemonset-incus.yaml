{{- define "incusReadyProbeTemplate" }}
exec:
  command:
    - /tmp/incus-ready.sh
{{- end }}

{{- define "incusLivenessProbeTemplate" }}
exec:
  command:
    - /usr/local/sbin/healthcheck.sh
{{- end }}

{{- if .Values.manifests.daemonset_incus }}
{{- $envAll := . }}
{{- $serviceAccountName := "incus" }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: incusd
  annotations:
    {{ tuple $envAll | include "helm-toolkit.snippets.release_uuid" }}
  labels:
{{ tuple $envAll .Chart.Name "incusd" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
spec:
  selector:
    matchLabels:
{{ tuple $envAll .Chart.Name "incusd" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 6 }}
{{ tuple $envAll "incus" | include "helm-toolkit.snippets.kubernetes_upgrades_daemonset" | indent 2 }}
  template:
    metadata:
      labels:
{{ tuple $envAll .Chart.Name "incusd" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 8 }}
      annotations:
{{ tuple $envAll | include "helm-toolkit.snippets.release_uuid" | indent 8 }}
        configmap-bin-hash: {{ tuple "configmap-bin.yaml" . | include "helm-toolkit.utils.hash" }}
        # Required by containerd versions that do not apply the stable
        # securityContext AppArmor field to privileged hostPID containers.
        container.apparmor.security.beta.kubernetes.io/incusd: unconfined
    spec:
      serviceAccountName: {{ $serviceAccountName }}
      automountServiceAccountToken: false
      hostNetwork: true
      hostPID: true
      dnsPolicy: {{ .Values.pod.dns_policy }}
{{ dict "envAll" $envAll "application" "incus" | include "helm-toolkit.snippets.kubernetes_pod_security_context" | indent 6 }}
      nodeSelector:
        {{ .Values.labels.agent.incus.node_selector_key }}: {{ .Values.labels.agent.incus.node_selector_value | quote }}
{{- if .Values.pod.tolerations.incus.enabled }}
{{ tuple $envAll "incus" | include "helm-toolkit.snippets.kubernetes_tolerations" | indent 6 }}
{{- end }}
      terminationGracePeriodSeconds: 135
      containers:
        - name: incusd
{{ tuple $envAll "incus" | include "helm-toolkit.snippets.image" | indent 10 }}
{{ dict "envAll" $envAll "application" "incus" "container" "incus" | include "helm-toolkit.snippets.kubernetes_container_security_context" | indent 10 }}
          env:
            - name: INCUS_RUNTIME_ROLE
              value: incusd
            - name: INCUS_MIGRATION_ENABLED
              value: {{ .Values.incus.migration.enabled | quote }}
            - name: INCUS_MIGRATION_INTERFACE
              value: {{ default "" .Values.incus.migration.interface | quote }}
            - name: INCUS_MIGRATION_NETWORK_CIDR
              value: {{ default "" .Values.incus.migration.network_cidr | quote }}
            - name: INCUS_MIGRATION_PORT
              value: {{ .Values.incus.migration.port | quote }}
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: INCUS_SOCKET_GID
              value: {{ .Values.incus.socket_gid | quote }}
            - name: INCUS_CONTROL_CGROUP
              value: {{ .Values.incus.control_cgroup | quote }}
          lifecycle:
            postStart:
              exec:
                command:
                  - /tmp/incus-migration-listener.sh
                  - configure
{{ dict "envAll" $envAll "component" "incus" "container" "incus" "type" "startup" "probeTemplate" (include "incusReadyProbeTemplate" $envAll | fromYaml) | include "helm-toolkit.snippets.kubernetes_probe" | indent 10 }}
{{ dict "envAll" $envAll "component" "incus" "container" "incus" "type" "readiness" "probeTemplate" (include "incusReadyProbeTemplate" $envAll | fromYaml) | include "helm-toolkit.snippets.kubernetes_probe" | indent 10 }}
{{ dict "envAll" $envAll "component" "incus" "container" "incus" "type" "liveness" "probeTemplate" (include "incusLivenessProbeTemplate" $envAll | fromYaml) | include "helm-toolkit.snippets.kubernetes_probe" | indent 10 }}
{{ tuple $envAll $envAll.Values.pod.resources.incus | include "helm-toolkit.snippets.kubernetes_resources" | indent 10 }}
          volumeMounts:
            - name: incus-bin
              mountPath: /tmp/incus-ready.sh
              subPath: incus-ready.sh
              readOnly: true
            - name: incus-bin
              mountPath: /tmp/incus-migration-listener.sh
              subPath: incus-migration-listener.sh
              readOnly: true
            - name: state
              mountPath: {{ .Values.incus.state_path }}
              mountPropagation: Bidirectional
            - name: runtime
              mountPath: {{ .Values.incus.runtime_path }}
              mountPropagation: Bidirectional
            - name: logs
              mountPath: {{ .Values.incus.log_path }}
            - name: lxcfs
              mountPath: {{ .Values.incus.lxcfs_path }}
              readOnly: true
              mountPropagation: HostToContainer
            - name: devices
              mountPath: {{ .Values.incus.devices_path }}
            - name: cgroup
              mountPath: {{ .Values.incus.cgroup_path }}
            - name: securityfs
              mountPath: {{ .Values.incus.securityfs_path }}
            - name: udev
              mountPath: {{ .Values.incus.udev_path }}
              readOnly: true
            - name: modules
              mountPath: {{ .Values.incus.modules_path }}
              readOnly: true
{{- if .Values.incus.ceph.enabled }}
            - name: ceph
              mountPath: {{ .Values.incus.ceph.config_path }}
              readOnly: true
{{- end }}
      volumes:
        - name: incus-bin
          configMap:
            name: incus-bin
            defaultMode: 0555
        - name: state
          hostPath:
            path: {{ .Values.incus.state_path }}
            type: Directory
        - name: runtime
          hostPath:
            path: {{ .Values.incus.runtime_path }}
            type: Directory
        - name: logs
          hostPath:
            path: {{ .Values.incus.log_path }}
            type: Directory
        - name: lxcfs
          hostPath:
            path: {{ .Values.incus.lxcfs_path }}
            type: Directory
        - name: devices
          hostPath:
            path: {{ .Values.incus.devices_path }}
            type: Directory
        - name: cgroup
          hostPath:
            path: {{ .Values.incus.cgroup_path }}
            type: Directory
        - name: securityfs
          hostPath:
            path: {{ .Values.incus.securityfs_path }}
            type: Directory
        - name: udev
          hostPath:
            path: {{ .Values.incus.udev_path }}
            type: Directory
        - name: modules
          hostPath:
            path: {{ .Values.incus.modules_path }}
            type: Directory
{{- if .Values.incus.ceph.enabled }}
        - name: ceph
          hostPath:
            path: {{ .Values.incus.ceph.config_path }}
            type: Directory
{{- end }}
{{- end }}
