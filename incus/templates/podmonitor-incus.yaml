{{- if .Values.manifests.podmonitor_incus }}
{{- if not (and .Values.incus.metrics.enabled .Values.incus.migration.enabled) }}
{{- fail "manifests.podmonitor_incus needs incus.metrics.enabled and incus.migration.enabled: metrics are served on the migration listener" }}
{{- end }}
{{- $envAll := . }}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: incus
  labels:
{{ tuple $envAll .Chart.Name "incusd" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
spec:
  jobLabel: application
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      application: incus
      component: incusd
  podMetricsEndpoints:
    # incusd runs on the host network, so the pod address is the node
    # address the listener and its certificate cover.
    - portNumber: {{ .Values.incus.migration.port }}
      scheme: https
      path: /1.0/metrics
      interval: {{ .Values.monitoring.incus.scrape_interval }}
      tlsConfig:
        ca:
          secret:
            name: {{ .Values.incus.metrics.secret_name }}
            key: ca.crt
        cert:
          secret:
            name: {{ .Values.incus.metrics.secret_name }}
            key: tls.crt
        keySecret:
          name: {{ .Values.incus.metrics.secret_name }}
          key: tls.key
      relabelings:
        - action: replace
          sourceLabels:
            - __meta_kubernetes_pod_node_name
          targetLabel: node
        # The official dashboard treats a job as one Incus deployment and
        # selects by it. Every incusd here is a standalone server, so each
        # node is its own job: the dashboard's job selector picks a node.
        - action: replace
          sourceLabels:
            - __meta_kubernetes_pod_node_name
          targetLabel: job
          replacement: incus-$1
{{- end }}
