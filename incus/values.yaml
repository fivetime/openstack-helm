---
release_group: null

images:
  local_registry:
    active: false
    exclude:
      - image_repo_sync
  pull_policy: IfNotPresent
  tags:
    image_repo_sync: quay.io/airshipit/docker:27.5.0
    incus: ghcr.io/fivetime/incus@sha256:5c24c5914373aa3859f2809605945d10a1897d38a1ff674a4979852cf11ae2e7

labels:
  agent:
    incus:
      node_selector_key: openstack-incus-compute
      node_selector_value: enabled
  job:
    node_selector_key: openstack-control-plane
    node_selector_value: enabled

dependencies:
  dynamic:
    common:
      local_image_registry:
        jobs:
          - incus-image-repo-sync
        services:
          - endpoint: node
            service: local_image_registry
  static:
    image_repo_sync:
      services:
        - endpoint: internal
          service: local_image_registry
    incus:
      jobs: null

pod:
  dns_policy: ClusterFirstWithHostNet
  lifecycle:
    upgrades:
      daemonsets:
        incus:
          enabled: true
          max_unavailable: 1
          min_ready_seconds: 10
        pod_replacement_strategy: RollingUpdate
  probes:
    incus:
      incus:
        liveness:
          enabled: true
          params:
            failureThreshold: 3
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
        readiness:
          enabled: true
          params:
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 5
        startup:
          enabled: true
          params:
            failureThreshold: 24
            periodSeconds: 5
            timeoutSeconds: 5
  resources:
    enabled: false
    incus:
      limits: {}
      requests:
        cpu: 100m
        memory: 256Mi
    jobs:
      image_repo_sync:
        limits:
          cpu: "2000m"
          memory: 1024Mi
        requests:
          cpu: 100m
          memory: 128Mi
  security_context:
    incus:
      container:
        incus:
          allowPrivilegeEscalation: true
          appArmorProfile:
            type: Unconfined
          privileged: true
          readOnlyRootFilesystem: false
          seccompProfile:
            type: Unconfined
      pod:
        runAsUser: 0
  tolerations:
    incus:
      enabled: true
      tolerations:
        - effect: NoSchedule
          key: openstack-incus-compute
          operator: Equal
          value: "true"

secrets:
  oci_image_registry:
    incus: incus-oci-image-registry-key

endpoints:
  cluster_domain_suffix: cluster.local
  local_image_registry:
    host_fqdn_override:
      default: null
    hosts:
      default: localhost
      internal: docker-registry
      node: localhost
    name: docker-registry
    namespace: docker-registry
    port:
      registry:
        node: 5000
  oci_image_registry:
    auth:
      enabled: false
      incus:
        password: password
        username: incus
    host_fqdn_override:
      default: null
    hosts:
      default: localhost
    name: oci-image-registry
    namespace: oci-image-registry
    port:
      registry:
        default: null

incus:
  ceph:
    config_path: /etc/ceph
    enabled: true
  cgroup_path: /sys/fs/cgroup
  control_cgroup: /osh-incus
  devices_path: /dev
  log_path: /var/log/incus
  lxcfs_path: /var/lib/lxcfs
  modules_path: /lib/modules
  runtime_path: /run/incus
  securityfs_path: /sys/kernel/security
  socket: /var/lib/incus/unix.socket
  # Must match the Nova Incus Pod supplemental group and the compute image's
  # incus-admin GID so the non-root nova process can connect to this socket.
  socket_gid: 42425
  state_path: /var/lib/incus
  udev_path: /run/udev
  migration:
    enabled: false
    # An explicit interface wins. Otherwise network_cidr selects the
    # interface holding that route. When both are null, status.hostIP is used.
    # These values must match nova.incus_migration.
    interface: null
    network_cidr: null
    port: 8443

manifests:
  configmap_bin: true
  daemonset_incus: true
  job_image_repo_sync: true
  secret_registry: true

# -- Extra K8s manifests to deploy. Either a list or a map of manifests.
## Note: Supports use of custom Helm templates
## Note: Helm replaces (instead of merging) list values when several values
## files are combined, so if you need to define extraObjects in more than one
## overrides file, use the map form and make sure the keys are unique across
## those files. With the list form only the last file takes effect.
extraObjects: {}
...
