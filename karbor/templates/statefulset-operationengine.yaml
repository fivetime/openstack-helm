{{/*
manifests.deployment_operationengine defaulted to true, so an override that
set it to false to disable the engine would otherwise be silently ignored
after the rename and the engine would start.
*/}}
{{- if hasKey .Values.manifests "deployment_operationengine" }}
{{- fail "manifests.deployment_operationengine has been removed, the operation engine runs as a StatefulSet under manifests.statefulset_operationengine" }}
{{- end }}

{{- if .Values.manifests.statefulset_operationengine }}
{{- $envAll := . }}

{{- $mounts_karbor_operationengine := .Values.pod.mounts.karbor_operationengine.karbor_operationengine }}
{{- $mounts_karbor_operationengine_init := .Values.pod.mounts.karbor_operationengine.init_container }}

{{- $serviceAccountName := "karbor-operationengine" }}
{{ tuple $envAll "operationengine" $serviceAccountName | include "helm-toolkit.snippets.kubernetes_pod_rbac_serviceaccount" }}

{{- $etcSources := .Values.pod.etcSources.karbor_operationengine }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: karbor-operationengine
  annotations:
    {{ tuple $envAll | include "helm-toolkit.snippets.release_uuid" }}
  labels:
{{ tuple $envAll "karbor" "operationengine" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
spec:
  # Each engine process is a service of its own, named after its pod: the
  # StatefulSet keeps the names (karbor-operationengine-0, -1...) across
  # restarts and rollouts, so the service records and the RPC server queues
  # of the engines do not pile up. The engines share the scheduled
  # operations through the database (karbor 2.0.15 and later): any number
  # may run, and a rollout may replace them one by one.
  serviceName: karbor-operationengine
{{ tuple $envAll | include "helm-toolkit.snippets.kubernetes_upgrades_statefulset" | indent 2 }}
  replicas: {{ .Values.pod.replicas.operationengine }}
  selector:
    matchLabels:
{{ tuple $envAll "karbor" "operationengine" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 6 }}
  template:
    metadata:
      labels:
{{ tuple $envAll "karbor" "operationengine" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 8 }}
      annotations:
{{ tuple $envAll | include "helm-toolkit.snippets.release_uuid" | indent 8 }}
        configmap-bin-hash: {{ tuple "configmap-bin.yaml" . | include "helm-toolkit.utils.hash" }}
        configmap-etc-hash: {{ tuple "configmap-etc.yaml" . | include "helm-toolkit.utils.hash" }}
{{ tuple "karbor_operationengine" . | include "helm-toolkit.snippets.custom_pod_annotations" | indent 8 }}
{{ dict "envAll" $envAll "podName" "karbor-operationengine" "containerNames" (list "karbor-operationengine" "init" ) | include "helm-toolkit.snippets.kubernetes_mandatory_access_control_annotation" | indent 8 }}
    spec:
{{ tuple "karbor_operationengine" . | include "helm-toolkit.snippets.kubernetes_pod_priority_class" | indent 6 }}
{{ tuple "karbor_operationengine" . | include "helm-toolkit.snippets.kubernetes_pod_runtime_class" | indent 6 }}
      serviceAccountName: {{ $serviceAccountName }}
{{ dict "envAll" $envAll "application" "karbor" | include "helm-toolkit.snippets.kubernetes_pod_security_context" | indent 6 }}
      affinity:
{{- tuple $envAll "karbor" "operationengine" | include "helm-toolkit.snippets.kubernetes_pod_anti_affinity" | indent 8 }}
      nodeSelector:
        {{ .Values.labels.operationengine.node_selector_key }}: {{ .Values.labels.operationengine.node_selector_value }}
{{ if $envAll.Values.pod.tolerations.karbor.enabled }}
{{ tuple $envAll "karbor" | include "helm-toolkit.snippets.kubernetes_tolerations" | indent 6 }}
{{ end }}
      terminationGracePeriodSeconds: {{ .Values.pod.lifecycle.termination_grace_period.operationengine.timeout | default "30" }}
      initContainers:
{{ tuple $envAll "operationengine" $mounts_karbor_operationengine_init | include "helm-toolkit.snippets.kubernetes_entrypoint_init_container" | indent 8 }}
      containers:
        - name: karbor-operationengine
{{ tuple $envAll "karbor_operationengine" | include "helm-toolkit.snippets.image" | indent 10 }}
{{ tuple $envAll $envAll.Values.pod.resources.operationengine | include "helm-toolkit.snippets.kubernetes_resources" | indent 10 }}
{{ dict "envAll" $envAll "application" "karbor" "container" "karbor_operationengine" | include "helm-toolkit.snippets.kubernetes_container_security_context" | indent 10 }}
          env:
            # [DEFAULT] host, over the one the services share (conf.karbor).
            - name: OS_DEFAULT__HOST
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
{{- if .Values.secrets.tls.ca }}
            - name: REQUESTS_CA_BUNDLE
              value: "/etc/ssl/certs/openstack-helm.crt"
{{- end }}
          command:
            - karbor-operationengine
            - --config-file
            - /etc/karbor/karbor.conf
            - --config-dir
            - /etc/karbor/karbor.conf.d
          volumeMounts:
            - name: pod-tmp
              mountPath: /tmp
            - name: oslo-lock-path
              mountPath: {{ .Values.conf.karbor.oslo_concurrency.lock_path }}
            - name: pod-etc-karbor
              mountPath: /etc/karbor
            - name: pod-var-lib-karbor
              mountPath: {{ .Values.conf.karbor.DEFAULT.state_path }}
            - name: karbor-etc
              mountPath: /etc/karbor/karbor.conf
              subPath: karbor.conf
              readOnly: true
            - name: karbor-etc-snippets
              mountPath: /etc/karbor/karbor.conf.d/
              readOnly: true
            {{ if .Values.conf.karbor.DEFAULT.log_config_append }}
            - name: karbor-etc
              mountPath: {{ .Values.conf.karbor.DEFAULT.log_config_append }}
              subPath: {{ base .Values.conf.karbor.DEFAULT.log_config_append }}
              readOnly: true
            {{ end }}
            - name: karbor-etc
              mountPath: /etc/karbor/policy.yaml
              subPath: policy.yaml
              readOnly: true
{{- dict "enabled" $envAll.Values.tls.oslo_db "name" "client-certs" "path" "/etc/mysql/certs" | include "helm-toolkit.snippets.tls_volume_mount" | indent 12 }}
{{- dict "enabled" (not (empty .Values.secrets.tls.ca)) "name" .Values.secrets.tls.ca | include "helm-toolkit.snippets.tls_volume_mount" | indent 12 }}
{{- dict "enabled" $envAll.Values.tls.oslo_messaging "name" "client-certs" "path" "/etc/rabbitmq/certs" | include "helm-toolkit.snippets.tls_volume_mount" | indent 12 }}
{{ if $mounts_karbor_operationengine.volumeMounts }}{{ toYaml $mounts_karbor_operationengine.volumeMounts | indent 12 }}{{ end }}
      volumes:
        - name: pod-tmp
          emptyDir: {}
        - name: oslo-lock-path
          emptyDir: {}
        - name: pod-etc-karbor
          emptyDir: {}
        - name: pod-var-lib-karbor
          emptyDir: {}
        - name: karbor-bin
          configMap:
            name: karbor-bin
            defaultMode: 0555
        - name: karbor-etc
          secret:
            secretName: karbor-etc
            defaultMode: 0444
        - name: karbor-etc-snippets
{{- if $etcSources }}
          projected:
            sources:
{{ toYaml $etcSources | indent 14 }}
{{- else }}
          emptyDir: {}
{{ end }}
{{- dict "enabled" (or $envAll.Values.tls.oslo_db $envAll.Values.tls.oslo_messaging) "name" "client-certs" "secretName" $envAll.Values.secrets.tls.client.karbor | include "helm-toolkit.snippets.tls_volume" | indent 8 }}
{{- dict "enabled" (not (empty .Values.secrets.tls.ca)) "name" .Values.secrets.tls.ca | include "helm-toolkit.snippets.tls_volume" | indent 8 }}
{{ if $mounts_karbor_operationengine.volumes }}{{ toYaml $mounts_karbor_operationengine.volumes | indent 8 }}{{ end }}
{{- end }}
