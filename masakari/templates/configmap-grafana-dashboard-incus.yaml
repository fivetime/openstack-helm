{{/*
The per-node LXCFS, AppArmor and self-healing view of the Incus monitor,
picked up by the Grafana sidecar. dashboards/incus-nodes.json is generated
by tools/dashboards/masakari-incus-nodes.py. Its instance table links to the
official Incus dashboard of the incus chart (uid incus-official), which
selects an Incus server by job incus-<node>.
*/}}

{{- if .Values.manifests.configmap_grafana_dashboard_incus_monitor }}
{{- if not .Values.manifests.incus_monitor }}
{{- fail "manifests.configmap_grafana_dashboard_incus_monitor needs manifests.incus_monitor" }}
{{- end }}
{{- $envAll := . }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: masakari-incus-grafana-dashboard
  labels:
{{ tuple $envAll .Chart.Name "masakari-incus-monitor" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
    grafana_dashboard: "1"
data:
  incus-nodes.json: |
{{ .Files.Get "dashboards/incus-nodes.json" | replace "${DS_PROMETHEUS}" .Values.monitoring.grafana.prometheus_datasource_uid | indent 4 }}
{{- end }}
