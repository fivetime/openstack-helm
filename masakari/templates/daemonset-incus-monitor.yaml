{{- if .Values.manifests.incus_monitor }}
{{- $envAll := . }}
{{- $daemonset := "masakari-incus-monitor" }}

{{- $mounts_incus_exporter := .Values.pod.mounts.masakari_incus_monitor.incus_exporter }}
{{- $mounts_incus_notifier := .Values.pod.mounts.masakari_incus_monitor.incus_notifier }}
{{- $mounts_incus_monitor_init := .Values.pod.mounts.masakari_incus_monitor.init_container }}

{{- $serviceAccountName := "masakari-incus-monitor" }}
{{- tuple $envAll "masakari_incus_monitor" $serviceAccountName | include "helm-toolkit.snippets.kubernetes_pod_rbac_serviceaccount" }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: masakari-incus-monitor
  annotations:
    {{ tuple $envAll | include "helm-toolkit.snippets.release_uuid" }}
  labels:
{{ tuple $envAll .Chart.Name $daemonset | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
spec:
  selector:
    matchLabels:
{{ tuple $envAll .Chart.Name $daemonset | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 6 }}
{{ tuple $envAll "incus_monitor" | include "helm-toolkit.snippets.kubernetes_upgrades_daemonset" | indent 2 }}
  template:
    metadata:
      labels:
{{ tuple $envAll .Chart.Name $daemonset | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 8 }}
      annotations:
{{ tuple $envAll | include "helm-toolkit.snippets.release_uuid" | indent 8 }}
        configmap-bin-hash: {{ tuple "configmap-bin.yaml" . | include "helm-toolkit.utils.hash" }}
        configmap-etc-hash: {{ tuple "configmap-etc.yaml" . | include "helm-toolkit.utils.hash" }}
        # Required by runtimes that do not apply the stable securityContext
        # AppArmor field to privileged hostPID containers.
        container.apparmor.security.beta.kubernetes.io/incus-exporter: unconfined
{{ tuple "masakari_incus_monitor" . | include "helm-toolkit.snippets.custom_pod_annotations" | indent 8 }}
    spec:
      serviceAccountName: {{ $serviceAccountName }}
      # The exporter reads the mounts of the instances and of process 1
      # from /proc, which shows them only in the host PID namespace.
      hostPID: true
      nodeSelector:
        {{ .Values.labels.incus_monitor.node_selector_key }}: {{ .Values.labels.incus_monitor.node_selector_value }}
{{ if $envAll.Values.pod.tolerations.masakari.enabled }}
{{ tuple $envAll "masakari" | include "helm-toolkit.snippets.kubernetes_tolerations" | indent 6 }}
{{ end }}
      initContainers:
{{ tuple $envAll "masakari_incus_monitor" $mounts_incus_monitor_init | include "helm-toolkit.snippets.kubernetes_entrypoint_init_container" | indent 8 }}
        - name: incus-monitor-init
{{ tuple $envAll "masakari_incus_exporter" | include "helm-toolkit.snippets.image" | indent 10 }}
{{ tuple $envAll $envAll.Values.pod.resources.masakari_incus_exporter | include "helm-toolkit.snippets.kubernetes_resources" | indent 10 }}
{{ dict "envAll" $envAll "application" "masakari" "container" "masakari_incus_notifier" | include "helm-toolkit.snippets.kubernetes_container_security_context" | indent 10 }}
          command:
            - /tmp/masakari-monitors-init.sh
          env:
            - name: COMPUTE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: pod-tmp-notifier
              mountPath: /tmp
            - name: pod-shared
              mountPath: /tmp/pod-shared
            - name: masakari-bin
              mountPath: /tmp/masakari-monitors-init.sh
              subPath: masakari-monitors-init.sh
              readOnly: true
      containers:
        # Privileged and without credentials. Its configuration file holds
        # no [api] section, so nothing it can read opens OpenStack.
        - name: incus-exporter
{{ tuple $envAll "masakari_incus_exporter" | include "helm-toolkit.snippets.image" | indent 10 }}
{{ tuple $envAll $envAll.Values.pod.resources.masakari_incus_exporter | include "helm-toolkit.snippets.kubernetes_resources" | indent 10 }}
{{ dict "envAll" $envAll "application" "masakari" "container" "masakari_incus_exporter" | include "helm-toolkit.snippets.kubernetes_container_security_context" | indent 10 }}
          command:
            - masakari-incus-exporter
            - --config-file
            - /etc/masakari/incus-exporter.conf
            - --config-file
            - /tmp/pod-shared/masakarimonitors.conf
          ports:
            - name: exporter
              containerPort: {{ .Values.conf.incus_exporter.incus_exporter.bind_port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /metrics
              port: exporter
            initialDelaySeconds: 5
            periodSeconds: 30
          volumeMounts:
            - name: pod-tmp-exporter
              mountPath: /tmp
            - name: pod-shared
              mountPath: /tmp/pod-shared
              readOnly: true
            - name: masakari-etc
              mountPath: /etc/masakari/incus-exporter.conf
              subPath: incus-exporter.conf
              readOnly: true
{{ if $mounts_incus_exporter.volumeMounts }}{{ toYaml $mounts_incus_exporter.volumeMounts | indent 12 }}{{ end }}
{{- if .Values.manifests.incus_notifier }}
        # Holds the credentials and no privileges. It reads what the
        # exporter found and asks Masakari to act on it.
        - name: incus-notifier
{{ tuple $envAll "masakari_incus_notifier" | include "helm-toolkit.snippets.image" | indent 10 }}
{{ tuple $envAll $envAll.Values.pod.resources.masakari_incus_notifier | include "helm-toolkit.snippets.kubernetes_resources" | indent 10 }}
{{ dict "envAll" $envAll "application" "masakari" "container" "masakari_incus_notifier" | include "helm-toolkit.snippets.kubernetes_container_security_context" | indent 10 }}
          command:
            - masakari-incus-notifier
            - --config-file
            - /etc/masakari/masakarimonitors.conf
            - --config-file
            - /tmp/pod-shared/masakarimonitors.conf
          ports:
            - name: notifier
              containerPort: {{ .Values.conf.masakarimonitors.incus_notifier.bind_port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /metrics
              port: notifier
            initialDelaySeconds: 5
            periodSeconds: 30
          volumeMounts:
            - name: pod-tmp-notifier
              mountPath: /tmp
            - name: pod-shared
              mountPath: /tmp/pod-shared
              readOnly: true
            - name: masakari-etc
              mountPath: /etc/masakari/masakarimonitors.conf
              subPath: masakarimonitors.conf
              readOnly: true
{{ if $mounts_incus_notifier.volumeMounts }}{{ toYaml $mounts_incus_notifier.volumeMounts | indent 12 }}{{ end }}
{{- end }}
      volumes:
        - name: pod-tmp-exporter
          emptyDir: {}
        - name: pod-tmp-notifier
          emptyDir: {}
        - name: pod-shared
          emptyDir: {}
        - name: masakari-bin
          configMap:
            name: masakari-bin
            defaultMode: 0555
        - name: masakari-etc
          secret:
            secretName: masakari-etc
            defaultMode: 0444
{{ if $mounts_incus_exporter.volumes }}{{ toYaml $mounts_incus_exporter.volumes | indent 8 }}{{ end }}
{{ if $mounts_incus_notifier.volumes }}{{ toYaml $mounts_incus_notifier.volumes | indent 8 }}{{ end }}
{{- end }}
