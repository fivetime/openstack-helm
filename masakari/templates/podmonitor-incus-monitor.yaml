{{- if and .Values.manifests.incus_monitor .Values.manifests.podmonitor_incus_monitor }}
{{- $envAll := . }}
{{- $daemonset := "masakari-incus-monitor" }}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: masakari-incus-monitor
  labels:
{{ tuple $envAll .Chart.Name $daemonset | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
{{ tuple $envAll .Chart.Name $daemonset | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 6 }}
  podMetricsEndpoints:
    - port: exporter
      path: /metrics
      interval: {{ .Values.monitoring.incus_monitor.scrape_interval }}
      relabelings:
        - action: replace
          sourceLabels:
            - __meta_kubernetes_pod_node_name
          targetLabel: node
{{- if .Values.manifests.incus_notifier }}
    - port: notifier
      path: /metrics
      interval: {{ .Values.monitoring.incus_monitor.scrape_interval }}
      relabelings:
        - action: replace
          sourceLabels:
            - __meta_kubernetes_pod_node_name
          targetLabel: node
{{- end }}
{{- end }}
