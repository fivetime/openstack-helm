# Default values for murano.
# This is a YAML-formatted file.
# Declare name/value pairs to be passed into your templates.
# name: value

---
release_group: null

labels:
  api:
    node_selector_key: openstack-control-plane
    node_selector_value: enabled
  engine:
    node_selector_key: openstack-control-plane
    node_selector_value: enabled
  job:
    node_selector_key: openstack-control-plane
    node_selector_value: enabled

# Murano is retired upstream and has no quay.io/airshipit image; the fork
# fivetime/openstack-murano builds it for 2026.2 only (openstack-helm-images
# build-local.d/murano.yaml).
images:
  tags:
    bootstrap: quay.io/airshipit/openstack-client:2026.2-ubuntu_resolute
    db_init: quay.io/airshipit/openstack-client:2026.2-ubuntu_resolute
    murano_db_sync: ghcr.io/fivetime/openstackhelm/murano:2026.2-ubuntu_resolute
    db_drop: quay.io/airshipit/openstack-client:2026.2-ubuntu_resolute
    rabbit_init: docker.io/rabbitmq:4.3.5-management
    ks_user: quay.io/airshipit/openstack-client:2026.2-ubuntu_resolute
    ks_service: quay.io/airshipit/openstack-client:2026.2-ubuntu_resolute
    ks_endpoints: quay.io/airshipit/openstack-client:2026.2-ubuntu_resolute
    murano_api: ghcr.io/fivetime/openstackhelm/murano:2026.2-ubuntu_resolute
    murano_engine: ghcr.io/fivetime/openstackhelm/murano:2026.2-ubuntu_resolute
    dep_check: quay.io/airshipit/kubernetes-entrypoint:latest-ubuntu_noble
    image_repo_sync: docker.io/docker:17.07.0
  pull_policy: "IfNotPresent"
  local_registry:
    active: false
    exclude:
      - dep_check
      - image_repo_sync

conf:
  paste:
    # The application murano loads: the readiness probe, outside the
    # versioned API and keystone, and the API.
    composite:murano:
      use: egg:Paste#urlmap
      /healthcheck: healthcheck
      /: murano_api
    pipeline:murano_api:
      pipeline: cors http_proxy_to_wsgi request_id versionnegotiation faultwrap authtoken context rootapp
    filter:context:
      paste.filter_factory: murano.api.middleware.context:ContextMiddleware.factory
    filter:authtoken:
      paste.filter_factory: keystonemiddleware.auth_token:filter_factory
    composite:rootapp:
      use: egg:Paste#urlmap
      /: apiversions
      /v1: apiv1app
    app:apiversions:
      paste.app_factory: murano.api.versions:create_resource
    app:apiv1app:
      paste.app_factory: murano.api.v1.router:API.factory
    filter:versionnegotiation:
      paste.filter_factory: murano.api.middleware.version_negotiation:VersionNegotiationFilter.factory
    filter:faultwrap:
      paste.filter_factory: murano.api.middleware.fault:FaultWrapper.factory
    filter:request_id:
      paste.filter_factory: oslo_middleware.request_id:RequestId.factory
    filter:cors:
      paste.filter_factory: oslo_middleware.cors:filter_factory
      oslo_config_project: murano
    filter:http_proxy_to_wsgi:
      paste.filter_factory: oslo_middleware.http_proxy_to_wsgi:HTTPProxyToWSGI.factory
      oslo_config_project: murano
    app:healthcheck:
      paste.app_factory: oslo_middleware:Healthcheck.app_factory
  policy: {}
  # -- The private RSA key (PEM or OpenSSH format) murano-engine signs the
  ## execution plans it sends to murano-agent with; the agents verify them
  ## with its public key, which reaches each VM in its user data. It has to
  ## stay the same across upgrades: the agents of the deployed environments
  ## only accept plans signed with the key of their user data. Empty: no
  ## signing (any client of the agent broker could then send the agents
  ## plans).
  signing_key: ""
  # -- The core packages murano-db-sync imports (or updates) after the
  ## migrations, from the image. The API cannot deploy anything without
  ## io.murano.
  packages:
    import: true
    path: /var/lib/openstack/share/murano/meta
    names:
      - io.murano
      - io.murano.applications
  murano:
    DEFAULT:
      log_config_append: /etc/murano/logging.conf
      state_path: /var/lib/murano
    paste_deploy:
      config_file: /etc/murano/murano-paste.ini
      flavor: ""
    database:
      max_retries: -1
      # -- Database connection URI. When empty the URI is auto-generated
      ## from endpoints.oslo_db. Set to null to disable auto-generation,
      ## e.g. when using an operator such as mariadb-operator that supplies
      ## the connection string via a mounted configuration snippet.
      connection: ""
    # -- The murano service user murano-engine creates the trusts of the
    ## deployments with; filled in from endpoints.identity.auth.murano.
    ## www_authenticate_uri is the internal identity endpoint unless set.
    murano_auth:
      auth_type: password
    # -- [murano] url, the API murano-engine downloads the packages from,
    ## is the internal application-catalog endpoint unless set. The
    ## clients look the other services up in the catalog by these types.
    murano:
      endpoint_type: internalURL
    heat:
      endpoint_type: internalURL
    neutron:
      endpoint_type: internalURL
    mistral:
      endpoint_type: internalURL
    glance:
      endpoint_type: internalURL
    engine:
      # -- Where murano-engine keeps the packages it downloads, on an
      ## emptyDir of the pod.
      packages_cache: /var/cache/murano/packages
      # -- Filled in with the mounted conf.signing_key when it is set.
      signing_key: ""
    # -- The broker the murano-agents of the VMs talk to. It has to be
    ## reachable from the tenant networks and must not be the control
    ## plane's: its credentials reach every VM in its user data. Filled in
    ## from endpoints.agent_messaging unless set; see there.
    rabbitmq: {}
    networking:
      driver: neutron
    keystone_authtoken:
      auth_type: password
      auth_version: v3
      memcache_security_strategy: ENCRYPT
      service_type: application-catalog
    oslo_messaging_notifications:
      # -- murano-engine reports the progress of the deployments to the API
      ## through notifications (topic murano); without a driver they are
      ## dropped and the deployments show no status reports.
      driver: messagingv2
    oslo_middleware:
      enable_proxy_headers_parsing: true
    oslo_messaging_rabbit:
      rabbit_ha_queues: false
      # -- Durable queues are required by RabbitMQ 4.x, which denies
      ## transient non-exclusive queues by default. Also valid on 3.x.
      amqp_durable_queues: true
      # -- Quorum queues, which RabbitMQ 4.x requires: it denies transient
      ## non-exclusive queues, and oslo.messaging declares its reply and fanout
      ## queues that way unless the transient ones are quorum too.
      ## amqp_durable_queues alone only covers the RPC and notification queues.
      rabbit_quorum_queue: true
      rabbit_transient_quorum_queue: true
      use_queue_manager: true
      rabbit_qos_prefetch_count: 1
      rabbit_stream_fanout: true
    oslo_policy:
      policy_file: /etc/murano/policy.yaml
    oslo_concurrency:
      lock_path: /var/lock
  logging:
    loggers:
      keys:
        - root
        - murano
    handlers:
      keys:
        - stdout
        - stderr
        - "null"
    formatters:
      keys:
        - context
        - default
    logger_root:
      level: WARNING
      handlers: 'null'
    logger_murano:
      level: INFO
      handlers:
        - stdout
      qualname: murano
    logger_amqp:
      level: WARNING
      handlers: stderr
      qualname: amqp
    logger_amqplib:
      level: WARNING
      handlers: stderr
      qualname: amqplib
    logger_sqlalchemy:
      level: WARNING
      handlers: stderr
      qualname: sqlalchemy
    logger_boto:
      level: WARNING
      handlers: stderr
      qualname: boto
    handler_null:
      class: logging.NullHandler
      formatter: default
      args: ()
    handler_stdout:
      class: StreamHandler
      args: (sys.stdout,)
      formatter: context
    handler_stderr:
      class: StreamHandler
      args: (sys.stderr,)
      formatter: context
    formatter_context:
      class: oslo_log.formatters.ContextFormatter
      datefmt: "%Y-%m-%d %H:%M:%S"
    formatter_default:
      format: "%(message)s"
      datefmt: "%Y-%m-%d %H:%M:%S"
  rabbitmq:
    # NOTE(rk760n): adding rmq policy to set an expiration time on notification queues
    policies:
      - vhost: "murano"
        name: "ha_ttl_murano"
        definition:
          # 70s
          message-ttl: 70000
        priority: 0
        apply-to: all
        pattern: '^(?!(amq\.|reply_)).*'
  murano_api_uwsgi:
    uwsgi:
      add-header: "Connection: close"
      buffer-size: 65535
      die-on-term: true
      enable-threads: true
      exit-on-reload: false
      hook-master-start: unix_signal:15 gracefully_kill_them_all
      # -- Required: the application starts the RPC servers for the results
      ## of murano-engine and its notifications, which only run in the
      ## process that loads it.
      lazy-apps: true
      log-x-forwarded-for: true
      master: true
      need-app: true
      # -- Package uploads and downloads (murano-engine fetches every
      ## package it deploys from this API) hold a request each; one worker
      ## would serialize them. The transactions and request contexts are
      ## per thread. Each process also runs the RPC servers of the results
      ## and notifications.
      processes: 2
      threads: 8
      procname-prefix-spaced: "murano-api:"
      route-user-agent: '^kube-probe.* donotlog:'
      thunder-lock: true
      worker-reload-mercy: 80
      module: murano.wsgi.api:application
      stats: 0.0.0.0:1717
      stats-http: true

network:
  api:
    # Pod port the Service routes to; null => Kubernetes uses the Service port.
    # A deployment override sets this (e.g. 443) to point at a TLS sidecar.
    target_port: null
    external_policy_local: false
    node_port:
      enabled: false
      port: 30082

bootstrap:
  enabled: false
  ks_user: murano
  script: |
    openstack token issue

dependencies:
  dynamic:
    common:
      local_image_registry:
        jobs:
          - murano-image-repo-sync
        services:
          - endpoint: node
            service: local_image_registry
  static:
    api:
      jobs:
        - murano-db-sync
        - murano-rabbit-init
        - murano-ks-user
        - murano-ks-endpoints
      services:
        - endpoint: internal
          service: oslo_db
        - endpoint: internal
          service: oslo_messaging
        - endpoint: internal
          service: identity
    engine:
      jobs:
        - murano-db-sync
        - murano-rabbit-init
        - murano-ks-user
        - murano-ks-endpoints
      services:
        - endpoint: internal
          service: oslo_messaging
        - endpoint: internal
          service: identity
        - endpoint: internal
          service: application_catalog
    bootstrap:
      services:
        - endpoint: internal
          service: identity
    db_drop:
      services:
        - endpoint: internal
          service: oslo_db
    db_init:
      services:
        - endpoint: internal
          service: oslo_db
    db_sync:
      jobs:
        - murano-db-init
      services:
        - endpoint: internal
          service: oslo_db
    ks_endpoints:
      jobs:
        - murano-ks-service
      services:
        - endpoint: internal
          service: identity
    ks_service:
      services:
        - endpoint: internal
          service: identity
    ks_user:
      services:
        - endpoint: internal
          service: identity
    rabbit_init:
      services:
        - endpoint: internal
          service: oslo_messaging
    image_repo_sync:
      services:
        - endpoint: internal
          service: local_image_registry

# Names of secrets used by bootstrap and environmental checks
secrets:
  identity:
    admin: murano-keystone-admin
    murano: murano-keystone-user
  oslo_db:
    admin: murano-db-admin
  oslo_messaging:
    admin: murano-rabbitmq-admin
    murano: murano-rabbitmq-user
  # -- conf.signing_key, mounted in murano-engine.
  signing_key: murano-signing-key
  tls:
    # Client certificate this chart presents for all mTLS backend connections
    # (MariaDB and RabbitMQ). Separate from the MariaDB and RabbitMQ server certs.
    client:
      murano: murano-client
    # CA bundle this chart trusts for OUTBOUND TLS calls (keystone and the
    # services of the clusters). Null by default -> no CA is mounted and
    # REQUESTS_CA_BUNDLE is left unset. A deployment override points this at a
    # cert-manager CA-only secret carrying just ca.crt (no private key); it is
    # mounted at /etc/ssl/certs/openstack-helm.crt. Assumes every server cert is
    # signed by this single CA. The chart stays TLS-agnostic -- server certs and
    # the nginx TLS sidecar live in the override.
    ca: null
  oci_image_registry:
    murano: murano-oci-image-registry

identity:
  openrc:
    exclude_vars: []
    extra_vars: []

# typically overridden by environmental
# values, but should include all endpoints
# required by this chart
endpoints:
  cluster_domain_suffix: cluster.local
  local_image_registry:
    name: docker-registry
    namespace: docker-registry
    hosts:
      default: localhost
      internal: docker-registry
      node: localhost
    host_fqdn_override:
      default: null
    port:
      registry:
        node: 5000
  oci_image_registry:
    name: oci-image-registry
    namespace: oci-image-registry
    auth:
      enabled: false
      murano:
        username: murano
        password: password
    hosts:
      default: localhost
    host_fqdn_override:
      default: null
    port:
      registry:
        default: null
  identity:
    name: keystone
    auth:
      admin:
        region_name: RegionOne
        username: admin
        password: password
        project_name: admin
        user_domain_name: default
        project_domain_name: default
      murano:
        # admin: murano-engine creates the trusts of the deployments as
        # the trustee and lists the users' resources across projects, as
        # upstream deployed it. service, as for the other service users.
        # The ks-user job grants every role listed here.
        role: admin,service
        region_name: RegionOne
        username: murano
        password: password
        project_name: service
        user_domain_name: service
        project_domain_name: service
    hosts:
      default: keystone
      internal: keystone-api
    host_fqdn_override:
      default: null
    path:
      default: /v3
    scheme:
      default: http
    port:
      api:
        default: 80
        internal: 5000
  application_catalog:
    name: murano
    hosts:
      default: murano-api
      public: murano
    host_fqdn_override:
      default: null
    path:
      # The clients add /v1 themselves.
      default: null
      # The readiness probe; outside the versioned API and keystone.
      healthcheck: /healthcheck
    scheme:
      default: http
    port:
      api:
        default: 8082
        public: 80
  oslo_db:
    auth:
      admin:
        username: root
        password: password
      murano:
        username: murano
        password: password
    hosts:
      default: mariadb
    host_fqdn_override:
      default: null
    path: /murano
    scheme: mysql+pymysql
    port:
      mysql:
        default: 3306
  oslo_cache:
    auth:
      # NOTE(portdirect): this is used to define the value for keystone
      # authtoken cache encryption key, if not set it will be populated
      # automatically with a random value, but to take advantage of
      # this feature all services should be set to use the same key,
      # and memcache service.
      memcache_secret_key: null
    hosts:
      default: memcached
    host_fqdn_override:
      default: null
    port:
      memcache:
        default: 11211
  oslo_messaging:
    auth:
      admin:
        username: rabbitmq
        password: password
      murano:
        username: murano
        password: password
    statefulset:
      replicas: 2
      name: rabbitmq-rabbitmq
    hosts:
      default: rabbitmq
    host_fqdn_override:
      default: null
    path: /murano
    scheme: rabbit
    port:
      amqp:
        default: 5672
      http:
        default: 15672
  # -- The broker of the murano-agents ([rabbitmq] of murano.conf), as the
  ## VMs reach it: an address of the tenant networks' routes, not a cluster
  ## service name. The chart does not create its account; the broker
  ## deployment does (for instance the rabbitmq chart's conf.users).
  agent_messaging:
    auth:
      murano_agent:
        username: murano-agent
        password: password
    host: null
    port: 5672
    virtual_host: murano-agent
    ssl: false
    insecure: false
  fluentd:
    namespace: null
    name: fluentd
    hosts:
      default: fluentd-logging
    host_fqdn_override:
      default: null
    path:
      default: null
    scheme: 'http'
    port:
      service:
        default: 24224
      metrics:
        default: 24220
  # NOTE(tp6510): these endpoints allow for things like DNS lookups and ingress
  # They are using to enable the Egress K8s network policy.
  kube_dns:
    namespace: kube-system
    name: kubernetes-dns
    hosts:
      default: kube-dns
    host_fqdn_override:
      default: null
    path:
      default: null
    scheme: http
    port:
      dns:
        default: 53
        protocol: UDP

pod:
  # Extra sidecar containers and volumes to inject into the murano-api
  # Deployment, e.g. nginx TLS-terminating sidecars.
  extraContainers:
    murano_api: []
  extraVolumes:
    murano_api: []
  security_context:
    murano:
      pod:
        runAsUser: 42424
      container:
        murano_api:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
        murano_engine:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
  affinity:
    anti:
      type:
        default: preferredDuringSchedulingIgnoredDuringExecution
      topologyKey:
        default: kubernetes.io/hostname
      weight:
        default: 10
  tolerations:
    murano:
      enabled: false
      tolerations:
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
  mounts:
    murano_api:
      init_container: null
      murano_api:
        volumeMounts:
        volumes:
    murano_engine:
      init_container: null
      murano_engine:
        volumeMounts:
        volumes:
    murano_bootstrap:
      init_container: null
      murano_bootstrap:
        volumeMounts:
        volumes:
    murano_db_sync:
      murano_db_sync:
        volumeMounts:
        volumes:
  # -- This allows users to add Kubernetes Projected Volumes to be mounted at /etc/murano/murano.conf.d/
  ## This is a list of projected volume source objects for each deployment/statefulset/daemonset/cronjob
  ## https://kubernetes.io/docs/concepts/storage/projected-volumes/
  etcSources:
    murano_api: []
    murano_engine: []
    murano_db_sync: []
  replicas:
    api: 1
    engine: 1
  lifecycle:
    upgrades:
      deployments:
        revision_history: 3
        pod_replacement_strategy: RollingUpdate
        rolling_update:
          max_unavailable: 1
          max_surge: 3
    disruption_budget:
      api:
        min_available: 0
    termination_grace_period:
      api:
        timeout: 30
      # -- A deployment still running when the process stops is lost and
      ## its environment stays deploying; give them time to finish.
      engine:
        timeout: 60
  resources:
    enabled: false
    api:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "1024Mi"
        cpu: "2000m"
    engine:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "1024Mi"
        cpu: "2000m"
    jobs:
      bootstrap:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "1024Mi"
          cpu: "2000m"
      db_init:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "1024Mi"
          cpu: "2000m"
      db_sync:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "1024Mi"
          cpu: "2000m"
      db_drop:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "1024Mi"
          cpu: "2000m"
      ks_endpoints:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "1024Mi"
          cpu: "2000m"
      ks_service:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "1024Mi"
          cpu: "2000m"
      ks_user:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "1024Mi"
          cpu: "2000m"
      rabbit_init:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "1024Mi"
          cpu: "2000m"
      image_repo_sync:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "1024Mi"
          cpu: "2000m"
  probes:
    api:
      murano_api:
        liveness:
          enabled: true
          port: 1717
          params:
            initialDelaySeconds: 10
        readiness:
          enabled: true
          params:
            initialDelaySeconds: 30

network_policy:
  murano:
    ingress:
      - {}
    egress:
      - {}

tls:
  oslo_messaging: false
  oslo_db: false

rabbitmq_topology:
  # -- API group of the RabbitMQ topology custom resources this chart renders
  ## when manifests.rabbitmq_topology is enabled. Either group works: the
  ## resources are the same, only who reconciles them differs.
  ##   rabbitmq.osh.openstack.org -- the rabbitmq chart's own topology
  ##                                 controller
  ##                                 (manifests.deployment_topology_controller)
  ##   rabbitmq.com               -- the upstream messaging-topology-operator,
  ##                                 which must then be deployed separately,
  ##                                 along with a RabbitmqCluster named after
  ##                                 endpoints.oslo_messaging.hosts.default for
  ##                                 rabbitmqClusterReference to resolve to
  api_group: rabbitmq.osh.openstack.org

mariadb_db:
  # -- API group of the MariaDB custom resources this chart renders when
  ## manifests.mariadb_db is enabled. Either group works: the resources are
  ## the same, only who reconciles them differs.
  ##   mariadb.osh.openstack.org -- the mariadb chart's own db controller
  ##                                (manifests.deployment_db_controller)
  ##   k8s.mariadb.com           -- the upstream mariadb-operator, which must
  ##                                then be deployed separately
  ## With k8s.mariadb.com and tls.oslo_db enabled, use mariadb-operator 0.37.0
  ## or newer. User.spec.require was added in that release, so older operators
  ## drop it and create accounts without REQUIRE X509.
  api_group: mariadb.osh.openstack.org

manifests:
  configmap_bin: true
  configmap_etc: true
  deployment_api: true
  deployment_engine: true
  job_bootstrap: true
  job_db_init: true
  # -- Render the MariaDB Database/User/Grant/Connection custom resources
  ## reconciled by the mariadb chart's db controller, instead of running the
  ## db-init job. Mutually exclusive with job_db_init.
  mariadb_db: false
  job_db_sync: true
  job_db_drop: false
  job_image_repo_sync: true
  job_ks_endpoints: true
  job_ks_service: true
  job_ks_user: true
  job_rabbit_init: true
  pdb_api: true
  network_policy: false
  # -- Declare this chart's messaging vhost, account and permissions
  ## as RabbitMQ custom resources reconciled by the rabbitmq chart's
  ## topology controller, instead of running the rabbit_init job. The
  ## two are mutually exclusive.
  rabbitmq_topology: false
  secret_db: true
  secret_keystone: true
  secret_rabbitmq: true
  secret_registry: true
  service_api: true

# -- Extra K8s manifests to deploy. Either a list or a map of manifests.
## Note: Supports use of custom Helm templates
## Note: Helm replaces (instead of merging) list values when several values
## files are combined, so if you need to define extraObjects in more than one
## overrides file, use the map form and make sure the keys are unique across
## those files. With the list form only the last file takes effect.
extraObjects: {}
...
