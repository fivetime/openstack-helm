{{- /* Scripts and FRR configuration of the ovn-evpn-frr daemonset, in their
       own ConfigMap and Secret so that a change to them only rolls that
       daemonset (which is OnDelete), not every Neutron component that hashes
       neutron-bin or neutron-etc. */ -}}
{{- if .Values.manifests.daemonset_ovn_evpn_frr }}
{{- $envAll := . }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: neutron-ovn-evpn-frr-bin
data:
  neutron-ovn-evpn-frr-init.sh: |
{{ tuple "bin/_neutron-ovn-evpn-frr-init.sh.tpl" . | include "helm-toolkit.utils.template" | indent 4 }}
  neutron-ovn-evpn-frr.sh: |
{{ tuple "bin/_neutron-ovn-evpn-frr.sh.tpl" . | include "helm-toolkit.utils.template" | indent 4 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: neutron-ovn-evpn-frr-etc
type: Opaque
data:
  ovn-evpn-frr.conf: {{ tpl (index $envAll.Values.conf.ovn_evpn_frr "frr.conf") $envAll | b64enc }}
  ovn-evpn-frr-daemons: {{ $envAll.Values.conf.ovn_evpn_frr.daemons | b64enc }}
  ovn-evpn-frr-vtysh.conf: {{ index $envAll.Values.conf.ovn_evpn_frr "vtysh.conf" | b64enc }}
{{- end }}
