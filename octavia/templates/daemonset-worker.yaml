{{/*
The main container, shared by the two shapes below. The start script
configures o-w0 only when the init containers left an address in
pod-shared; in the attached shape there are no init containers and the
interface arrives configured.
*/}}
{{- define "octavia.worker.container" }}
{{- $envAll := . }}
{{- $mounts_octavia_worker := $envAll.Values.pod.mounts.octavia_worker.octavia_worker }}
- name: octavia-worker
{{ tuple $envAll "octavia_worker" | include "helm-toolkit.snippets.image" | indent 2 }}
{{ tuple $envAll $envAll.Values.pod.resources.worker | include "helm-toolkit.snippets.kubernetes_resources" | indent 2 }}
{{ dict "envAll" $envAll "application" "octavia_worker" "container" "octavia_worker" | include "helm-toolkit.snippets.kubernetes_container_security_context" | indent 2 }}
  command:
    - /tmp/octavia-worker.sh
    - start
  lifecycle:
    preStop:
      exec:
        command:
          - /tmp/octavia-worker.sh
          - stop
  volumeMounts:
    # The init container writes the port's address here;
    # without this mount the main container cannot read it.
    - name: pod-shared
      mountPath: /tmp/pod-shared
    - name: oslo-lock-path
      mountPath: {{ $envAll.Values.conf.octavia.oslo_concurrency.lock_path }}
    - name: pod-etc-octavia
      mountPath: /etc/octavia
    - name: octavia-bin
      mountPath: /tmp/octavia-worker.sh
      subPath: octavia-worker.sh
      readOnly: true
    - name: octavia-etc
      mountPath: /etc/octavia/octavia.conf
      subPath: octavia.conf
      readOnly: true
    - name: octavia-etc-snippets
      mountPath: /etc/octavia/octavia.conf.d/
      readOnly: true
    {{- if $envAll.Values.conf.octavia.DEFAULT.log_config_append }}
    - name: octavia-etc
      mountPath: {{ $envAll.Values.conf.octavia.DEFAULT.log_config_append }}
      subPath: {{ base $envAll.Values.conf.octavia.DEFAULT.log_config_append }}
      readOnly: true
    {{- end }}
{{ if $mounts_octavia_worker.volumeMounts }}{{ toYaml $mounts_octavia_worker.volumeMounts | indent 4 }}{{ end }}
{{- end }}

{{- define "octavia.worker.volumes" }}
{{- $envAll := index . 0 }}
{{- $configMapName := index . 1 }}
{{- $mounts_octavia_worker := $envAll.Values.pod.mounts.octavia_worker.octavia_worker }}
{{- $etcSources := $envAll.Values.pod.etcSources.octavia_worker }}
- name: oslo-lock-path
  emptyDir: {}
- name: pod-etc-octavia
  emptyDir: {}
- name: octavia-bin
  configMap:
    name: octavia-bin
    defaultMode: 0555
- name: octavia-etc
  secret:
    secretName: {{ $configMapName }}
    defaultMode: 0444
- name: octavia-etc-snippets
{{- if $etcSources }}
  projected:
    sources:
{{ toYaml $etcSources | indent 6 }}
{{- else }}
  emptyDir: {}
{{- end }}
- name: pod-shared
  emptyDir: {}
{{ if $mounts_octavia_worker.volumes }}{{ toYaml $mounts_octavia_worker.volumes }}{{ end }}
{{- end }}

{{- define "octavia.worker.daemonset" }}
{{- $daemonset := index . 0 }}
{{- $configMapName := index . 1 }}
{{- $serviceAccountName := index . 2 }}
{{- $envAll := index . 3 }}
{{- with $envAll }}

{{- $mounts_octavia_worker_init := .Values.pod.mounts.octavia_worker.init_container }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: octavia-worker
  annotations:
    {{ tuple $envAll | include "helm-toolkit.snippets.release_uuid" }}
  labels:
{{ tuple $envAll "octavia" "worker" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
spec:
  selector:
    matchLabels:
{{ tuple $envAll "octavia" "worker" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 6 }}
{{ tuple $envAll "worker" | include "helm-toolkit.snippets.kubernetes_upgrades_daemonset" | indent 2 }}
  template:
    metadata:
      labels:
{{ tuple $envAll "octavia" "worker" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 8 }}
      annotations:
        configmap-bin-hash: {{ tuple "configmap-bin.yaml" . | include "helm-toolkit.utils.hash" }}
        configmap-etc-hash: {{ tuple "configmap-etc.yaml" . | include "helm-toolkit.utils.hash" }}
{{ tuple "octavia_worker" . | include "helm-toolkit.snippets.custom_pod_annotations" | indent 8 }}
    spec:
{{ tuple "octavia_worker" . | include "helm-toolkit.snippets.kubernetes_pod_priority_class" | indent 6 }}
{{ tuple "octavia_worker" . | include "helm-toolkit.snippets.kubernetes_pod_runtime_class" | indent 6 }}
      serviceAccountName: {{ $serviceAccountName }}
{{ dict "envAll" $envAll "application" "octavia_worker" | include "helm-toolkit.snippets.kubernetes_pod_security_context" | indent 6 }}
      dnsPolicy: ClusterFirstWithHostNet
      hostNetwork: true
      # The lb-mgmt nodes are tainted; without this the object renders with
      # DESIRED=0 and no error anywhere.
      {{- if and $envAll.Values.pod.tolerations.worker.enabled $envAll.Values.pod.tolerations.worker.tolerations }}
      tolerations:
      {{- toYaml $envAll.Values.pod.tolerations.worker.tolerations | nindent 8 }}
      {{- end }}
      nodeSelector:
        {{ .Values.labels.worker.node_selector_key }}: {{ .Values.labels.worker.node_selector_value }}
      initContainers:
{{ tuple $envAll "worker" $mounts_octavia_worker_init | include "helm-toolkit.snippets.kubernetes_entrypoint_init_container" | indent 8 }}
        - name: octavia-worker-get-port
{{ tuple $envAll "octavia_worker_init" | include "helm-toolkit.snippets.image" | indent 10 }}
{{ tuple $envAll $envAll.Values.pod.resources.worker | include "helm-toolkit.snippets.kubernetes_resources" | indent 10 }}
          env:
{{- with $env := dict "ksUserSecret" ( index $envAll.Values.secrets.identity "admin" ) "envAll" $envAll }}
{{- include "helm-toolkit.snippets.keystone_openrc_env_vars" $env | indent 12 }}
{{- end }}
          command:
            - /tmp/octavia-worker-get-port.sh
          volumeMounts:
            - name: pod-shared
              mountPath: /tmp/pod-shared
            - name: octavia-bin
              mountPath: /tmp/octavia-worker-get-port.sh
              subPath: octavia-worker-get-port.sh
              readOnly: true
        - name: octavia-worker-nic-init
{{ tuple $envAll "openvswitch_vswitchd" | include "helm-toolkit.snippets.image" | indent 10 }}
{{ tuple $envAll $envAll.Values.pod.resources.worker | include "helm-toolkit.snippets.kubernetes_resources" | indent 10 }}
{{ dict "envAll" $envAll "application" "octavia_worker" "container" "octavia_worker_nic_init" | include "helm-toolkit.snippets.kubernetes_container_security_context" | indent 10 }}
          command:
            - /tmp/octavia-worker-nic-init.sh
          volumeMounts:
            - name: pod-shared
              mountPath: /tmp/pod-shared
            - name: octavia-bin
              mountPath: /tmp/octavia-worker-nic-init.sh
              subPath: octavia-worker-nic-init.sh
              readOnly: true
            - name: run
              mountPath: /run
      containers:
{{ include "octavia.worker.container" $envAll | indent 8 }}
      volumes:
{{ list $envAll $configMapName | include "octavia.worker.volumes" | indent 8 }}
        - name: run
          hostPath:
            path: /run
{{- end }}
{{- end }}

{{/*
The attached shape: one single-replica Deployment per pre-created Neutron
port on the management network, reached through Multus and ovs-cni (see
network.lb_mgmt). No hostNetwork, no node pinning, no init containers
plugging a host interface; strategy Recreate because a slot owns one
logical switch port and a RollingUpdate would have two pods bind it.
*/}}
{{- define "octavia.worker.attached" }}
{{- $envAll := index . 0 }}
{{- $configMapName := index . 1 }}
{{- $serviceAccountName := index . 2 }}
{{- $slot := index . 3 }}
{{- $lbMgmt := $envAll.Values.network.lb_mgmt }}
{{- $mounts_octavia_worker_init := $envAll.Values.pod.mounts.octavia_worker.init_container }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: octavia-worker-{{ $slot.name }}
  annotations:
    {{ tuple $envAll | include "helm-toolkit.snippets.release_uuid" }}
  labels:
{{ tuple $envAll "octavia" "worker" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
    octavia-worker-slot: {{ $slot.name | quote }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
{{ tuple $envAll "octavia" "worker" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 6 }}
      octavia-worker-slot: {{ $slot.name | quote }}
  template:
    metadata:
      labels:
{{ tuple $envAll "octavia" "worker" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 8 }}
        octavia-worker-slot: {{ $slot.name | quote }}
      annotations:
        configmap-bin-hash: {{ tuple "configmap-bin.yaml" $envAll | include "helm-toolkit.utils.hash" }}
        configmap-etc-hash: {{ tuple "configmap-etc.yaml" $envAll | include "helm-toolkit.utils.hash" }}
        {{- $network := dict "name" $lbMgmt.nad_name "namespace" ($lbMgmt.nad_namespace | default $envAll.Release.Namespace) "mac" $slot.mac "ips" (list (printf "%s/%d" $slot.ip (int $lbMgmt.prefix_length))) "cni-args" (dict "OvnPort" $slot.port_id) }}
        k8s.v1.cni.cncf.io/networks: {{ list $network | toJson | quote }}
{{ tuple "octavia_worker" $envAll | include "helm-toolkit.snippets.custom_pod_annotations" | indent 8 }}
    spec:
{{ tuple "octavia_worker" $envAll | include "helm-toolkit.snippets.kubernetes_pod_priority_class" | indent 6 }}
{{ tuple "octavia_worker" $envAll | include "helm-toolkit.snippets.kubernetes_pod_runtime_class" | indent 6 }}
      serviceAccountName: {{ $serviceAccountName }}
{{ dict "envAll" $envAll "application" "octavia_worker" | include "helm-toolkit.snippets.kubernetes_pod_security_context" | indent 6 }}
      {{- if and $envAll.Values.pod.tolerations.worker.enabled $envAll.Values.pod.tolerations.worker.tolerations }}
      tolerations:
      {{- toYaml $envAll.Values.pod.tolerations.worker.tolerations | nindent 8 }}
      {{- end }}
      affinity:
{{ tuple $envAll "octavia" "worker" | include "helm-toolkit.snippets.kubernetes_pod_anti_affinity" | indent 8 }}
      initContainers:
{{ tuple $envAll "worker" $mounts_octavia_worker_init | include "helm-toolkit.snippets.kubernetes_entrypoint_init_container" | indent 8 }}
      containers:
{{ include "octavia.worker.container" $envAll | indent 8 }}
          resources:
            requests:
              {{ $lbMgmt.resource_name }}: "1"
            limits:
              {{ $lbMgmt.resource_name }}: "1"
      volumes:
{{ list $envAll $configMapName | include "octavia.worker.volumes" | indent 8 }}
{{- end }}

{{- if .Values.manifests.daemonset_worker }}
{{- $envAll := . }}
{{- $daemonset := "worker" }}
{{- $configMapName := "octavia-etc" }}
{{- $serviceAccountName := "octavia-worker" }}

{{- $dependencyOpts := dict "envAll" $envAll "dependencyMixinParam" $envAll.Values.network.backend "dependencyKey" "worker" -}}
{{- $_ := include "helm-toolkit.utils.dependency_resolver" $dependencyOpts | toString | fromYaml }}

{{ tuple $envAll "worker" $serviceAccountName | include "helm-toolkit.snippets.kubernetes_pod_rbac_serviceaccount" }}
{{- $slots := .Values.network.lb_mgmt.attachments.worker | default list }}
{{- if $slots }}
{{- range $slot := $slots }}
{{ list $envAll $configMapName $serviceAccountName $slot | include "octavia.worker.attached" }}
{{- end }}
{{- else }}
{{- $daemonset_yaml := list $daemonset $configMapName $serviceAccountName . | include "octavia.worker.daemonset" | toString | fromYaml }}
{{- $configmap_yaml := "octavia.configmap.etc" }}
{{- list $daemonset $daemonset_yaml $configmap_yaml $configMapName . | include "helm-toolkit.utils.daemonset_overrides" }}
{{- end }}
{{- end }}
