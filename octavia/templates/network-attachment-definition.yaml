{{/*
The secondary network the control-plane pods attach to: the Octavia
management network, reached through Multus and ovs-cni as a port on
br-int that OVN binds to a pre-created Neutron port. The pod annotation
supplies the port (cni-args.OvnPort), its MAC and its address; this
definition only names the bridge and says that IPAM is static.
*/}}
{{- if .Values.manifests.network_attachment_definition }}
{{- $lbMgmt := .Values.network.lb_mgmt }}
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: {{ $lbMgmt.nad_name }}
  namespace: {{ $lbMgmt.nad_namespace | default .Release.Namespace }}
  annotations:
    k8s.v1.cni.cncf.io/resourceName: {{ $lbMgmt.resource_name }}
  labels:
{{ tuple . "octavia" "lb_mgmt" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
spec:
  config: {{ dict "cniVersion" "0.3.1" "type" "ovs" "bridge" $lbMgmt.bridge "capabilities" (dict "ips" true "mac" true) "ipam" (dict "type" "static") | toJson | quote }}
{{- end }}
