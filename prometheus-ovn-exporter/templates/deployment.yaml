{{/*
A single ovn_exporter that reads the NB/SB tables over TCP (chassis, logical
switches and routers, port bindings, gateway port placement). It runs with
no local components: the database and northd daemons live in other pods, so
their unixctl probes could never succeed and would hold ovn_up at 0. The
raft and northd metrics come from openstack-network-exporter sidecars in the
ovn chart pods instead (.Values.pod.extraContainers of the ovn chart).
*/}}
{{- if .Values.manifests.deployment }}
{{- $envAll := . }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ovn-exporter
  annotations:
    {{ tuple $envAll | include "helm-toolkit.snippets.release_uuid" }}
  labels:
{{ tuple $envAll "ovn_exporter" "topology" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
{{ tuple $envAll "ovn_exporter" "topology" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 6 }}
  template:
    metadata:
      labels:
{{ tuple $envAll "ovn_exporter" "topology" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 8 }}
      annotations:
{{ tuple $envAll | include "helm-toolkit.snippets.release_uuid" | indent 8 }}
    spec:
{{ dict "envAll" $envAll "application" "ovn_exporter" | include "helm-toolkit.snippets.kubernetes_pod_security_context" | indent 6 }}
      automountServiceAccountToken: false
      nodeSelector:
        {{ .Values.labels.ovn_exporter.node_selector_key }}: {{ .Values.labels.ovn_exporter.node_selector_value | quote }}
{{- if .Values.pod.tolerations.ovn_exporter.enabled }}
{{ tuple $envAll "ovn_exporter" | include "helm-toolkit.snippets.kubernetes_tolerations" | indent 6 }}
{{- end }}
      containers:
        - name: ovn-exporter
{{ tuple $envAll "ovn_exporter" | include "helm-toolkit.snippets.image" | indent 10 }}
{{ tuple $envAll $envAll.Values.pod.resources.ovn_exporter | include "helm-toolkit.snippets.kubernetes_resources" | indent 10 }}
{{ dict "envAll" $envAll "application" "ovn_exporter" "container" "ovn_exporter" | include "helm-toolkit.snippets.kubernetes_container_security_context" | indent 10 }}
          args:
            - -web.listen-address=:{{ .Values.network.ovn_exporter.port }}
            - -database.northbound.socket.remote={{ .Values.conf.ovn_exporter.northbound }}
            - -database.southbound.socket.remote={{ .Values.conf.ovn_exporter.southbound }}
            - -collector.components=
            - -collector.topology=true
{{- if .Values.conf.ovn_exporter.ssl.enabled }}
            - -database.ssl.private-key=/etc/ovn-tls/tls.key
            - -database.ssl.certificate=/etc/ovn-tls/tls.crt
            - -database.ssl.ca-cert=/etc/ovn-tls-ca/{{ .Values.conf.ovn_exporter.ssl.ca_key }}
{{- end }}
{{- range .Values.conf.ovn_exporter.extra_args }}
            - {{ . | quote }}
{{- end }}
{{- if .Values.conf.ovn_exporter.ssl.enabled }}
          volumeMounts:
            - name: ovn-tls
              mountPath: /etc/ovn-tls
              readOnly: true
            - name: ovn-tls-ca
              mountPath: /etc/ovn-tls-ca
              readOnly: true
{{- end }}
          ports:
            - name: ovn-metrics
              containerPort: {{ .Values.network.ovn_exporter.port }}
          # A TCP check: an HTTP probe on /metrics would trigger a collection.
          readinessProbe:
            tcpSocket:
              port: ovn-metrics
            periodSeconds: 30
          livenessProbe:
            tcpSocket:
              port: ovn-metrics
            initialDelaySeconds: 30
            periodSeconds: 60
{{- if .Values.conf.ovn_exporter.ssl.enabled }}
      volumes:
        - name: ovn-tls
          secret:
            secretName: {{ .Values.conf.ovn_exporter.ssl.secret }}
            # Group readable: the container runs as non-root and needs
            # pod.security_context.ovn_exporter.pod.fsGroup to read the key.
            defaultMode: 0440
            items:
              - key: tls.key
                path: tls.key
              - key: tls.crt
                path: tls.crt
        - name: ovn-tls-ca
          configMap:
            name: {{ .Values.conf.ovn_exporter.ssl.ca_configmap }}
            items:
              - key: {{ .Values.conf.ovn_exporter.ssl.ca_key }}
                path: {{ .Values.conf.ovn_exporter.ssl.ca_key }}
{{- end }}
{{- end }}
