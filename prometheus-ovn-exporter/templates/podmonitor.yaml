{{- if .Values.manifests.podmonitor }}
{{- $envAll := . }}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: ovn-exporter-topology
  labels:
{{ tuple $envAll "ovn_exporter" "topology" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      application: ovn_exporter
      component: topology
  podMetricsEndpoints:
    - port: ovn-metrics
      path: /metrics
      interval: {{ .Values.monitoring.podmonitor.topology_interval }}
{{- end }}
{{- if .Values.manifests.podmonitor_sidecars }}
{{- $envAll := . }}
---
# Scrapes the openstack-network-exporter sidecars that the ovn chart adds to
# its database and northd pods through .Values.pod.extraContainers. Those
# containers must expose a port named as .Values.monitoring.sidecars.port_name.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: ovn-exporter-sidecars
  labels:
{{ tuple $envAll "ovn_exporter" "sidecars" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      application: ovn
    matchExpressions:
      - key: component
        operator: In
        values:
{{ toYaml .Values.monitoring.sidecars.components | indent 10 }}
  podMetricsEndpoints:
    - port: {{ .Values.monitoring.sidecars.port_name }}
      path: /metrics
      interval: {{ .Values.monitoring.podmonitor.sidecars_interval }}
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_component]
          targetLabel: component
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
{{- end }}
