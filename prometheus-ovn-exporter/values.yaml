# Default values for prometheus-ovn-exporter.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

---
images:
  tags:
    ovn_exporter: ghcr.io/fivetime/openstackhelm/ovn-exporter:latest
  pull_policy: IfNotPresent
  local_registry:
    active: false
    exclude: []

labels:
  ovn_exporter:
    node_selector_key: openstack-control-plane
    node_selector_value: enabled

pod:
  security_context:
    ovn_exporter:
      pod:
        runAsUser: 65534
        runAsNonRoot: true
      container:
        ovn_exporter:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
  tolerations:
    ovn_exporter:
      enabled: false
      tolerations: []
  resources:
    enabled: false
    ovn_exporter:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "256Mi"
        cpu: "500m"

network:
  ovn_exporter:
    port: 9476

conf:
  ovn_exporter:
    # Plain host:port; ovn_exporter does not accept a tcp: prefix.
    northbound: ovn-ovsdb-nb.openstack.svc.cluster.local:6641
    southbound: ovn-ovsdb-sb.openstack.svc.cluster.local:6642
    extra_args: []

monitoring:
  podmonitor:
    topology_interval: 60s
    sidecars_interval: 30s
  sidecars:
    port_name: ovn-metrics
    components:
      - ovn-ovsdb-nb
      - ovn-ovsdb-sb
      - ovn-northd

manifests:
  deployment: true
  podmonitor: true
  podmonitor_sidecars: true

# -- Extra K8s manifests to deploy. Either a list or a map of manifests.
extraObjects: {}
...
