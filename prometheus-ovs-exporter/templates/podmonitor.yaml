{{- if .Values.manifests.podmonitor }}
{{- $envAll := . }}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: ovs-exporter
  labels:
{{ tuple $envAll "ovs_exporter" "metrics" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      application: ovs_exporter
      component: metrics
  podMetricsEndpoints:
    - port: ovs-metrics
      path: /metrics
      interval: {{ .Values.monitoring.podmonitor.interval }}
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
{{- if .Values.conf.network_exporter.enabled }}
    - port: network-metrics
      path: /metrics
      interval: {{ .Values.monitoring.podmonitor.interval }}
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
{{- end }}
{{- end }}
