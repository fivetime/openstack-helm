{{- if (.Values.global).subchart_release_name }}
{{- $_ := set . "deployment_name" .Chart.Name }}
{{- else }}
{{- $_ := set . "deployment_name" .Release.Name }}
{{- end }}

{{- if .Values.manifests.configmap_etc }}
{{- $envAll := . }}

{{- if empty .Values.conf.qinling.keystone_authtoken.auth_uri -}}
{{- $_ := tuple "identity" "internal" "api" . | include "helm-toolkit.endpoints.keystone_endpoint_uri_lookup"| set .Values.conf.qinling.keystone_authtoken "auth_uri" -}}
{{- end -}}

{{- if empty .Values.conf.qinling.keystone_authtoken.www_authenticate_uri -}}
{{- $_ := tuple "identity" "internal" "api" . | include "helm-toolkit.endpoints.keystone_endpoint_uri_lookup"| set .Values.conf.qinling.keystone_authtoken "www_authenticate_uri" -}}
{{- end -}}

{{- if empty .Values.conf.qinling.keystone_authtoken.auth_url -}}
{{- $_ := tuple "identity" "internal" "api" . | include "helm-toolkit.endpoints.keystone_endpoint_uri_lookup"| set .Values.conf.qinling.keystone_authtoken "auth_url" -}}
{{- end -}}

{{- if empty .Values.conf.qinling.keystone_authtoken.region_name -}}
{{- $_ := set .Values.conf.qinling.keystone_authtoken "region_name" .Values.endpoints.identity.auth.qinling.region_name -}}
{{- end -}}
{{- if empty .Values.conf.qinling.keystone_authtoken.project_name -}}
{{- $_ := set .Values.conf.qinling.keystone_authtoken "project_name" .Values.endpoints.identity.auth.qinling.project_name -}}
{{- end -}}
{{- if empty .Values.conf.qinling.keystone_authtoken.project_domain_name -}}
{{- $_ := set .Values.conf.qinling.keystone_authtoken "project_domain_name" .Values.endpoints.identity.auth.qinling.project_domain_name -}}
{{- end -}}
{{- if empty .Values.conf.qinling.keystone_authtoken.user_domain_name -}}
{{- $_ := set .Values.conf.qinling.keystone_authtoken "user_domain_name" .Values.endpoints.identity.auth.qinling.user_domain_name -}}
{{- end -}}
{{- if empty .Values.conf.qinling.keystone_authtoken.username -}}
{{- $_ := set .Values.conf.qinling.keystone_authtoken "username" .Values.endpoints.identity.auth.qinling.username -}}
{{- end -}}
{{- if empty .Values.conf.qinling.keystone_authtoken.password -}}
{{- $_ := set .Values.conf.qinling.keystone_authtoken "password" .Values.endpoints.identity.auth.qinling.password -}}
{{- end -}}

{{- if empty .Values.conf.qinling.keystone_authtoken.memcached_servers -}}
{{- $_ := tuple "oslo_cache" "internal" "memcache" . | include "helm-toolkit.endpoints.host_and_port_endpoint_uri_lookup" | set .Values.conf.qinling.keystone_authtoken "memcached_servers" -}}
{{- end -}}
{{- if empty .Values.conf.qinling.keystone_authtoken.memcache_secret_key -}}
{{- $_ := set .Values.conf.qinling.keystone_authtoken "memcache_secret_key" ( default ( randAlphaNum 64 ) .Values.endpoints.oslo_cache.auth.memcache_secret_key ) -}}
{{- end -}}

{{- if and (hasKey .Values.conf.qinling "cache") (kindIs "map" .Values.conf.qinling.cache) (empty .Values.conf.qinling.cache.memcache_servers) }}
{{- $_ := tuple "oslo_cache" "internal" "memcache" . | include "helm-toolkit.endpoints.host_and_port_endpoint_uri_lookup" | set .Values.conf.qinling.cache "memcache_servers" -}}
{{- end -}}

{{- if and (not (kindIs "invalid" .Values.conf.qinling.database.connection)) (empty .Values.conf.qinling.database.connection) -}}
{{- $connection := tuple "oslo_db" "internal" "qinling" "mysql" . | include "helm-toolkit.endpoints.authenticated_endpoint_uri_lookup" -}}
{{- if .Values.tls.oslo_db -}}
{{- $_ := (printf "%s?charset=utf8&ssl_ca=/etc/mysql/certs/ca.crt&ssl_key=/etc/mysql/certs/tls.key&ssl_cert=/etc/mysql/certs/tls.crt&ssl_verify_cert" $connection ) | set .Values.conf.qinling.database "connection" -}}
{{- else -}}
{{- $_ := set .Values.conf.qinling.database "connection" $connection -}}
{{- end -}}
{{- end -}}

{{- if empty .Values.conf.qinling.DEFAULT.transport_url -}}
{{- $_ := tuple "oslo_messaging" "internal" "qinling" "amqp" . | include "helm-toolkit.endpoints.authenticated_transport_endpoint_uri_lookup" | set .Values.conf.qinling.DEFAULT "transport_url" -}}
{{- end -}}

{{- if empty .Values.conf.qinling.DEFAULT.qinling_endpoint -}}
{{- $_ := tuple "function_engine" "internal" "api" . | include "helm-toolkit.endpoints.keystone_endpoint_uri_lookup" | trimSuffix "/" | set .Values.conf.qinling.DEFAULT "qinling_endpoint" -}}
{{- end -}}

{{- if empty .Values.conf.qinling.engine.sidecar_image -}}
{{- $_ := set .Values.conf.qinling.engine "sidecar_image" .Values.images.tags.qinling_sidecar -}}
{{- end -}}
{{- if empty .Values.conf.qinling.engine.function_auth_url -}}
{{- $_ := tuple "identity" "internal" "api" . | include "helm-toolkit.endpoints.keystone_endpoint_uri_lookup" | set .Values.conf.qinling.engine "function_auth_url" -}}
{{- end -}}

{{- if empty (index .Values.conf.qinling_api_uwsgi.uwsgi "http-socket") -}}
{{- $http_socket_port := tuple "function_engine" "service" "api" . | include "helm-toolkit.endpoints.endpoint_port_lookup" | toString }}
{{- $http_socket := printf "0.0.0.0:%s" $http_socket_port }}
{{- $_ := set .Values.conf.qinling_api_uwsgi.uwsgi "http-socket" $http_socket -}}
{{- end -}}

{{- if and (empty .Values.conf.logging.handler_fluent) (has "fluent" .Values.conf.logging.handlers.keys) -}}
{{- $fluentd_host := tuple "fluentd" "internal" $envAll | include "helm-toolkit.endpoints.hostname_namespaced_endpoint_lookup" }}
{{- $fluentd_port := tuple "fluentd" "internal" "service" $envAll | include "helm-toolkit.endpoints.endpoint_port_lookup" }}
{{- $fluent_args := printf "('%s.%s', '%s', %s)" .Release.Namespace .deployment_name $fluentd_host $fluentd_port }}
{{- $handler_fluent := dict "class" "fluent.handler.FluentHandler" "formatter" "fluent" "args" $fluent_args -}}
{{- $_ := set .Values.conf.logging "handler_fluent" $handler_fluent -}}
{{- end -}}

{{- if and (empty .Values.conf.logging.formatter_fluent) (has "fluent" .Values.conf.logging.formatters.keys) -}}
{{- $formatter_fluent := dict "class" "oslo_log.formatters.FluentFormatter" -}}
{{- $_ := set .Values.conf.logging "formatter_fluent" $formatter_fluent -}}
{{- end -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: qinling-etc
type: Opaque
data:
  qinling.conf: {{ include "helm-toolkit.utils.to_oslo_conf" .Values.conf.qinling | b64enc }}
  qinling-api-uwsgi.ini: {{ include "helm-toolkit.utils.to_oslo_conf" .Values.conf.qinling_api_uwsgi | b64enc }}
  logging.conf: {{ include "helm-toolkit.utils.to_oslo_conf" .Values.conf.logging | b64enc }}
  policy.yaml: {{ toYaml .Values.conf.policy | b64enc }}
{{- end }}
