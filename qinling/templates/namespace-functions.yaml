{{- if .Values.manifests.namespace_functions }}
---
# The runtime pools and the pods of image functions run tenant code here.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.conf.qinling.kubernetes.namespace }}
  labels:
    name: {{ .Values.conf.qinling.kubernetes.namespace }}
{{- with .Values.functions.namespace_labels }}
{{ toYaml . | indent 4 }}
{{- end }}
  annotations:
    # Keep the functions' pods when the release is removed or replaced; the
    # engine deletes them with their functions.
    helm.sh/resource-policy: keep
{{- end }}
