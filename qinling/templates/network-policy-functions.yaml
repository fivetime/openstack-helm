{{- if .Values.manifests.network_policy_functions }}
{{- $envAll := . }}
{{- $np := .Values.functions.network_policy }}
---
# Every pod in the namespace of the functions runs tenant code.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: qinling-functions
  namespace: {{ .Values.conf.qinling.kubernetes.namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only the engine calls the workers (port 9090).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
{{ tuple $envAll "qinling" "engine" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 14 }}
      ports:
        - protocol: TCP
          port: 9090
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.endpoints.kube_dns.namespace }}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # The sidecars download function packages from the API.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
{{ tuple $envAll "qinling" "api" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 14 }}
      ports:
        - protocol: TCP
          port: {{ tuple "function_engine" "service" "api" . | include "helm-toolkit.endpoints.endpoint_port_lookup" }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
{{ toYaml $np.egress_except | indent 14 }}
        - ipBlock:
            cidr: ::/0
            except:
{{ toYaml $np.egress_except_v6 | indent 14 }}
{{- with $np.extra_egress }}
{{ toYaml . | indent 4 }}
{{- end }}
{{- end }}
