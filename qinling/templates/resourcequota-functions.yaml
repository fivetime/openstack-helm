{{- if and .Values.manifests.namespace_functions .Values.functions.resource_quota }}
---
# A cap on what the runtime pools and image functions may take together.
# Every pod in the namespace has requests and limits (the engine sets them),
# as a quota on cpu and memory requires.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: qinling-functions
  namespace: {{ .Values.conf.qinling.kubernetes.namespace }}
spec:
  hard:
{{ toYaml .Values.functions.resource_quota | indent 4 }}
{{- end }}
