{{/*
RaaS 运行概览仪表盘(dashboards/raas.json):webhook 投递可靠性、作业、机器池。Grafana 的
sidecar 拾取任何命名空间里带 grafana_dashboard: "1" 的 ConfigMap,原样加载、不解析 inputs,
所以 Prometheus 数据源的 uid 在这里填进去(与 incus chart 同一做法)。
面板的查询读的是 ServiceMonitor raas 抓的指标。
*/}}
{{- if .Values.manifests.configmap_grafana_dashboard }}
{{- if not .Values.manifests.servicemonitor }}
{{- fail "manifests.configmap_grafana_dashboard needs manifests.servicemonitor: the panels read the metrics it scrapes" }}
{{- end }}
{{- $envAll := . }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: raas-grafana-dashboard
  labels:
{{ tuple $envAll "raas" "orchestrator" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
    grafana_dashboard: "1"
data:
  raas.json: |
{{ .Files.Get "dashboards/raas.json" | replace "${DS_PROMETHEUS}" .Values.monitoring.grafana.prometheus_datasource_uid | indent 4 }}
{{- end }}
