{{- if .Values.manifests.deployment }}
{{- $envAll := . }}

{{- $serviceAccountName := "raas-orchestrator" }}
{{ tuple $envAll "orchestrator" $serviceAccountName | include "helm-toolkit.snippets.kubernetes_pod_rbac_serviceaccount" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: raas-orchestrator
  annotations:
    {{ tuple $envAll | include "helm-toolkit.snippets.release_uuid" }}
  labels:
{{ tuple $envAll "raas" "orchestrator" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
spec:
  replicas: {{ .Values.pod.replicas.orchestrator }}
  selector:
    matchLabels:
{{ tuple $envAll "raas" "orchestrator" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 6 }}
{{ tuple $envAll | include "helm-toolkit.snippets.kubernetes_upgrades_deployment" | indent 2 }}
  template:
    metadata:
      labels:
{{ tuple $envAll "raas" "orchestrator" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 8 }}
      annotations:
{{ tuple $envAll | include "helm-toolkit.snippets.release_uuid" | indent 8 }}
        configmap-etc-hash: {{ tuple "secret-config.yaml" . | include "helm-toolkit.utils.hash" }}
    spec:
      serviceAccountName: {{ $serviceAccountName }}
{{- if .Values.network.mgmt.enabled }}
      # 管理网形态(Octavia 式):池机器只挂 ci-mgmt-net,编排器要连它们的
      # agent(9443)与 buildkitd(1234),唯一的路是节点上插进 br-int 的
      # 管理网口(r-mgmt0)—— 所以 hostNetwork,并且只能落在有 ovn-controller
      # 的网络节点上(labels.raas 由 override 指到 openstack-network-node)。
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
{{- end }}
      affinity:
{{ tuple $envAll "raas" "orchestrator" | include "helm-toolkit.snippets.kubernetes_pod_anti_affinity" | indent 8 }}
      nodeSelector:
        {{ .Values.labels.raas.node_selector_key }}: {{ .Values.labels.raas.node_selector_value | quote }}
      # 关闭时先停止接收 webhook,再等在途的开机/销毁跑完。进程收到 SIGTERM
      # 后会 orch.Wait();杀早了会留下半途创建的虚拟机和浮动 IP。
      terminationGracePeriodSeconds: {{ .Values.pod.lifecycle.termination_grace_period.orchestrator.timeout }}
{{ dict "envAll" $envAll "application" "raas" | include "helm-toolkit.snippets.kubernetes_pod_security_context" | indent 6 }}
      initContainers:
{{ tuple $envAll "orchestrator" list | include "helm-toolkit.snippets.kubernetes_entrypoint_init_container" | indent 8 }}
{{- if .Values.network.mgmt.enabled }}
        # 管理网两件套(照 octavia health-manager):取端口 → 插 br-int。
        # 端口是**节点级**资源:pod 没了它还在,nic-init 全程幂等。
        - name: raas-mgmt-get-port
{{ tuple $envAll "raas_port_init" | include "helm-toolkit.snippets.image" | indent 10 }}
          env:
            - name: OS_CLOUD
              value: {{ .Values.conf.raas.openstack.cloud }}
            - name: OS_CLIENT_CONFIG_FILE
              value: /etc/raas/clouds.yaml
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.credentials.raas }}
                optional: true
          command:
            - /tmp/raas-mgmt-get-port.sh
          volumeMounts:
            - name: pod-shared
              mountPath: /tmp/pod-shared
            - name: raas-bin
              mountPath: /tmp/raas-mgmt-get-port.sh
              subPath: raas-mgmt-get-port.sh
              readOnly: true
            - name: raas-etc
              mountPath: /etc/raas
              readOnly: true
        - name: raas-mgmt-nic-init
{{ tuple $envAll "raas_nic_init" | include "helm-toolkit.snippets.image" | indent 10 }}
{{ dict "envAll" $envAll "application" "raas" "container" "raas_mgmt_nic_init" | include "helm-toolkit.snippets.kubernetes_container_security_context" | indent 10 }}
          command:
            - /tmp/raas-mgmt-nic-init.sh
          volumeMounts:
            - name: pod-shared
              mountPath: /tmp/pod-shared
            - name: raas-bin
              mountPath: /tmp/raas-mgmt-nic-init.sh
              subPath: raas-mgmt-nic-init.sh
              readOnly: true
            - name: run
              mountPath: /run
{{- end }}
      containers:
        - name: raas
{{ tuple $envAll "raas" | include "helm-toolkit.snippets.image" | indent 10 }}
{{ tuple $envAll $envAll.Values.pod.resources.orchestrator | include "helm-toolkit.snippets.kubernetes_resources" | indent 10 }}
{{ dict "envAll" $envAll "application" "raas" "container" "raas" | include "helm-toolkit.snippets.kubernetes_container_security_context" | indent 10 }}
          command:
            - /usr/local/bin/raas
            - -config
            - /etc/raas/config.yaml
          ports:
            - name: http
              containerPort: {{ .Values.network.orchestrator.port }}
          # 其余密钥(OS_PASSWORD / RAAS_GITHUB_WEBHOOK_SECRET / RAAS_GITHUB_CLIENT_SECRET /
          # RAAS_GITHUB_TOKEN / RAAS_NOTIFICATIONS_PASSWORD)从一个手工维护的 Secret 整体
          # 注入,配置文件里只留结构。optional:没有这个 Secret 时照常启动,值退回配置文件。
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.credentials.raas }}
                optional: true
          env:
            # 数据库连接串不进配置文件:凭据不该和配置放在一起,
            # 编排器启动时会检查它非空。
            - name: RAAS_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.postgresql.raas }}
                  key: RAAS_DSN
            # gophercloud 从 clouds.yaml 读凭据(conf.raas.openstack.cloud)。
            - name: OS_CLIENT_CONFIG_FILE
              value: /etc/raas/clouds.yaml
            # 落库凭据的加密密钥,由 secret-security-key.yaml 生成并跨 upgrade 保留。
            - name: RAAS_SECURITY_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.security.raas }}
                  key: RAAS_SECURITY_KEY
{{- if .Values.pod.probes.orchestrator.raas.readiness.enabled }}
          readinessProbe:
            httpGet:
              # readyz 会真的 ping 数据库;healthz 只表示进程活着。
              # 两者分开:数据库短暂不可用时不该把 pod 杀掉重启。
              path: /readyz
              port: {{ .Values.network.orchestrator.port }}
{{ toYaml .Values.pod.probes.orchestrator.raas.readiness.params | indent 12 }}
{{- end }}
{{- if .Values.pod.probes.orchestrator.raas.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.network.orchestrator.port }}
{{ toYaml .Values.pod.probes.orchestrator.raas.liveness.params | indent 12 }}
{{- end }}
          volumeMounts:
            - name: raas-etc
              mountPath: /etc/raas
              readOnly: true
            - name: pod-tmp
              mountPath: /tmp
{{- if .Values.conf.raas.gitlab.enabled }}
            # 编排器持有配置真相,config.toml 是产物 —— 它写,runner 读。
            # 反过来 runner 的 JSON 日志写在这里,编排器的计费采集读它
            # (GitLab CE 提供不了计量,账本只能建在我们自己这边)。
            - name: gitlab-config
              mountPath: {{ .Values.conf.raas.gitlab.config_dir }}
{{- end }}
{{- if .Values.pod.mounts.raas_orchestrator.raas_orchestrator.volumeMounts }}
{{ toYaml .Values.pod.mounts.raas_orchestrator.raas_orchestrator.volumeMounts | indent 12 }}
{{- end }}
      volumes:
        # 根文件系统只读,但 Go 的临时文件与 gophercloud 的缓存要可写。
        - name: pod-tmp
          emptyDir: {}
{{- if .Values.network.mgmt.enabled }}
        - name: pod-shared
          emptyDir: {}
        - name: raas-bin
          configMap:
            name: raas-bin
            defaultMode: 0555
        - name: run
          hostPath:
            path: /run
{{- end }}
        - name: raas-etc
          secret:
            secretName: raas-etc
            defaultMode: 0444
{{- if .Values.conf.raas.gitlab.enabled }}
        - name: gitlab-config
          persistentVolumeClaim:
            claimName: raas-gitlab-config
{{- end }}
{{- if .Values.pod.mounts.raas_orchestrator.raas_orchestrator.volumes }}
{{ toYaml .Values.pod.mounts.raas_orchestrator.raas_orchestrator.volumes | indent 8 }}
{{- end }}
{{- end }}
