{{- if and .Values.manifests.ingress .Values.network.ingress.enabled }}
{{- $envAll := . }}
{{- $ingress := .Values.network.ingress }}
---
# 本仓库唯一一个公网入口。GitHub 必须能投递 webhook,而其余服务都只在
# 集群内经 Gateway 路由(见 values.yaml 里 network.ingress 的说明)。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: raas
  annotations:
{{ toYaml $ingress.annotations | indent 4 }}
spec:
  ingressClassName: {{ $ingress.class }}
{{- if $ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ $ingress.host | quote }}
      # 通配符证书 *.tue.jp,由 cert-manager 的 letsencrypt-cloudflare
      # (DNS-01)签发,并经 reflector 自动镜像到本 namespace。
      secretName: {{ $ingress.tls.secretName }}
{{- end }}
  rules:
    - host: {{ $ingress.host | quote }}
      http:
        paths:
          - path: {{ $ingress.path }}
            pathType: {{ $ingress.pathType }}
            backend:
              service:
                name: {{ tuple "raas" "internal" . | include "helm-toolkit.endpoints.hostname_short_endpoint_lookup" }}
                port:
                  number: {{ tuple "raas" "internal" "api" . | include "helm-toolkit.endpoints.endpoint_port_lookup" }}
{{- end }}
