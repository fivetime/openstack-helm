{{- if .Values.manifests.secret_config }}
{{- $envAll := . }}
---
# 整份配置放 Secret 而不是 ConfigMap:里面有 webhook 密钥、GitHub token
# 与消息总线口令。数据库连接串不在这里,由 RAAS_DSN 环境变量单独注入。
apiVersion: v1
kind: Secret
metadata:
  name: raas-etc
type: Opaque
data:
  config.yaml: {{ toYaml .Values.conf.raas | b64enc }}
  clouds.yaml: {{ toYaml .Values.conf.clouds | b64enc }}
{{- end }}
