{{- if .Values.manifests.secret_security_key }}
{{- $name := .Values.secrets.security.raas }}
{{/*
  加密落库凭据(GitHub App 的 client secret / webhook secret / 私钥)的密钥。
  首次安装随机生成;之后每次 upgrade 用 lookup 把已有的值原样带过来 ——
  换了密钥,库里的 App 凭据就再也解不开,编排器起不来。
  `helm template` 里 lookup 拿不到集群,会渲染出一个新值,那只是渲染,不是真的换。
*/}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $key := "" }}
{{- if and $existing $existing.data (index $existing.data "RAAS_SECURITY_KEY") }}
{{-   $key = index $existing.data "RAAS_SECURITY_KEY" }}
{{- else }}
{{-   $key = randAlphaNum 48 | b64enc }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  annotations:
    # 卸载 release 也别删:它是库里凭据的唯一钥匙。
    helm.sh/resource-policy: keep
type: Opaque
data:
  RAAS_SECURITY_KEY: {{ $key }}
{{- end }}
