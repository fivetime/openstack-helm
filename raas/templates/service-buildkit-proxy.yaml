{{/*
BuildKit 数据面的 Service(doc/buildkit-service.md §4.4):租户的 buildx 经它到代理,
代理跑在编排器 Pod 里,所以 selector 对准 orchestrator。名字与端口从
endpoints.buildkit_proxy 取,形态(LB 类型、双栈、IP 池标签、固定地址)从
network.buildkit_proxy 取。它曾是 override 里的 extraObjects —— 裸清单被 --values
接受却不建对象、新环境没有入口,2026-08-31 审计撞过;进 chart 之后没有这条路可走错。
*/}}
{{- if and .Values.manifests.service_buildkit_proxy .Values.conf.raas.buildkit.enabled }}
{{- $envAll := . }}
{{- $net := .Values.network.buildkit_proxy }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ tuple "buildkit_proxy" "internal" . | include "helm-toolkit.endpoints.hostname_short_endpoint_lookup" }}
  labels:
{{ tuple $envAll "raas" "buildkit-proxy" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
{{- with $net.labels }}
{{ toYaml . | indent 4 }}
{{- end }}
{{- with $net.annotations }}
  annotations:
{{ toYaml . | indent 4 }}
{{- end }}
spec:
  type: {{ $net.service_type }}
{{- if eq $net.service_type "LoadBalancer" }}
  externalTrafficPolicy: {{ $net.external_traffic_policy }}
{{- end }}
{{- with $net.ip_family_policy }}
  ipFamilyPolicy: {{ . }}
{{- end }}
{{- with $net.ip_families }}
  ipFamilies:
{{ toYaml . | indent 4 }}
{{- end }}
  selector:
{{ tuple $envAll "raas" "orchestrator" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
  ports:
    - name: buildkit
      port: {{ tuple "buildkit_proxy" "internal" "proxy" . | include "helm-toolkit.endpoints.endpoint_port_lookup" }}
      targetPort: {{ tuple "buildkit_proxy" "internal" "proxy" . | include "helm-toolkit.endpoints.endpoint_port_lookup" }}
      protocol: TCP
{{- end }}
