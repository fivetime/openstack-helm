{{- if .Values.manifests.service }}
{{- $envAll := . }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ tuple "raas" "internal" . | include "helm-toolkit.endpoints.hostname_short_endpoint_lookup" }}
  # 标签不是装饰:ServiceMonitor 按 application/component 选 Service,没有标签就没有抓取目标
  # (2026-09-07 首次接监控时就是这样空转的)。
  labels:
{{ tuple $envAll "raas" "orchestrator" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
spec:
  ports:
    - name: http
      port: {{ tuple "raas" "internal" "api" . | include "helm-toolkit.endpoints.endpoint_port_lookup" }}
      targetPort: {{ .Values.network.orchestrator.port }}
  selector:
{{ tuple $envAll "raas" "orchestrator" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
{{- end }}
