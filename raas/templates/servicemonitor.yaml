{{/*
编排器的 /metrics 与 API 同端口(raas-api Service 的 http)。2026-09-07 之前没有任何抓取
对象:raas_* 指标只存在于 pod 上,告警规则无从谈起。
*/}}
{{- if .Values.manifests.servicemonitor }}
{{- $envAll := . }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: raas
  labels:
{{ tuple $envAll "raas" "orchestrator" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      application: raas
      component: orchestrator
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
{{- end }}
