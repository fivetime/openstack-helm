{{/*
GitLab CI 那条链路的 runner。

为什么是独立工作负载而不是编排器的 sidecar:**分片**。
concurrent 与 check_interval 都是进程级的 —— 同一分片里一个租户的慢作业会
吃掉所有人的 slot,而 check_interval 被 [[runners]] 块数平分。分片数是部署期
决定的(改它会重排全部租户的归属,那意味着一次全体重启),所以拓扑必须从一开始
就支持多副本,不能等到需要时再改。

为什么是 StatefulSet 而不是 Deployment:每个副本要稳定的序号 ——
它决定读哪一份 config-shard-N.toml。

共享卷:
  gitlab-config  编排器写 config-shard-N.toml 与 runner 日志,runner 读配置、
                 写日志。RWX,两边都挂。
  gitlab-state   fleeting 的 state_storage。**必须持久** —— 丢了它,进程重启时
                 fleeting 会把所有"来历不明"的已存在实例删掉
                 (CausePreexisted && !Restored),而改配置就得重启。
*/}}
{{- if and .Values.manifests.statefulset_gitlab_runner .Values.conf.raas.gitlab.enabled }}
{{- $envAll := . }}
{{- $mgmt := .Values.network.mgmt }}
{{- $slot := dict }}
{{- if and $mgmt.enabled $mgmt.attachments.gitlab_runner }}
{{-   if gt (int (.Values.conf.raas.gitlab.shards | default 1)) 1 }}
{{-     fail "network.mgmt.attachments.gitlab_runner: attachment 形态目前只支持 shards: 1(注解在 Pod 模板上,多分片需一槽一 StatefulSet)" }}
{{-   end }}
{{-   $slot = first $mgmt.attachments.gitlab_runner }}
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: raas-gitlab-runner
  labels:
{{ tuple $envAll "raas" "gitlab-runner" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
spec:
  serviceName: raas-gitlab-runner
  replicas: {{ .Values.conf.raas.gitlab.shards | default 1 }}
  # OrderedReady 会让高序号副本起不来时低序号永不更新,而 helm 仍报 deployed。
  # 分片之间没有依赖,并行更新即可。
  podManagementPolicy: Parallel
  selector:
    matchLabels:
{{ tuple $envAll "raas" "gitlab-runner" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 6 }}
  template:
    metadata:
      labels:
{{ tuple $envAll "raas" "gitlab-runner" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 8 }}
      annotations:
        configmap-etc-hash: {{ tuple "secret-config.yaml" . | include "helm-toolkit.utils.hash" }}
{{- if $slot }}
        {{- $network := dict "name" $mgmt.nad_name "namespace" ($mgmt.nad_namespace | default .Release.Namespace) "mac" $slot.mac "ips" (list (printf "%s/%d" $slot.ip (int $mgmt.prefix_length))) "cni-args" (dict "OvnPort" $slot.port_id) }}
        k8s.v1.cni.cncf.io/networks: {{ list $network | toJson | quote }}
{{- end }}
    spec:
{{ dict "envAll" $envAll "application" "gitlab_runner" | include "helm-toolkit.snippets.kubernetes_pod_security_context" | indent 6 }}
      nodeSelector:
        {{ .Values.labels.gitlab_runner.node_selector_key }}: {{ .Values.labels.gitlab_runner.node_selector_value }}
{{- if and .Values.pod.tolerations.gitlab_runner.enabled .Values.pod.tolerations.gitlab_runner.tolerations }}
      tolerations:
{{ toYaml .Values.pod.tolerations.gitlab_runner.tolerations | indent 8 }}
{{- end }}
{{- if and .Values.network.mgmt.enabled (not $slot) }}
      # manager 只能从管理网 SSH 进池机器 —— 与编排器同样的 hostNetwork +
      # 网络节点形态,共用节点上的 r-mgmt0(nic-init 幂等,谁先跑谁建)。
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      initContainers:
        - name: raas-mgmt-get-port
{{ tuple $envAll "raas_port_init" | include "helm-toolkit.snippets.image" | indent 10 }}
          env:
            - name: OS_CLOUD
              value: {{ .Values.conf.raas.openstack.cloud }}
            - name: OS_CLIENT_CONFIG_FILE
              value: /etc/raas/clouds.yaml
            # 端口由编排器 pod 创建,这里只等 —— 并发 create 会造出两个同名端口。
            - name: RAAS_MGMT_CREATE_PORT
              value: "false"
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.credentials.raas }}
                optional: true
          command:
            - /tmp/raas-mgmt-get-port.sh
          volumeMounts:
            - name: pod-shared
              mountPath: /tmp/pod-shared
            - name: raas-bin
              mountPath: /tmp/raas-mgmt-get-port.sh
              subPath: raas-mgmt-get-port.sh
              readOnly: true
            - name: raas-etc
              mountPath: /etc/raas
              readOnly: true
        - name: raas-mgmt-nic-init
{{ tuple $envAll "raas_nic_init" | include "helm-toolkit.snippets.image" | indent 10 }}
{{ dict "envAll" $envAll "application" "gitlab_runner" "container" "raas_mgmt_nic_init" | include "helm-toolkit.snippets.kubernetes_container_security_context" | indent 10 }}
          command:
            - /tmp/raas-mgmt-nic-init.sh
          volumeMounts:
            - name: pod-shared
              mountPath: /tmp/pod-shared
            - name: raas-bin
              mountPath: /tmp/raas-mgmt-nic-init.sh
              subPath: raas-mgmt-nic-init.sh
              readOnly: true
            - name: run
              mountPath: /run
{{- end }}
      containers:
        - name: gitlab-runner
{{ tuple $envAll "raas_gitlab_runner" | include "helm-toolkit.snippets.image" | indent 10 }}
{{ dict "envAll" $envAll "application" "gitlab_runner" "container" "gitlab_runner" | include "helm-toolkit.snippets.kubernetes_container_security_context" | indent 10 }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              # 分片号取自**pod 名**,不是 $HOSTNAME:hostNetwork 下容器的
              # hostname 是**节点名**(network1.cloud.local),推出来的分片号会变成
              # "config-shard-network1.cloud.local.toml",而编排器写的是
              # config-shard-0.toml —— runner 于是永远等下去,日志只说"等配置",
              # 看不出与 hostNetwork 有关(2026-08-31 实测)。
              SHARD="${POD_NAME##*-}"
              CFG="{{ .Values.conf.raas.gitlab.config_dir }}/config-shard-${SHARD}.toml"
              # 编排器生成配置。第一次部署时它可能还没写出来 —— 等,别退出:
              # CrashLoopBackOff 会把"配置还没生成"渲染成一个看起来很严重的故障。
              until [ -f "$CFG" ]; do
                echo "waiting for ${CFG} (the orchestrator renders it)"
                sleep 5
              done
              # 日志写进共享卷:编排器的计费采集从这里读。
              # GitLab CE 提供不了计量,账本只能建在我们自己这边。
              exec gitlab-runner run -c "$CFG" \
                --working-directory {{ .Values.conf.raas.gitlab.state_dir }} \
                2>&1 | tee -a "{{ .Values.conf.raas.gitlab.runner_log_path }}"
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # gitlab-runner 自己的日志格式。计费解析依赖它是 JSON:
            # Build.Log() 让每行自带 job / project / namespace,时间戳 RFC3339Nano。
            - name: LOG_FORMAT
              value: json
          volumeMounts:
            - name: gitlab-config
              mountPath: {{ .Values.conf.raas.gitlab.config_dir }}
            - name: gitlab-state
              mountPath: {{ .Values.conf.raas.gitlab.state_dir }}
            - name: pod-tmp
              mountPath: /tmp
      volumes:
        - name: pod-tmp
          emptyDir: {}
{{- if and .Values.network.mgmt.enabled (not $slot) }}
        - name: pod-shared
          emptyDir: {}
        - name: raas-bin
          configMap:
            name: raas-bin
            defaultMode: 0555
        - name: raas-etc
          secret:
            secretName: raas-etc
            defaultMode: 0444
        - name: run
          hostPath:
            path: /run
{{- end }}
        - name: gitlab-config
          persistentVolumeClaim:
            claimName: raas-gitlab-config
  volumeClaimTemplates:
    - metadata:
        name: gitlab-state
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.volume.gitlab_state.class_name }}
        resources:
          requests:
            storage: {{ .Values.volume.gitlab_state.size }}
{{- end }}
