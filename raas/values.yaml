# RaaS 编排器:把 GitHub 的 workflow_job webhook 变成一台一次性的 OpenStack
# 虚拟机,作业跑完即销毁。
#
# 它与本仓库其余 chart 有两点不同:
#   ① 不是 OpenStack 服务,不注册 keystone 端点、不建库、不连 RabbitMQ。
#      数据库连接串由 Secret 以环境变量注入,不走 helm-toolkit 的 db-init。
#   ② 需要【公网】入口 —— GitHub 得能投递 webhook。其余服务都只在集群内
#      经 Gateway 路由,详见下面 network.ingress 的说明。

---
images:
  tags:
    raas: ghcr.io/fivetime/openstackhelm/raas:latest
    # GitLab 那条链路的 runner:gitlab-runner + 我们的 fleeting 插件。
    # 两者的 fleeting 版本在构建期强制一致 —— 错配的表现是 go-plugin
    # 握手直接失败,那要等部署上去才看得见。
    raas_gitlab_runner: ghcr.io/fivetime/openstackhelm/raas-gitlab-runner:latest
    # 管理网 init 容器(network.mgmt.enabled 时用):取端口要 openstack CLI,
    # 插 br-int 要 ovs-vsctl。
    raas_port_init: quay.io/airshipit/openstack-client:2026.1-ubuntu_noble
    raas_nic_init: quay.io/airshipit/openvswitch:latest-ubuntu_jammy
    dep_check: quay.io/airshipit/kubernetes-entrypoint:latest-ubuntu_noble
    image_repo_sync: quay.io/airshipit/docker:27.5.0
  pull_policy: IfNotPresent
  local_registry:
    active: false
    exclude:
      - dep_check
      - image_repo_sync

pod:
  # 额外挂载的挂载点。计费要连 Redpanda(SASL_SSL),CA 从这里挂进来。
  #
  # ⚠️ volumeMounts / volumes 是列表,helm 对列表是覆盖不是合并 ——
  #    要加挂载必须在同一份 override 文件里一次写全,拆开会互相顶掉。
  mounts:
    raas_orchestrator:
      raas_orchestrator:
        volumeMounts: []
        volumes: []
  security_context:
    # GitLab 那条链路的 runner。**fsGroup 不能省**:state_storage 是一个 RBD
    # 卷,挂进来是 root:root,而容器以 42424 跑 —— 少了它 fleeting 初始化时报
    #   creating state storage: mkdir /var/lib/raas/fleeting/shard-0: permission denied
    # 表现是 runner 反复 "Failed to process runner",作业永远不被领走,
    # 而 GitLab 那边只显示"作业排队中"。与 GitHub 私钥那次(Secret 文件
    # root 属主、容器跑 42424)是同一个形状。
    gitlab_runner:
      pod:
        runAsUser: 42424
        fsGroup: 42424
      container:
        # nic-init 要 ovs-vsctl + ip link/addr:root + NET_ADMIN,别无他法。
        raas_mgmt_nic_init:
          runAsUser: 0
          capabilities:
            add: [NET_ADMIN, NET_RAW]
        gitlab_runner:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
    raas:
      pod:
        runAsUser: 42424
      container:
        raas_mgmt_nic_init:
          runAsUser: 0
          capabilities:
            add: [NET_ADMIN, NET_RAW]
        raas:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
  # 网络节点带 NoSchedule 污点(node-role.kubernetes.io/network)。管理网形态下
  # 编排器与 gitlab-runner 必须落在那里(只有它们跑 ovn-controller),所以要容忍。
  # ⚠️ 少了它 pod 直接 Pending,事件里只说"untolerated taint" —— 与管理网毫无关联。
  tolerations:
    orchestrator:
      enabled: false
      tolerations: []
    gitlab_runner:
      enabled: false
      tolerations: []
  affinity:
    anti:
      type:
        default: preferredDuringSchedulingIgnoredDuringExecution
      topologyKey:
        default: kubernetes.io/hostname
      weight:
        default: 10
  replicas:
    orchestrator: 2
  lifecycle:
    upgrades:
      deployments:
        revision_history: 3
        pod_replacement_strategy: RollingUpdate
        rolling_update:
          max_unavailable: 1
          max_surge: 3
    termination_grace_period:
      orchestrator:
        # 关闭时要等在途的开机/销毁跑完,否则会留下半途创建的资源。
        # 开机最长 boot_timeout(默认 15m),这里给足余量。
        timeout: 1200
  probes:
    orchestrator:
      raas:
        readiness:
          enabled: true
          params:
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
        liveness:
          enabled: true
          params:
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
  resources:
    enabled: false
    orchestrator:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "1000m"
    jobs:
      image_repo_sync:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "1024Mi"
          cpu: "2000m"

labels:
  gitlab_runner:
    node_selector_key: openstack-control-plane
    node_selector_value: enabled
  raas:
    node_selector_key: openstack-control-plane
    node_selector_value: enabled
  job:
    node_selector_key: openstack-control-plane
    node_selector_value: enabled

network:
  orchestrator:
    port: 8080
  # 管理网(Octavia 式,ci-mgmt-net):打开后编排器与 gitlab-runner 走
  # hostNetwork + 网络节点,init 容器把每节点一个的 Neutron 端口插进 br-int。
  # ⚠️ 打开前 labels.raas / labels.gitlab_runner 必须指到有 ovn-controller 的
  # 节点(openstack-network-node)—— control 节点插不了 br-int。
  mgmt:
    enabled: false
    network: ci-mgmt-net
    interface: r-mgmt0
    mtu: 1442
  ingress:
    # GitHub 必须够得着 webhook,所以这是本仓库里唯一一个需要公网入口的
    # chart。走 cilium Ingress 而不是 Gateway API,理由:
    #   - 公网流量的落点是 cilium Ingress 的共享 VIP(100.64.1.1 /
    #     2400:2410:ef28:2a00:c:2:0:1),通配符 DNS 与 Cloudflare 回源都已
    #     指向它;openstack-gateway 是另一个 VIP(10.224.18.7)且只有 HTTP
    #     监听器,改用它要重配 Cloudflare。
    #   - 分工上也说得通:Gateway 管集群内路由,cilium Ingress 管公网边缘,
    #     与 kube-infra 里 harbor / gitlab / netbox 的做法一致。
    enabled: true
    class: cilium
    host: raas.tue.jp
    # 只把 GitHub 真正需要的路径放到公网。
    #
    # 用 "/" 会连带把 /metrics 与 /readyz 一起暴露出去 —— 前者泄露作业量、
    # 开机耗时这类运营数据,后者把数据库健康状况告诉全世界。Prometheus 在
    # 集群内经 Service 抓取,不走这条 Ingress,所以收窄不影响监控。
    # 两条,不是一条通配:
    #   /webhook —— GitHub 投递事件
    #   /setup   —— GitHub App 安装完成后把**租户的浏览器**送回来的落点。
    #               它必须公网可达(浏览器在租户那边),但同样不是通配:
    #               /metrics、/readyz、/v1 都不该出现在公网上。
    paths:
      - /webhook
      - /setup
      # 管理员在面板上创建 GitHub App 时,GitHub 把他的浏览器送回这里
      # (manifest 流程的 redirect_url)。同样不是通配。
      - /github-app
      # 租户在自己的 GitLab 上点完授权,GitLab 把他的浏览器送回这里。
      # **加 GitLab 链路时漏了这一条**:路由在编排器里挂好了,入口上却没开门,
      # 表现是授权成功、回调页打不开 —— 而租户看到的是一个白页,
      # 完全看不出是入口的问题。
      - /gitlab/callback
    pathType: Prefix
    annotations:
      # shared:挂到已有的共享 VIP,不额外占一个 LB IP。
      ingress.cilium.io/loadbalancer-mode: shared
      ingress.kubernetes.io/ssl-redirect: "true"
    tls:
      enabled: true
      # cert-manager 用 ClusterIssuer letsencrypt-cloudflare(DNS-01)签的
      # *.tue.jp 通配符证书。它带 reflector 注解自动镜像到所有 namespace,
      # 所以这里直接引用即可,不必为本服务单独申请证书。
      secretName: tue-jp-tls

conf:
  # 渲染进 /etc/raas/config.yaml。整份配置放 Secret 而不是 ConfigMap:
  # 里面有 webhook 密钥、GitHub token 与消息总线口令。
  raas:
    server:
      addr: ":8080"
    github:
      webhook_secret: null
      token: null
    openstack:
      cloud: openstack_helm
      # 机器的出网网络由**租户在 Horizon 里选**(tenant_network 表)。这里留
      # null:配了值就成了"租户没选网络"时的静默回落,而那正是管理网重构要
      # 废掉的老形态。
      # ⚠️ 默认值必须是 null,不能是某个网络名 —— **从 override 里删掉这个键
      #    覆盖不掉 chart 默认值**,浮动 IP 那次就是这么漏出去的。
      network_id: null
      # 浮动 IP 默认不分配:所有产品线都经 NAT 出网,没有一条需要入站可达的
      # 公网地址,而每台机器一个 FIP 是按机器数长期漏钱。只有要给某个部署固定
      # 入站地址时才填。
      floating_ip_network: null
      security_groups:
        - ci-runner
      key_name: null
    runner:
      version: "2.336.0"
      docker_mtu: 1442
      boot_timeout: 20m
    notifications:
      brokers: []
      topic: notifications
      publisher_id: raas.orchestrator
      sasl_mechanism: SCRAM-SHA-512
      ca_file: /etc/redpanda-ca/ca.crt
    # GitLab 链路默认关。**这个键不能缺**:statefulset/pvc/deployment 三个模板
    # 无保护地解引用 .Values.conf.raas.gitlab.enabled,缺了它 chart 用默认值
    # 渲染直接 nil pointer —— helm lint/新环境裸装全炸,而线上带 override
    # 一直正常,谁都看不见。
    gitlab:
      enabled: false
    # runs-on 标签目录来自云(flavor 的 raas:label / raas:os,镜像的 raas_os),
    # 不在配置里。编排器的配置解析是严格模式,这里出现 labels: 会起不来。
    tenants: {}

  # clouds.yaml 供 gophercloud 读取(cloud: openstack_helm)。
  clouds:
    clouds:
      openstack_helm:
        region_name: RegionOne
        identity_api_version: 3
        auth: {}

secrets:
  oci_image_registry:
    raas: raas-oci-image-registry-key
  # 数据库连接串经环境变量 RAAS_DSN 注入,不进配置文件 ——
  # 凭据不该跟配置放在一起(编排器在启动时就要求它非空)。
  postgresql:
    raas: raas-db-dsn
  # 加密落库的 GitHub App 凭据。chart 首次安装随机生成,之后 lookup 保留。
  security:
    raas: raas-security-key
  # 运行时密钥(OpenStack 口令、webhook secret、App client secret、消息总线口令),
  # 手工创建,整体 envFrom 注入。键名见 deployment.yaml 的注释。
  credentials:
    raas: raas-credentials

dependencies:
  dynamic:
    common:
      local_image_registry:
        jobs:
          - raas-image-repo-sync
        services:
          - endpoint: node
            service: local_image_registry
  static:
    image_repo_sync:
      services:
        - endpoint: internal
          service: local_image_registry
    orchestrator:
      services:
        - endpoint: internal
          service: identity

endpoints:
  cluster_domain_suffix: cluster.local
  local_image_registry:
    name: docker-registry
    namespace: docker-registry
    hosts:
      default: localhost
      internal: docker-registry
      node: localhost
    host_fqdn_override:
      default: null
    port:
      registry:
        node: 5000
  oci_image_registry:
    name: oci-image-registry
    namespace: oci-image-registry
    auth:
      enabled: false
      raas:
        username: raas
        password: password
    hosts:
      default: localhost
    host_fqdn_override:
      default: null
    port:
      registry:
        default: null
  identity:
    name: keystone
    # 只留 dep-check 要的 hosts/port。曾经有一段 auth.raas(role/username/
    # password/project_name: service/user_domain_name: service)—— 全 chart
    # 没有任何消费方,而且**内容是错的**:线上 raas 用户在 default 域,不在
    # service 域。死值最危险的形态就是"看起来像配置真相"。
    hosts:
      default: keystone
      internal: keystone-api
    host_fqdn_override:
      default: null
    path:
      default: /v3
    scheme:
      default: http
    port:
      api:
        default: 80
        internal: 5000
  raas:
    name: raas
    hosts:
      default: raas-api
    host_fqdn_override:
      default: null
    path:
      default: /
    scheme:
      default: http
    port:
      api:
        default: 8080

# GitLab 链路的两个卷。
volume:
  # 编排器与 runner 共享:前者写 config-shard-N.toml 与读 runner 日志,
  # 后者读配置与写日志。**必须 RWX**,而且分片多于一个时是多个 pod。
  gitlab_config:
    class_name: hdd-ec42-fs-erasure
    size: 1Gi
  # fleeting 的 state_storage。丢了它,进程重启时 fleeting 会把所有
  # "来历不明"的已存在实例删掉 —— 而改配置就得重启。
  gitlab_state:
    class_name: nvme-ec42-rbd-pool
    size: 1Gi

manifests:
  configmap_bin: true
  # GitLab 链路的两个对象。它们还各自受 conf.raas.gitlab.enabled 约束 ——
  # 只装了 GitHub 的部署不该被迫建出一个空跑的 runner。
  pvc_gitlab_config: true
  statefulset_gitlab_runner: true
  deployment: true
  ingress: true
  job_image_repo_sync: true
  secret_config: true
  secret_security_key: true
  secret_registry: true
  service: true
...
