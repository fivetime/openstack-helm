# Default values for senlin.
# This is a YAML-formatted file.
# Declare name/value pairs to be passed into your templates.
# name: value

---
release_group: null

labels:
  api:
    node_selector_key: openstack-control-plane
    node_selector_value: enabled
  conductor:
    node_selector_key: openstack-control-plane
    node_selector_value: enabled
  engine:
    node_selector_key: openstack-control-plane
    node_selector_value: enabled
  health_manager:
    node_selector_key: openstack-control-plane
    node_selector_value: enabled
  job:
    node_selector_key: openstack-control-plane
    node_selector_value: enabled
  test:
    node_selector_key: openstack-control-plane
    node_selector_value: enabled

# Senlin is retired upstream and has no quay.io/airshipit image; the fork
# fivetime/openstack-senlin builds it for 2026.2 only (openstack-helm-images
# build-local.d/senlin.yaml).
images:
  tags:
    test: docker.io/xrally/xrally-openstack:2.0.0
    bootstrap: quay.io/airshipit/openstack-client:2026.2-ubuntu_resolute
    db_init: quay.io/airshipit/openstack-client:2026.2-ubuntu_resolute
    senlin_db_sync: ghcr.io/fivetime/openstackhelm/senlin:2026.2-ubuntu_resolute
    db_drop: quay.io/airshipit/openstack-client:2026.2-ubuntu_resolute
    rabbit_init: docker.io/rabbitmq:4.3.5-management
    ks_user: quay.io/airshipit/openstack-client:2026.2-ubuntu_resolute
    ks_service: quay.io/airshipit/openstack-client:2026.2-ubuntu_resolute
    ks_endpoints: quay.io/airshipit/openstack-client:2026.2-ubuntu_resolute
    senlin_api: ghcr.io/fivetime/openstackhelm/senlin:2026.2-ubuntu_resolute
    senlin_conductor: ghcr.io/fivetime/openstackhelm/senlin:2026.2-ubuntu_resolute
    senlin_engine: ghcr.io/fivetime/openstackhelm/senlin:2026.2-ubuntu_resolute
    senlin_engine_cleaner: ghcr.io/fivetime/openstackhelm/senlin:2026.2-ubuntu_resolute
    senlin_health_manager: ghcr.io/fivetime/openstackhelm/senlin:2026.2-ubuntu_resolute
    dep_check: quay.io/airshipit/kubernetes-entrypoint:latest-ubuntu_noble
    image_repo_sync: docker.io/docker:17.07.0
  pull_policy: "IfNotPresent"
  local_registry:
    active: false
    exclude:
      - dep_check
      - image_repo_sync

jobs:
  # -- senlin-manage service clean: removes the records of dead services and
  ## fails the actions they left behind, releasing their locks.
  engine_cleaner:
    cron: "*/5 * * * *"
    starting_deadline: 600
    history:
      success: 3
      failed: 1

conf:
  rally_tests:
    run_tempest: false
    tests:
      SenlinClusters.create_and_delete_cluster:
        - args:
            desired_capacity: 3
            min_size: 0
            max_size: 5
          runner:
            concurrency: 1
            times: 1
            type: constant
          sla:
            failure_rate:
              max: 0
          context:
            profiles:
              type: os.nova.server
              version: "1.0"
              properties:
                name: cirros_server
                flavor: 689eeda3-c6cd-450f-b000-58025c783763
                image: df0c1a14-0940-4ae5-be5c-bb06aa407da2
                networks:
                  - network: public
    templates: []
  paste:
    composite:senlin-api:
      use: "egg:Paste#urlmap"
      /: api
      /healthcheck: healthcheck
    pipeline:api:
      pipeline: cors http_proxy_to_wsgi request_id faultwrap versionnegotiation osprofiler webhook authtoken context trust apiv1app
    app:apiv1app:
      paste.app_factory: senlin.api.common.wsgi:app_factory
      senlin.app_factory: senlin.api.openstack.v1.router:API
    app:healthcheck:
      paste.app_factory: oslo_middleware:Healthcheck.app_factory
    filter:request_id:
      paste.filter_factory: oslo_middleware.request_id:RequestId.factory
    filter:faultwrap:
      paste.filter_factory: senlin.api.common.wsgi:filter_factory
      senlin.filter_factory: senlin.api.middleware:fault_filter
    filter:context:
      paste.filter_factory: senlin.api.common.wsgi:filter_factory
      senlin.filter_factory: senlin.api.middleware:context_filter
      oslo_config_project: senlin
    filter:versionnegotiation:
      paste.filter_factory: senlin.api.common.wsgi:filter_factory
      senlin.filter_factory: senlin.api.middleware:version_filter
    filter:trust:
      paste.filter_factory: senlin.api.common.wsgi:filter_factory
      senlin.filter_factory: senlin.api.middleware:trust_filter
    filter:webhook:
      paste.filter_factory: senlin.api.common.wsgi:filter_factory
      senlin.filter_factory: senlin.api.middleware:webhook_filter
    filter:http_proxy_to_wsgi:
      paste.filter_factory: oslo_middleware.http_proxy_to_wsgi:HTTPProxyToWSGI.factory
      oslo_config_project: senlin
    filter:authtoken:
      paste.filter_factory: keystonemiddleware.auth_token:filter_factory
    filter:osprofiler:
      paste.filter_factory: osprofiler.web:WsgiMiddleware.factory
    filter:cors:
      paste.filter_factory: oslo_middleware.cors:filter_factory
      oslo_config_project: senlin
  policy: {}
  senlin:
    DEFAULT:
      log_config_append: /etc/senlin/logging.conf
      # -- Shared by all pods of a service, so that their RPC server queues
      ## do not multiply with the pods.
      host: senlin
    database:
      max_retries: -1
      # -- Database connection URI. When empty the URI is auto-generated
      ## from endpoints.oslo_db. Set to null to disable auto-generation,
      ## e.g. when using an operator such as mariadb-operator that supplies
      ## the connection string via a mounted configuration snippet.
      connection: ""
    authentication:
      # -- The service credentials senlin uses to create trusts and to call
      ## the cloud for its clusters; filled in from endpoints.identity.
      interface: internal
    keystone_authtoken:
      auth_type: password
      auth_version: v3
      memcache_security_strategy: ENCRYPT
      service_type: clustering
    oslo_messaging_notifications:
      driver: messagingv2
    oslo_middleware:
      enable_proxy_headers_parsing: true
    oslo_messaging_rabbit:
      rabbit_ha_queues: false
      # -- Durable queues are required by RabbitMQ 4.x, which denies
      ## transient non-exclusive queues by default. Also valid on 3.x.
      amqp_durable_queues: true
      # -- Quorum queues, which RabbitMQ 4.x requires: it denies transient
      ## non-exclusive queues, and oslo.messaging declares its reply and fanout
      ## queues that way unless the transient ones are quorum too.
      ## amqp_durable_queues alone only covers the RPC and notification queues.
      rabbit_quorum_queue: true
      rabbit_transient_quorum_queue: true
      use_queue_manager: true
      rabbit_qos_prefetch_count: 1
      rabbit_stream_fanout: true
    oslo_policy:
      policy_file: /etc/senlin/policy.yaml
    oslo_concurrency:
      lock_path: /var/lock
  logging:
    loggers:
      keys:
        - root
        - senlin
    handlers:
      keys:
        - stdout
        - stderr
        - "null"
    formatters:
      keys:
        - context
        - default
    logger_root:
      level: WARNING
      handlers: 'null'
    logger_senlin:
      level: INFO
      handlers:
        - stdout
      qualname: senlin
    logger_amqp:
      level: WARNING
      handlers: stderr
      qualname: amqp
    logger_amqplib:
      level: WARNING
      handlers: stderr
      qualname: amqplib
    logger_eventletwsgi:
      level: WARNING
      handlers: stderr
      qualname: eventlet.wsgi.server
    logger_sqlalchemy:
      level: WARNING
      handlers: stderr
      qualname: sqlalchemy
    logger_boto:
      level: WARNING
      handlers: stderr
      qualname: boto
    handler_null:
      class: logging.NullHandler
      formatter: default
      args: ()
    handler_stdout:
      class: StreamHandler
      args: (sys.stdout,)
      formatter: context
    handler_stderr:
      class: StreamHandler
      args: (sys.stderr,)
      formatter: context
    formatter_context:
      class: oslo_log.formatters.ContextFormatter
      datefmt: "%Y-%m-%d %H:%M:%S"
    formatter_default:
      format: "%(message)s"
      datefmt: "%Y-%m-%d %H:%M:%S"
  rabbitmq:
    # NOTE(rk760n): adding rmq policy to set an expiration time on notification queues
    policies:
      - vhost: "senlin"
        name: "ha_ttl_senlin"
        definition:
          # 70s
          message-ttl: 70000
        priority: 0
        apply-to: all
        pattern: '^(?!(amq\.|reply_)).*'
  senlin_api_uwsgi:
    uwsgi:
      add-header: "Connection: close"
      buffer-size: 65535
      die-on-term: true
      enable-threads: true
      exit-on-reload: false
      hook-master-start: unix_signal:15 gracefully_kill_them_all
      lazy-apps: true
      log-x-forwarded-for: true
      master: true
      need-app: true
      processes: 1
      procname-prefix-spaced: "senlin-api:"
      route-user-agent: '^kube-probe.* donotlog:'
      thunder-lock: true
      worker-reload-mercy: 80
      module: senlin.wsgi.api:application
      stats: 0.0.0.0:1717
      stats-http: true

network:
  api:
    # Pod port the Service routes to; null => Kubernetes uses the Service port.
    # A deployment override sets this (e.g. 443) to point at a TLS sidecar.
    target_port: null
    external_policy_local: false
    node_port:
      enabled: false
      port: 30778

bootstrap:
  enabled: false
  ks_user: senlin
  script: |
    openstack token issue

dependencies:
  dynamic:
    common:
      local_image_registry:
        jobs:
          - senlin-image-repo-sync
        services:
          - endpoint: node
            service: local_image_registry
  static:
    api:
      jobs:
        - senlin-db-sync
        - senlin-rabbit-init
        - senlin-ks-user
        - senlin-ks-endpoints
      services:
        - endpoint: internal
          service: oslo_db
        - endpoint: internal
          service: oslo_messaging
        - endpoint: internal
          service: identity
    conductor:
      jobs:
        - senlin-db-sync
        - senlin-rabbit-init
        - senlin-ks-user
        - senlin-ks-endpoints
      services:
        - endpoint: internal
          service: oslo_db
        - endpoint: internal
          service: oslo_messaging
        - endpoint: internal
          service: identity
    engine:
      jobs:
        - senlin-db-sync
        - senlin-rabbit-init
        - senlin-ks-user
        - senlin-ks-endpoints
      services:
        - endpoint: internal
          service: oslo_db
        - endpoint: internal
          service: oslo_messaging
        - endpoint: internal
          service: identity
    health_manager:
      jobs:
        - senlin-db-sync
        - senlin-rabbit-init
        - senlin-ks-user
        - senlin-ks-endpoints
      services:
        - endpoint: internal
          service: oslo_db
        - endpoint: internal
          service: oslo_messaging
        - endpoint: internal
          service: identity
    bootstrap:
      services:
        - endpoint: internal
          service: identity
    db_drop:
      services:
        - endpoint: internal
          service: oslo_db
    db_init:
      services:
        - endpoint: internal
          service: oslo_db
    db_sync:
      jobs:
        - senlin-db-init
      services:
        - endpoint: internal
          service: oslo_db
    engine_cleaner:
      jobs:
        - senlin-db-sync
      services:
        - endpoint: internal
          service: oslo_db
    ks_endpoints:
      jobs:
        - senlin-ks-service
      services:
        - endpoint: internal
          service: identity
    ks_service:
      services:
        - endpoint: internal
          service: identity
    ks_user:
      services:
        - endpoint: internal
          service: identity
    rabbit_init:
      services:
        - endpoint: internal
          service: oslo_messaging
    image_repo_sync:
      services:
        - endpoint: internal
          service: local_image_registry
    tests:
      services:
        - endpoint: internal
          service: identity
        - endpoint: internal
          service: clustering

# Names of secrets used by bootstrap and environmental checks
secrets:
  identity:
    admin: senlin-keystone-admin
    senlin: senlin-keystone-user
    test: senlin-keystone-test
  oslo_db:
    admin: senlin-db-admin
  oslo_messaging:
    admin: senlin-rabbitmq-admin
    senlin: senlin-rabbitmq-user
  tls:
    # Client certificate this chart presents for all mTLS backend connections
    # (MariaDB and RabbitMQ). Separate from the MariaDB and RabbitMQ server certs.
    client:
      senlin: senlin-client
    # CA bundle this chart trusts for OUTBOUND TLS calls (keystone and the
    # services of the clusters). Null by default -> no CA is mounted and
    # REQUESTS_CA_BUNDLE is left unset. A deployment override points this at a
    # cert-manager CA-only secret carrying just ca.crt (no private key); it is
    # mounted at /etc/ssl/certs/openstack-helm.crt. Assumes every server cert is
    # signed by this single CA. The chart stays TLS-agnostic -- server certs and
    # the nginx TLS sidecar live in the override.
    ca: null
  oci_image_registry:
    senlin: senlin-oci-image-registry

# typically overridden by environmental
identity:
  openrc:
    exclude_vars: []
    extra_vars: []

# values, but should include all endpoints
# required by this chart
endpoints:
  cluster_domain_suffix: cluster.local
  local_image_registry:
    name: docker-registry
    namespace: docker-registry
    hosts:
      default: localhost
      internal: docker-registry
      node: localhost
    host_fqdn_override:
      default: null
    port:
      registry:
        node: 5000
  oci_image_registry:
    name: oci-image-registry
    namespace: oci-image-registry
    auth:
      enabled: false
      senlin:
        username: senlin
        password: password
    hosts:
      default: localhost
    host_fqdn_override:
      default: null
    port:
      registry:
        default: null
  identity:
    name: keystone
    auth:
      admin:
        region_name: RegionOne
        username: admin
        password: password
        project_name: admin
        user_domain_name: default
        project_domain_name: default
      senlin:
        role: admin
        region_name: RegionOne
        username: senlin
        password: password
        project_name: service
        user_domain_name: service
        project_domain_name: service
      test:
        role: admin
        region_name: RegionOne
        username: senlin-test
        password: password
        project_name: test
        user_domain_name: service
        project_domain_name: service
    hosts:
      default: keystone
      internal: keystone-api
    host_fqdn_override:
      default: null
    path:
      default: /v3
    scheme:
      default: http
    port:
      api:
        default: 80
        internal: 5000
  clustering:
    name: senlin
    hosts:
      default: senlin-api
      public: senlin
    host_fqdn_override:
      default: null
      # NOTE(portdirect): this chart supports TLS for fqdn over-ridden public
      # endpoints using the following format:
      # public:
      #   host: null
      #   tls:
      #     crt: null
      #     key: null
    path:
      default: null
      healthcheck: /healthcheck
    scheme:
      default: 'http'
      service: 'http'
    port:
      api:
        default: 8778
        public: 80
        service: 8778
  oslo_db:
    admin: senlin-db-admin
    senlin: senlin-db-user
  oslo_messaging:
    admin: senlin-rabbitmq-admin
    senlin: senlin-rabbitmq-user
  oci_image_registry:
    senlin: senlin-oci-image-registry

# typically overridden by environmental
# values, but should include all endpoints
# required by this chart
endpoints:
  cluster_domain_suffix: cluster.local
  local_image_registry:
    name: docker-registry
    namespace: docker-registry
    hosts:
      default: localhost
      internal: docker-registry
      node: localhost
    host_fqdn_override:
      default: null
    port:
      registry:
        node: 5000
  oci_image_registry:
    name: oci-image-registry
    namespace: oci-image-registry
    auth:
      enabled: false
      senlin:
        username: senlin
        password: password
    hosts:
      default: localhost
    host_fqdn_override:
      default: null
    port:
      registry:
        default: null
  identity:
    name: keystone
    auth:
      admin:
        region_name: RegionOne
        username: admin
        password: password
        project_name: admin
        user_domain_name: default
        project_domain_name: default
      senlin:
        role: admin
        region_name: RegionOne
        username: senlin
        password: password
        project_name: service
        user_domain_name: service
        project_domain_name: service
      test:
        role: admin
        region_name: RegionOne
        username: senlin-test
        password: password
        project_name: test
        user_domain_name: service
        project_domain_name: service
    hosts:
      default: keystone
      internal: keystone-api
    host_fqdn_override:
      default: null
    path:
      default: /v3
    scheme:
      default: http
    port:
      api:
        default: 80
        internal: 5000
  clustering:
    name: senlin
    hosts:
      default: senlin-api
      public: senlin
    host_fqdn_override:
      default: null
    path:
      default: null
    scheme:
      default: http
    port:
      api:
        default: 8778
        public: 80
  oslo_db:
    auth:
      admin:
        username: root
        password: password
      senlin:
        username: senlin
        password: password
    hosts:
      default: mariadb
    host_fqdn_override:
      default: null
    path: /senlin
    scheme: mysql+pymysql
    port:
      mysql:
        default: 3306
  oslo_cache:
    auth:
      # NOTE(portdirect): this is used to define the value for keystone
      # authtoken cache encryption key, if not set it will be populated
      # automatically with a random value, but to take advantage of
      # this feature all services should be set to use the same key,
      # and memcache service.
      memcache_secret_key: null
    hosts:
      default: memcached
    host_fqdn_override:
      default: null
    port:
      memcache:
        default: 11211
  oslo_messaging:
    auth:
      admin:
        username: rabbitmq
        password: password
      senlin:
        username: senlin
        password: password
    statefulset:
      replicas: 2
      name: rabbitmq-rabbitmq
    hosts:
      default: rabbitmq
    host_fqdn_override:
      default: null
    path: /senlin
    scheme: rabbit
    port:
      amqp:
        default: 5672
      http:
        default: 15672
  fluentd:
    namespace: null
    name: fluentd
    hosts:
      default: fluentd-logging
    host_fqdn_override:
      default: null
    path:
      default: null
    scheme: 'http'
    port:
      service:
        default: 24224
      metrics:
        default: 24220
  # NOTE(tp6510): these endpoints allow for things like DNS lookups and ingress
  # They are using to enable the Egress K8s network policy.
  kube_dns:
    namespace: kube-system
    name: kubernetes-dns
    hosts:
      default: kube-dns
    host_fqdn_override:
      default: null
    path:
      default: null
    scheme: http
    port:
      dns:
        default: 53
        protocol: UDP

pod:
  # Extra sidecar containers and volumes to inject into the senlin-api
  # Deployment, e.g. nginx TLS-terminating sidecars.
  extraContainers:
    senlin_api: []
  extraVolumes:
    senlin_api: []
  security_context:
    senlin:
      pod:
        runAsUser: 42424
      container:
        senlin_api:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
        senlin_conductor:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
        senlin_engine:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
        senlin_health_manager:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
    engine_cleaner:
      pod:
        runAsUser: 42424
      container:
        senlin_engine_cleaner:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
  affinity:
    anti:
      type:
        default: preferredDuringSchedulingIgnoredDuringExecution
      topologyKey:
        default: kubernetes.io/hostname
      weight:
        default: 10
  tolerations:
    senlin:
      enabled: false
      tolerations:
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
  mounts:
    senlin_api:
      init_container: null
      senlin_api:
        volumeMounts:
        volumes:
    senlin_conductor:
      init_container: null
      senlin_conductor:
        volumeMounts:
        volumes:
    senlin_engine:
      init_container: null
      senlin_engine:
        volumeMounts:
        volumes:
    senlin_health_manager:
      init_container: null
      senlin_health_manager:
        volumeMounts:
        volumes:
    senlin_bootstrap:
      init_container: null
      senlin_bootstrap:
        volumeMounts:
        volumes:
    senlin_engine_cleaner:
      init_container: null
      senlin_engine_cleaner:
        volumeMounts:
        volumes:
    senlin_tests:
      init_container: null
      senlin_tests:
        volumeMounts:
        volumes:
    senlin_db_sync:
      senlin_db_sync:
        volumeMounts:
        volumes:
  # -- This allows users to add Kubernetes Projected Volumes to be mounted at /etc/senlin/senlin.conf.d/
  ## This is a list of projected volume source objects for each deployment/statefulset/daemonset/cronjob
  ## https://kubernetes.io/docs/concepts/storage/projected-volumes/
  etcSources:
    senlin_api: []
    senlin_conductor: []
    senlin_engine: []
    senlin_health_manager: []
    senlin_engine_cleaner: []
    senlin_db_sync: []
  replicas:
    api: 1
    conductor: 1
    engine: 1
    health_manager: 1
  lifecycle:
    upgrades:
      deployments:
        revision_history: 3
        pod_replacement_strategy: RollingUpdate
        rolling_update:
          max_unavailable: 1
          max_surge: 3
    disruption_budget:
      api:
        min_available: 0
    termination_grace_period:
      api:
        timeout: 30
      conductor:
        timeout: 30
      # -- A stopping engine fails the actions it still runs and releases
      ## their locks before it exits.
      engine:
        timeout: 30
      health_manager:
        timeout: 30
  resources:
    enabled: false
    api:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "1024Mi"
        cpu: "2000m"
    conductor:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "1024Mi"
        cpu: "2000m"
    engine:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "1024Mi"
        cpu: "2000m"
    health_manager:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "1024Mi"
        cpu: "2000m"
    jobs:
      bootstrap:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "1024Mi"
          cpu: "2000m"
      db_init:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "1024Mi"
          cpu: "2000m"
      db_sync:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "1024Mi"
          cpu: "2000m"
      db_drop:
        requests:
          memory: "128Mi"
