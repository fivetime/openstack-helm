---
endpoints:
  data_protect:
    host_fqdn_override:
      public:
        host: karbor.openstack-helm.org
    scheme:
      public: https
    port:
      api:
        public: 443
extraObjects:
  karbor_api_route:
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: karbor-api-route
      namespace: '{{ .Release.Namespace }}'
    spec:
      hostnames:
      - '{{ .Values.endpoints.data_protect.host_fqdn_override.public.host }}'
      parentRefs:
      - name: gateway-default
        namespace: envoy-gateway-system
      rules:
      - matches:
        - path:
            type: PathPrefix
            value: /
        backendRefs:
        - name: karbor-api
          port: 8799
...
