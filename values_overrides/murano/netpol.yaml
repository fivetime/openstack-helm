---
manifests:
  network_policy: true
network_policy:
  murano:
    ingress:
      - from:
        - podSelector:
            matchLabels:
              application: murano
        - podSelector:
            matchLabels:
              application: ingress
        - podSelector:
            matchLabels:
              application: horizon
        ports:
        - protocol: TCP
          port: 8082
    egress:
      - to:
        - podSelector:
            matchLabels:
              application: neutron
      - to:
        - podSelector:
            matchLabels:
              application: nova
      - to:
        - podSelector:
            matchLabels:
              application: glance
      - to:
        - podSelector:
            matchLabels:
              application: heat
      - to:
        - podSelector:
            matchLabels:
              application: mistral
      # the broker of the murano-agents (a second rabbitmq release)
      - to:
        - podSelector:
            matchLabels:
              application: rabbitmq
      - to:
        - ipBlock:
            cidr: %%%REPLACE_API_ADDR%%%/32
        ports:
          - protocol: TCP
            port: %%%REPLACE_API_PORT%%%
...
