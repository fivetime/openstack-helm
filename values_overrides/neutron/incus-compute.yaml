---
# The OVN agent DaemonSet also provides the local metadata proxy. Schedule it
# on every OVS/OVN chassis, including dedicated Nova Incus compute nodes,
# without applying the openstack-compute-node label that would also schedule
# the libvirt nova-compute DaemonSet.
labels:
  agent:
    metadata:
      node_selector_key: openvswitch
      node_selector_value: enabled

pod:
  tolerations:
    neutron:
      enabled: true
      tolerations:
        - operator: Exists

# Incus compute nodes in this topology provide br-int/Geneve only. They do
# not carry the external provider bridge, so a distributed floating IP would
# be placed on a chassis with no provider-network egress. Keep FIPs
# centralized on the OVN gateway chassis.
conf:
  plugins:
    ml2_conf:
      ovn:
        enable_distributed_floating_ip: false
