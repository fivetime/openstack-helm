---
# Combine this override with one Nova Incus storage override and enable the
# listener separately with values_overrides/incus/migration.yaml. The Secret
# is created by the deployment PKI workflow and is mounted only by the Nova
# Incus compute DaemonSet. Every Incus HTTPS server certificate must be signed
# by ca.crt and cover the listener address selected by the Incus chart.
incus_migration:
  enabled: true
  allow_live: true
  allow_cold: true
  secret_name: nova-incus-migration

# Required Secret keys:
#   migration.crt  restricted client identity for the Nova Incus project
#   migration.key
#   ca.crt         CA that issued every Incus HTTPS server certificate
# When boot_from_volume_pools is non-empty, also include:
#   preflight.crt  separate identity for the zero-instance preflight project
#   preflight.key
