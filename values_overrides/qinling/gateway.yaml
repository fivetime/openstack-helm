---
endpoints:
  function_engine:
    host_fqdn_override:
      public:
        host: qinling.openstack-helm.org
extraObjects:
  qinling_api_route:
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: qinling-api-route
      namespace: '{{ .Release.Namespace }}'
    spec:
      hostnames:
      - '{{ .Values.endpoints.function_engine.host_fqdn_override.public.host }}'
      parentRefs:
      - name: gateway-default
        namespace: envoy-gateway-system
      rules:
      - matches:
        - path:
            type: PathPrefix
            value: /
        backendRefs:
        - name: qinling-api
          port: 7070
...
