{{/*
zun-cni-daemon plugs capsule sandboxes into Neutron for the CRI capsule driver.
It is independent of network.driver, which selects how the *docker* driver's
containers are networked (kuryr): a node serves both at once, so enabling
capsule networking must not switch the docker path away from kuryr.
*/}}
{{- if and .Values.manifests.daemonset_cni_daemon .Values.network.drivers.cni.deploy_daemon }}
{{- $envAll := . }}

{{- $mounts_zun_cni_daemon := .Values.pod.mounts.zun_cni_daemon.zun_cni_daemon }}
{{- $mounts_zun_cni_daemon_init := .Values.pod.mounts.zun_cni_daemon.init_container }}

{{- $serviceAccountName := "zun-cni-daemon" }}
{{ tuple $envAll "cni_daemon" $serviceAccountName | include "helm-toolkit.snippets.kubernetes_pod_rbac_serviceaccount" }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: zun-cni-daemon
  annotations:
    {{ tuple $envAll | include "helm-toolkit.snippets.release_uuid" }}
  labels:
{{ tuple $envAll "zun" "cni-daemon" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
spec:
  selector:
    matchLabels:
{{ tuple $envAll "zun" "cni-daemon" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 6 }}
{{ tuple $envAll "cni_daemon" | include "helm-toolkit.snippets.kubernetes_upgrades_daemonset" | indent 2 }}
  template:
    metadata:
      labels:
{{ tuple $envAll "zun" "cni-daemon" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 8 }}
      annotations:
{{ tuple $envAll | include "helm-toolkit.snippets.release_uuid" | indent 8 }}
        configmap-bin-hash: {{ tuple "configmap-bin.yaml" . | include "helm-toolkit.utils.hash" }}
        configmap-etc-hash: {{ tuple "configmap-etc.yaml" . | include "helm-toolkit.utils.hash" }}
{{- if .Values.network.drivers.cni.containerd.manage_drop_ins }}
        configmap-cni-hash: {{ tuple "configmap-cni.yaml" . | include "helm-toolkit.utils.hash" }}
{{- end }}
{{ tuple "zun_cni_daemon" . | include "helm-toolkit.snippets.custom_pod_annotations" | indent 8 }}
    spec:
{{ tuple "zun_cni_daemon" . | include "helm-toolkit.snippets.kubernetes_pod_priority_class" | indent 6 }}
{{ tuple "zun_cni_daemon" . | include "helm-toolkit.snippets.kubernetes_pod_runtime_class" | indent 6 }}
      serviceAccountName: {{ $serviceAccountName }}
      nodeSelector:
        {{ .Values.labels.cni_daemon.node_selector_key }}: {{ .Values.labels.cni_daemon.node_selector_value }}
{{ if $envAll.Values.pod.tolerations.zun.enabled }}
{{ tuple $envAll "zun" | include "helm-toolkit.snippets.kubernetes_tolerations" | indent 6 }}
{{ end }}
      hostNetwork: true
{{- if .Values.network.drivers.cni.containerd.manage_drop_ins }}
      # systemd refuses a bus client from another PID namespace: the
      # authentication ends in ENODATA ("No data available").
      hostPID: true
{{- end }}
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: {{ .Values.pod.lifecycle.termination_grace_period.cni_daemon.timeout | default "60" }}
      initContainers:
{{ tuple $envAll "cni_daemon" $mounts_zun_cni_daemon_init | include "helm-toolkit.snippets.kubernetes_entrypoint_init_container" | indent 8 }}
        # The plugin binary the runtime executes on the host: the static
        # zun-cni shim built into the image (tools/zun-cni-shim in the fork).
        # Not the image's `zun-cni` console script, whose interpreter exists
        # only in the image. Nothing else is written to the host's CNI bin
        # dir, which the kubelet's CNI plugins share.
        - name: zun-cni-install
{{ tuple $envAll "zun_cni_daemon" | include "helm-toolkit.snippets.image" | indent 10 }}
          securityContext:
            runAsUser: 0
          command:
            - /bin/sh
            - -c
            - |
              set -e
              src=/usr/local/libexec/zun/zun-cni
              dst={{ .Values.network.drivers.cni.paths.bin_dir }}/zun-cni
              CNI_COMMAND=VERSION "$src" </dev/null
              install -m 0755 "$src" "$dst.new"
              mv -f "$dst.new" "$dst"
              echo "installed $dst from $(cat /etc/image_info/zun-cni.txt 2>/dev/null)"
          volumeMounts:
            - name: cni-bin
              mountPath: {{ .Values.network.drivers.cni.paths.bin_dir }}
        - name: cni-config-setup
{{ tuple $envAll "zun_cni_daemon" | include "helm-toolkit.snippets.image" | indent 10 }}
          securityContext:
            runAsUser: 0
          command:
            - /bin/sh
            - -c
            - |
              set -e
              dir={{ .Values.network.drivers.cni.paths.conf_dir }}
              install -m 0644 /tmp/10-zun-cni.conf "$dir/.10-zun-cni.conf.new"
              mv -f "$dir/.10-zun-cni.conf.new" "$dir/10-zun-cni.conf"
              echo "installed $dir/10-zun-cni.conf:"; cat "$dir/10-zun-cni.conf"
          volumeMounts:
            - name: cni-conf-template
              mountPath: /tmp/10-zun-cni.conf
              subPath: 10-zun-cni.conf
              readOnly: true
            - name: cni-conf
              mountPath: {{ .Values.network.drivers.cni.paths.conf_dir }}
{{- if .Values.network.drivers.cni.containerd.manage_drop_ins }}
        # The host containerd's drop-ins for the capsule driver. A file is
        # compared as parsed TOML, so one written by hand with the same
        # settings is left alone, and containerd, which does not reload its
        # configuration, is restarted only when a file was written. Running
        # containers survive that: their shims are processes of their own.
        # A restart owed is recorded before the first file is written and
        # cleared after containerd is back, so a run that wrote files and then
        # failed to restart is finished by the next one, which finds the files
        # unchanged. systemctl reaches the host's systemd through /run/systemd
        # from the host's PID namespace; without SYSTEMD_IGNORE_CHROOT it sees
        # a root other than PID 1's, prints "Running in chroot, ignoring
        # command" and exits 0.
        - name: containerd-drop-ins
{{ tuple $envAll "zun_cni_daemon" | include "helm-toolkit.snippets.image" | indent 10 }}
          securityContext:
            runAsUser: 0
            privileged: true
          env:
            - name: CONF_D
              value: {{ .Values.network.drivers.cni.containerd.conf_d | quote }}
            - name: UNIT
              value: {{ .Values.network.drivers.cni.containerd.unit | quote }}
            - name: SYSTEMD_IGNORE_CHROOT
              value: "1"
          command:
            - python3
            - -c
            - |
              import os, subprocess, sys, time, tomllib

              src_dir, dst_dir, unit = '/tmp/containerd', os.environ['CONF_D'], os.environ['UNIT']

              def load(path):
                  with open(path, 'rb') as f:
                      return tomllib.load(f)

              # Every file is parsed before any is written: a bad one stops
              # the pod instead of leaving containerd half configured.
              wanted = {}
              for name in sorted(os.listdir(src_dir)):
                  path = os.path.join(src_dir, name)
                  # The volume also holds the configMap's ..data links.
                  if not name.startswith('.') and os.path.isfile(path):
                      wanted[name] = (path, load(path))

              # Not *.toml: containerd imports only those.
              owed = os.path.join(dst_dir, '.zun-cni-restart-owed')
              written = []
              for name, (path, settings) in wanted.items():
                  dst = os.path.join(dst_dir, name)
                  try:
                      current = load(dst)
                  except FileNotFoundError:
                      current = None
                  except tomllib.TOMLDecodeError as e:
                      print(f'{dst}: not TOML ({e}); replacing it')
                      current = None
                  if current == settings:
                      print(f'{dst}: unchanged')
                      continue
                  open(owed, 'w').close()
                  tmp = os.path.join(dst_dir, f'.{name}.new')
                  with open(path, 'rb') as f, open(tmp, 'wb') as g:
                      g.write(f.read())
                  os.chmod(tmp, 0o644)
                  os.replace(tmp, dst)
                  written.append(name)
                  print(f'{dst}: written')

              if not os.path.exists(owed):
                  sys.exit(0)
              if not written:
                  print(f'{unit}: a restart is still owed for files written before')
              subprocess.run(['systemctl', 'restart', unit], check=True)
              for _ in range(60):
                  state = subprocess.run(
                      ['systemctl', 'show', '--property=ActiveState', '--value', unit],
                      check=True, capture_output=True, text=True).stdout.strip()
                  if state == 'active':
                      os.unlink(owed)
                      print(f'{unit} restarted for {", ".join(written) or "earlier files"}')
                      sys.exit(0)
                  time.sleep(1)
              sys.exit(f'{unit} is {state!r} a minute after its restart')
          volumeMounts:
            - name: containerd-drop-ins
              mountPath: /tmp/containerd
              readOnly: true
            - name: containerd-conf-d
              mountPath: {{ .Values.network.drivers.cni.containerd.conf_d }}
            - name: host-run-systemd
              mountPath: /run/systemd
{{- end }}
      containers:
        - name: zun-cni-daemon
{{ tuple $envAll "zun_cni_daemon" | include "helm-toolkit.snippets.image" | indent 10 }}
{{ tuple $envAll $envAll.Values.pod.resources.cni_daemon | include "helm-toolkit.snippets.kubernetes_resources" | indent 10 }}
          securityContext:
            runAsUser: 0
            privileged: true
            readOnlyRootFilesystem: false
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
{{- if .Values.pod.env.zun_cni_daemon }}
{{ include "helm-toolkit.utils.to_k8s_env_vars" .Values.pod.env.zun_cni_daemon | indent 12 }}
{{- end }}
          command:
            - /tmp/zun-cni-daemon.sh
          volumeMounts:
            # ═══════════════════════════════════════════════════════════
            # 基本配置和脚本挂载
            # ═══════════════════════════════════════════════════════════
            - name: pod-tmp
              mountPath: /tmp
            - name: zun-bin
              mountPath: /tmp/zun-cni-daemon.sh
              subPath: zun-cni-daemon.sh
              readOnly: true
            - name: zun-etc
              mountPath: /etc/zun/zun.conf
              subPath: zun.conf
              readOnly: true
            {{- if .Values.conf.zun.DEFAULT.log_config_append }}
            - name: zun-etc
              mountPath: {{ .Values.conf.zun.DEFAULT.log_config_append }}
              subPath: {{ base .Values.conf.zun.DEFAULT.log_config_append }}
              readOnly: true
            {{- end }}
            - name: zun-etc
              mountPath: /etc/zun/policy.yaml
              subPath: policy.yaml
              readOnly: true

            # ═══════════════════════════════════════════════════════════
            # 必要的数据和日志目录
            # ═══════════════════════════════════════════════════════════
            - name: host-var-lib-zun
              mountPath: /var/lib/zun
            - name: host-var-log
              mountPath: /var/log

            # ═══════════════════════════════════════════════════════════
            # CNI 相关目录（核心功能）
            # ═══════════════════════════════════════════════════════════
            - name: cni-conf
              mountPath: {{ .Values.network.drivers.cni.paths.conf_dir }}
              readOnly: true
            - name: cni-bin
              mountPath: {{ .Values.network.drivers.cni.paths.bin_dir }}
              readOnly: true
            # The sandbox's network namespace: the runtime passes its path
            # (/var/run/netns/cni-...) in CNI_NETNS and creates it after this
            # pod started, so the mount must follow the host's mounts.
            - name: host-run-netns
              mountPath: /run/netns
              mountPropagation: HostToContainer
            # os-vif plugs the port into br-int through ovsdb.
            - name: host-run-openvswitch
              mountPath: /run/openvswitch

            # ═══════════════════════════════════════════════════════════
            # 用户自定义挂载点
            # ═══════════════════════════════════════════════════════════
{{ if $mounts_zun_cni_daemon.volumeMounts }}{{ toYaml $mounts_zun_cni_daemon.volumeMounts | indent 12 }}{{ end }}
      volumes:
        # ═══════════════════════════════════════════════════════════
        # 基本配置卷
        # ═══════════════════════════════════════════════════════════
        - name: pod-tmp
          emptyDir: {}
        - name: zun-bin
          configMap:
            name: zun-bin
            defaultMode: 0555
        - name: zun-etc
          secret:
            secretName: zun-etc
            defaultMode: 0444

        # ═══════════════════════════════════════════════════════════
        # 必要的宿主机目录
        # ═══════════════════════════════════════════════════════════
        - name: host-var-lib-zun
          hostPath:
            path: /var/lib/zun
            type: DirectoryOrCreate
        - name: host-var-log
          hostPath:
            path: /var/log
            type: Directory

        # ═══════════════════════════════════════════════════════════
        # CNI 配置和插件
        # ═══════════════════════════════════════════════════════════
        - name: cni-conf-template
          configMap:
            name: zun-cni-config
            defaultMode: 0644
        - name: cni-conf
          hostPath:
            path: {{ .Values.network.drivers.cni.paths.conf_dir }}
            type: DirectoryOrCreate
        - name: cni-bin
          hostPath:
            path: {{ .Values.network.drivers.cni.paths.bin_dir }}
            type: DirectoryOrCreate
        - name: host-run-netns
          hostPath:
            path: /run/netns
            type: DirectoryOrCreate
        - name: host-run-openvswitch
          hostPath:
            path: /run/openvswitch
            type: DirectoryOrCreate
{{- if .Values.network.drivers.cni.containerd.manage_drop_ins }}
        - name: containerd-drop-ins
          configMap:
            name: zun-cni-containerd
            defaultMode: 0644
        - name: containerd-conf-d
          hostPath:
            path: {{ .Values.network.drivers.cni.containerd.conf_d }}
            type: DirectoryOrCreate
        - name: host-run-systemd
          hostPath:
            path: /run/systemd
            type: Directory
{{- end }}

        # ═══════════════════════════════════════════════════════════
        # 用户自定义卷
        # ═══════════════════════════════════════════════════════════
{{ if $mounts_zun_cni_daemon.volumes }}{{ toYaml $mounts_zun_cni_daemon.volumes | indent 8 }}{{ end }}
{{- end }}