{{/*
The name in `[websocket_proxy] base_url` has to resolve wherever the URL
it builds is dialled -- and that is now in-cluster as well as outside.
zun hands the same URL to every client, so a name that only exists as an
external route leaves anything inside the cluster with an address it
cannot look up, and the failure arrives as a DNS error in a consumer far
from this setting.

Serving the public hostname on port 80 here makes the one configured
value true for both audiences: an ingress route keeps working for clients
outside, and clients inside resolve the same name to these pods.
*/}}

{{- if .Values.manifests.service_console }}
{{- $envAll := . }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ tuple "websocket_proxy" "public" . | include "helm-toolkit.endpoints.hostname_short_endpoint_lookup" }}
  labels:
{{ tuple $envAll "zun" "wsproxy" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http-zun-console
      port: 80
      targetPort: {{ tuple "websocket_proxy" "internal" "wsproxy" . | include "helm-toolkit.endpoints.endpoint_port_lookup" }}
      protocol: TCP
  selector:
{{ tuple $envAll "zun" "wsproxy" | include "helm-toolkit.snippets.kubernetes_metadata_labels" | indent 4 }}
{{- end }}
