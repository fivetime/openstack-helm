# ════════════════════════════════════════════════════════════════════
# Zun (OpenStack Container Service) Helm Chart Configuration
# ════════════════════════════════════════════════════════════════════
#
# 这是 OpenStack Zun 服务的 Helm Chart 配置文件
# Zun 是 OpenStack 的容器服务，提供容器生命周期管理
#
# 配置文件结构：
# 1. 镜像配置 (images)
# 2. 节点选择器 (labels)
# 3. 运行时配置 (container_runtime, network, image_driver, volume_driver)
# 4. Pod 配置 (pod)
# 5. 服务配置 (conf)
# 6. 安全配置 (secrets)
# 7. 依赖关系 (dependencies)
# 8. 服务端点 (endpoints)
# 9. 清单控制 (manifests)
# ════════════════════════════════════════════════════════════════════

---
# ════════════════════════════════════════════════════════════════════
# 1. 镜像配置 (Images Configuration)
# ════════════════════════════════════════════════════════════════════
images:
  tags:
    # OpenStack 基础服务镜像（用于初始化任务）
    bootstrap: quay.io/airshipit/openstack-client:2026.1-ubuntu_noble
    db_init: quay.io/airshipit/openstack-client:2026.1-ubuntu_noble
    db_drop: quay.io/airshipit/openstack-client:2026.1-ubuntu_noble
    ks_user: quay.io/airshipit/openstack-client:2026.1-ubuntu_noble
    ks_service: quay.io/airshipit/openstack-client:2026.1-ubuntu_noble
    ks_endpoints: quay.io/airshipit/openstack-client:2026.1-ubuntu_noble
    scripted_test: quay.io/airshipit/openstack-client:2026.1-ubuntu_noble

    # Zun 服务镜像:fivetime loci 版(confluent-kafka/psycopg2/pciutils 内置;
    # 上游 openstack-helm-images 无 zun,构建见 build-local.d/zun.yaml)
    zun_api: ghcr.io/fivetime/openstackhelm/zun:2026.2-ubuntu_resolute
    zun_db_sync: ghcr.io/fivetime/openstackhelm/zun:2026.2-ubuntu_resolute
    zun_cni_daemon: ghcr.io/fivetime/openstackhelm/zun:2026.2-ubuntu_resolute
    zun_compute: ghcr.io/fivetime/openstackhelm/zun:2026.2-ubuntu_resolute
    zun_wsproxy: ghcr.io/fivetime/openstackhelm/zun:2026.2-ubuntu_resolute
    zun_wsproxy_edge: docker.io/envoyproxy/envoy@sha256:7765ad61185fca9c9a770c9e2cad640d085d708ae9c22f3741345e88331472a4

    # 依赖服务镜像
    rabbit_init: docker.io/rabbitmq:4.3.5-management                        # RabbitMQ 初始化
    dep_check: quay.io/airshipit/kubernetes-entrypoint:latest-ubuntu_jammy # 依赖检查
    image_repo_sync: docker.io/docker:28.1.1                              # 镜像仓库同步

  # 镜像拉取策略
  pull_policy: "IfNotPresent"

  # 本地镜像仓库配置
  local_registry:
    active: false
    exclude:
      - dep_check
      - image_repo_sync

# ════════════════════════════════════════════════════════════════════
# 2. 节点选择器配置 (Node Selector Labels)
# ════════════════════════════════════════════════════════════════════
labels:
  # API 服务部署在控制平面节点
  api:
    node_selector_key: openstack-control-plane
    node_selector_value: enabled

  # 计算服务部署在计算节点
  compute:
    node_selector_key: openstack-compute-node
    node_selector_value: enabled

  # CNI 守护进程与 zun-compute 同节点(capsule 沙箱就建在那里)
  cni_daemon:
    node_selector_key: openstack-compute-node
    node_selector_value: enabled

  # WebSocket 代理部署在控制平面节点
  wsproxy:
    node_selector_key: openstack-control-plane
    node_selector_value: enabled

  # 任务类 Pod 部署在控制平面节点
  job:
    node_selector_key: openstack-control-plane
    node_selector_value: enabled

  # 测试 Pod 部署在控制平面节点
  test:
    node_selector_key: openstack-control-plane
    node_selector_value: enabled

# ════════════════════════════════════════════════════════════════════
# 3. 运行时配置 (Runtime Configuration)
# ════════════════════════════════════════════════════════════════════

# ────────────────────────────────────────────────────────────────────
# 3.1 容器运行时配置
# ────────────────────────────────────────────────────────────────────
container_runtime:
  # 支持的运行时类型: docker, cri
  type: docker

  # Docker 运行时配置
  docker:
    socket_group: docker                       # Docker socket 用户组
    socket_path: /var/run/docker.sock          # Docker socket 路径
    library_dir: /var/lib/docker               # Docker 类库目录

    # Docker API 配置
    default_timeout: 45                        # 运行时调用的上限;必须低于 rpc_response_timeout(默认 60),否则两者同时到期、RPC 必输,任何慢调用都变成"节点不再应答"
    execute_timeout: 30                        # 一次 exec 的上限;与 CriDriver 的 cri_exec_timeout 对齐,且须低于 rpc_response_timeout(默认 60)

    # Registry 配置
    default_registry: ""                       # 默认镜像仓库
    default_registry_username: ""              # 仓库用户名
    default_registry_password: ""              # 仓库密码

  # CRI 运行时配置（用于 Kata Containers 等）
  cri:
    socket_path: /run/containerd/containerd.sock  # CRI socket 路径

    # Kata Containers 配置
    kata:
      enabled: false                           # 是否启用 Kata
      runtime_path: /usr/bin/kata-runtime      # Kata 运行时路径
      runtime_type: "io.containerd.kata.v2"   # Kata 运行时类型

# ────────────────────────────────────────────────────────────────────
# 3.2 网络配置（最重要的配置部分）
# ────────────────────────────────────────────────────────────────────
network:
  # 网络驱动选择: cni, kuryr, docker
  driver: kuryr

  drivers:
    # CNI (Container Network Interface) 配置
    cni:
      # capsule(CRI 驱动)的网络:部署 zun-cni-daemon,并把 zun-cni shim 与
      # CNI 配置装到宿主机。与上面的 network.driver 无关——driver 管的是 docker
      # 驱动的容器(kuryr),同一节点两条路径并存,开 capsule 网络不改 docker 路径。
      deploy_daemon: false

      # CNI 路径配置
      paths:
        # ⚠️ 不能是 /etc/cni/net.d:那是 kubelet(CRI-O)的 CNI 目录,且 containerd
        # 按文件名只取第一份配置(max_conf_num=1),00-multus 等排在前面,capsule 仍会
        # 落到 K8s 的 CNI。宿主机前提:Zun 专用 containerd 的
        # [plugins.'io.containerd.cri.v1.runtime'.cni] conf_dir 指向这里。
        conf_dir: /etc/cni/zun-net.d
        bin_dir: /opt/cni/bin                  # 只写入 zun-cni 一个文件

      # 宿主机 containerd 的 drop-in:capsule 走的是宿主机 containerd 的 CRI,它的
      # CNI 目录(上面的 conf_dir)和 capsule 用到的 runtime handler 都要在那里配置。
      # 开启后由 zun-cni-daemon 的 init 容器写入 conf_d:总会写 20-zun-cni.toml
      # (cni conf_dir 指向 paths.conf_dir),再加上 drop_ins 里列出的文件
      # (文件名: 内容)。按解析后的 TOML 比较,内容没变就不写;有文件写入时
      # 重启一次 unit(运行中的容器不受影响,shim 是独立进程),新节点只要打标签。
      containerd:
        manage_drop_ins: false
        conf_d: /etc/containerd/conf.d
        unit: containerd.service
        drop_ins: {}

      # CNI 配置文件内容(zun_cni_daemon = shim 转发的 daemon 地址)
      config_file:
        cniVersion: "0.3.1"
        name: "zun"
        type: "zun-cni"
        zun_cni_daemon: "http://127.0.0.1:9036"

      # CNI daemon 配置
      daemon:
        port: 9036                             # 监听端口
        host: 127.0.0.1                       # 监听地址
        worker_num: 30                         # 工作进程数
        vif_active_timeout: 60                 # VIF 激活超时
        pyroute2_timeout: 10                   # Pyroute2 超时
        docker_mode: false                     # Docker 模式

    # Kuryr (OpenStack Neutron 集成) 配置
    kuryr:
      driver_name: kuryr                       # Kuryr 插件名称
      etcd_endpoints: "http://etcd:2379"       # etcd 端点

    # Docker 原生网络配置
    docker:
      enabled: false                           # 是否使用 Docker bridge
      bridge_name: docker0                     # Bridge 名称
      options:
        mtu: 1500                             # MTU 大小
        icc: true                             # 容器间连接

  # 计算节点上的 WebSocket 代理(manifests.daemonset_wsproxy)。客户端拿到的
  # 流地址由胶囊所在节点的 zun-compute 用它自己的 [websocket_proxy] base_url
  # 拼出,地址必须落到那台节点的代理上。做法:base_url 带上节点的 host,例如
  #   ws://zun-console.openstack.svc.cluster.local/node/$host/
  # ($host 由 oslo.config 展开成 [DEFAULT] host),再按下面的节点列表为每个
  # 节点建一个指向 <ip>:<wsproxy 端口> 的 Service(无 selector,手写
  # EndpointSlice),并由 route 把 /node/<host>/ 前缀转到该节点、去掉前缀。
  # host 必须与该节点 zun-compute 的 [DEFAULT] host 一字不差(未设时是节点
  # 主机名,可能是 FQDN)。
  wsproxy:
    nodes: []
    # - host: zun-worker1.cloud.local
    #   ip: 10.32.32.167
    route:
      # 渲染一个 Gateway API HTTPRoute;没有匹配前缀的请求不转发(404)。
      enabled: false
      parentRefs: []
      hostnames: []
      # HTTPRoute rules[].timeouts;exec/attach 可能长时间无输出,不要让网关
      # 的请求超时掐断它,例如 {request: "0s", backendRequest: "0s"}。
      timeouts: {}
    # 节点 IP 上的端口交给 Envoy 边车(edge),zun-wsproxy 只听 127.0.0.1:
    # upstream_port。Envoy 终结 TLS、先用公钥验会话令牌(JWT,要求 zun-api
    # 配 [websocket_proxy] token_signing_key、wsproxy 配 token_verify_key)、
    # 限请求头时长和每个来源的升级速率,来源在 trusted 里的(gateway 所在
    # 节点)走大连接池,其余(直连的租户)共用小池,直连洪水碰不到 gateway
    # 那条路。配置由 files/wsproxy-edge-envoy-config.py 在 init 容器里生成,
    # JWKS 由镜像里的 zun.websocket.console_token 从公钥导出。
    edge:
      enabled: false
      upstream_port: 6785
      # gateway 连到节点时的来源地址(CIDR),一般是全部节点地址。
      trusted: []
      # kubernetes.io/tls Secret(tls.crt/tls.key),SAN 要含 backend_tls.hostname。
      tls_secret: zun-wsproxy-edge-tls
      concurrency: 2
      limits:
        max_all: 8192
        max_trusted: 4096
        max_others: 256
        # 每个来源地址每秒的 websocket 升级请求数
        rate_trusted: 200
        rate_others: 10
        # 同时转给 zun-wsproxy 的会话数
        max_sessions: 512
    # gateway 用 TLS 连 Envoy(BackendTLSPolicy,作用于每个节点的 Service)。
    # ⚠ Cilium 1.20 只校验 CA 链、不校验 SAN(hostname 只作 SNI):ca_configmap
    # 里的 CA 必须只给 Envoy 签证书,不能是集群通用 CA。
    backend_tls:
      enabled: false
      ca_configmap: zun-wsproxy-edge-ca
      hostname: zun-wsproxy.openstack.svc

# ────────────────────────────────────────────────────────────────────
# 3.3 镜像驱动配置
# ────────────────────────────────────────────────────────────────────
image_driver:
  driver_list:
    - glance                                   # OpenStack Glance
    - docker                                   # Docker Hub/Registry
  default: docker                             # 默认镜像驱动

  # 沙箱容器配置（用于 Capsule/Pod）
  sandbox:
    image: "kubernetes/pause"                  # 暂停容器镜像
    driver: docker                            # 沙箱驱动
    pull_policy: ifnotpresent                 # 拉取策略

# ────────────────────────────────────────────────────────────────────
# 3.4 卷驱动配置
# ────────────────────────────────────────────────────────────────────
volume_driver:
  driver_list:
    - cinder                                   # OpenStack Cinder
    - local                                    # 本地存储

  # 卷配置
  volume_dir: /var/lib/zun/volumes            # 卷目录

# cinder RBD 附卷支持:zun 对 RBD 强制 do_local_attach(cinder_workflow.py:61),
# os-brick 在 compute 容器里执行 'rbd map',需要 rbd CLI(镜像内 ceph-common)+
# ceph.conf + cinder 用户 keyring + /dev。keyring 由启动脚本从 secret 生成。
ceph:
  enabled: true
  # 必须与 cinder backends.conf 的 rbd_user 一致(rbd map --id <user> 找
  # /etc/ceph/ceph.client.<user>.keyring)
  cinder_user: cinder
  configmap: ceph-etc
  keyring_secret: pvc-ceph-client-key
  fstype: ext4                               # 文件系统类型
  use_multipath: false                       # 是否使用多路径
  timeout_wait_volume_available: 60          # 卷可用等待超时
  timeout_wait_volume_deleted: 60            # 卷删除等待超时

# ────────────────────────────────────────────────────────────────────
# 3.5 Capsule 驱动配置
# ────────────────────────────────────────────────────────────────────
capsule_driver:
  # 支持的 capsule 驱动: docker, cri
  type: cri

# ════════════════════════════════════════════════════════════════════
# 4. Pod 配置 (Pod Configuration)
# ════════════════════════════════════════════════════════════════════

pod:
  # ────────────────────────────────────────────────────────────────────
  # 4.1 安全上下文配置
  # ────────────────────────────────────────────────────────────────────
  security_context:
    # API 服务安全配置
    zun_api:
      pod:
        runAsUser: 42436
      container:
        zun_api:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false

    # 计算服务安全配置（需要特权模式）
    zun_compute:
      pod:
        runAsUser: 42436
      container:
        zun_compute:
          privileged: true                     # 需要特权访问 Docker
          allowPrivilegeEscalation: true
          readOnlyRootFilesystem: false

    # CNI 守护进程安全配置（需要特权模式）
    zun_cni_daemon:
      pod:
        runAsUser: 0                          # root 用户
      container:
        zun_cni_daemon:
          privileged: true                     # 需要网络权限
          allowPrivilegeEscalation: true
          readOnlyRootFilesystem: false

    # WebSocket 代理安全配置
    zun_wsproxy:
      pod:
        runAsUser: 42436
      container:
        zun_wsproxy:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false

    # 计算节点上的 WebSocket 代理(manifests.daemonset_wsproxy):宿主机网络,
    # 端口对节点所在网络可见,因此不以 root 运行、不留任何 capability、根文件
    # 系统只读。UID 专用:进程数上限 pod.wsproxy_max_processes 按 UID 计,
    # 别的容器(例如同为 42424 的 neutron)不能占用它的名额。
    zun_wsproxy_node:
      pod:
        runAsUser: 42490
        runAsGroup: 42490
        fsGroup: 42490
        runAsNonRoot: true
      container:
        zun_wsproxy:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        zun_wsproxy_edge:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        zun_wsproxy_edge_init:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL

  # ────────────────────────────────────────────────────────────────────
  # 4.2 Pod 调度和容忍配置
  # ────────────────────────────────────────────────────────────────────
  affinity:
    anti:
      type:
        default: preferredDuringSchedulingIgnoredDuringExecution
      topologyKey:
        default: kubernetes.io/hostname
      weight:
        default: 10

  tolerations:
    zun:
      enabled: false
      tolerations:
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule

  # ────────────────────────────────────────────────────────────────────
  # 4.3 卷挂载配置（预留扩展点）
  # ────────────────────────────────────────────────────────────────────
  mounts:
    zun_api:
      init_container: null
      zun_api:
        volumeMounts:
        volumes:
    zun_compute:
      init_container: null
      zun_compute:
        volumeMounts:
        volumes:
    zun_cni_daemon:
      init_container: null
      zun_cni_daemon:
        volumeMounts:
        volumes:
    zun_wsproxy:
      init_container: null
      zun_wsproxy:
        volumeMounts:
        volumes:
    zun_bootstrap:
      init_container: null
      zun_bootstrap:
        volumeMounts:
        volumes:
    zun_db_sync:
      zun_db_sync:
        volumeMounts:
        volumes:
    zun_tests:
      init_container: null
      zun_tests:
        volumeMounts:
        volumes:

  # ────────────────────────────────────────────────────────────────────
  # 4.3.1 容器环境变量(按组件,键值对)
  # ────────────────────────────────────────────────────────────────────
  # OS_ZUN_DISABLE_EVENTLET_PATCHING=true:zun-compute / zun-wsproxy 跑原生线程,
  # 不打 eventlet 补丁(fork master 6019b112 起支持,见 zun/monkey_patch.py)。
  # 设 "false" 或删掉即回到 eventlet,无需换镜像。zun-api 由 uWSGI 运行(见
  # conf.zun_api_uwsgi),cni-daemon 从不打补丁,两者都不看这个变量。
  env:
    # uWSGI 内嵌解释器不做 PEP 538 的 locale 矫正,容器里 LANG 为空时 open() 按
    # ASCII 读,配置里一个非 ASCII 字节就只让 API 500(cloudkitty 踩过)。
    zun_api:
      PYTHONUTF8: "1"
    zun_compute:
      OS_ZUN_DISABLE_EVENTLET_PATCHING: "true"
    zun_wsproxy:
      OS_ZUN_DISABLE_EVENTLET_PATCHING: "true"
    zun_cni_daemon: {}

  # ────────────────────────────────────────────────────────────────────
  # 4.4 副本数配置
  # ────────────────────────────────────────────────────────────────────
  replicas:
    api: 1                                     # API 服务副本数
    wsproxy: 1                                 # WebSocket 代理副本数

  # 计算节点上的 zun-wsproxy(manifests.daemonset_wsproxy)每个连接 fork 一个
  # 进程,且在校验令牌之前就 fork:这里给它的 UID 设进程(含线程)数上限
  # (RLIMIT_NPROC),连接洪水只耗尽它自己,拖不垮节点。null 不设。
  wsproxy_max_processes: null

  # ────────────────────────────────────────────────────────────────────
  # 4.5 生命周期管理
  # ────────────────────────────────────────────────────────────────────
  lifecycle:
    upgrades:
      deployments:
        revision_history: 3
        pod_replacement_strategy: RollingUpdate
        rolling_update:
          max_unavailable: 1
          max_surge: 3
      daemonsets:
        compute:
          enabled: true
          min_ready_seconds: 0
          max_unavailable: 1
        cni_daemon:
          enabled: true
          min_ready_seconds: 10
          max_unavailable: 1
        wsproxy:
          enabled: true
          min_ready_seconds: 0
          max_unavailable: 1

    disruption_budget:
      api:
        min_available: 0
      wsproxy:
        min_available: 0

    termination_grace_period:
      compute:
        timeout: 60
      cni_daemon:
        timeout: 60
      api:
        timeout: 30
      wsproxy:
        timeout: 30

  # ────────────────────────────────────────────────────────────────────
  # 4.6 优先级和探针配置
  # ────────────────────────────────────────────────────────────────────
  priority_class:
    name: ""                                   # 自定义优先级类名
    value: 10                                  # 优先级值

  probes:
    # 计算服务探针
    compute:
      compute:
        liveness:
          enabled: true
          params:
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 5
        readiness:
          enabled: true
          params:
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 5

    # API 服务探针
    api:
      api:
        liveness:
          enabled: true
          params:
            initialDelaySeconds: 15
            periodSeconds: 60
            timeoutSeconds: 5
        readiness:
          enabled: true
          params:
            initialDelaySeconds: 15
            periodSeconds: 60
            timeoutSeconds: 5

    # WebSocket 代理探针
    wsproxy:
      wsproxy:
        liveness:
          enabled: true
          params:
            initialDelaySeconds: 15
            periodSeconds: 60
            timeoutSeconds: 5
        readiness:
          enabled: true
          params:
            initialDelaySeconds: 15
            periodSeconds: 60
            timeoutSeconds: 5

  # ────────────────────────────────────────────────────────────────────
  # 4.7 资源限制配置
  # ────────────────────────────────────────────────────────────────────
  resources:
    enabled: false                             # 是否启用资源限制

    # API 服务资源
    api:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "1024Mi"
        cpu: "2000m"

    # 计算服务资源
    compute:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "1024Mi"
        cpu: "2000m"

    # WebSocket 代理资源
    wsproxy:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "1024Mi"
        cpu: "2000m"

    # 计算节点 WebSocket 代理前面的 Envoy 边车(network.wsproxy.edge)
    wsproxy_edge:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "512Mi"
        cpu: "2000m"

    # CNI 守护进程资源
    cni_daemon:
      # 空闲即约 420MB(master + watcher + server,测试床实测),每个请求再 fork
      # 一个 worker(worker_num 默认 30):512Mi 会在并发建沙箱时被 OOM
      requests:
        memory: "512Mi"
        cpu: "100m"
      limits:
        memory: "2Gi"
        cpu: "2000m"

    # 各种任务的资源配置
    jobs:
      bootstrap:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "1024Mi"
          cpu: "2000m"
      db_init:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "1024Mi"
          cpu: "2000m"
      db_sync:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "1024Mi"
          cpu: "2000m"
      db_drop:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "1024Mi"
          cpu: "2000m"
      ks_endpoints:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "1024Mi"
          cpu: "2000m"
      ks_service:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "1024Mi"
          cpu: "2000m"
      ks_user:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "1024Mi"
          cpu: "2000m"
      rabbit_init:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "1024Mi"
          cpu: "2000m"
      tests:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "1024Mi"
          cpu: "2000m"
      image_repo_sync:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "1024Mi"
          cpu: "2000m"

# ════════════════════════════════════════════════════════════════════
# 5. 服务配置 (Service Configuration)
# ════════════════════════════════════════════════════════════════════

conf:
  # zun-api 的 paste 管线(上游 etc/zun/api-paste.ini,stable/2026.1)
  paste:
    composite:main:
      use: 'egg:Paste#urlmap'
      /: zun_api_pipeline
      /healthcheck: healthcheck
    pipeline:zun_api_pipeline:
      pipeline: cors request_id osprofiler authtoken api_v1
    app:api_v1:
      paste.app_factory: zun.api.app:app_factory
    filter:authtoken:
      acl_public_routes: /, /v1
      paste.filter_factory: zun.api.middleware.auth_token:AuthTokenMiddleware.factory
    filter:osprofiler:
      paste.filter_factory: zun.common.profiler:WsgiMiddleware.factory
    filter:request_id:
      paste.filter_factory: oslo_middleware:RequestId.factory
    filter:cors:
      paste.filter_factory: oslo_middleware.cors:filter_factory
      oslo_config_project: zun
    app:healthcheck:
      paste.app_factory: oslo_middleware:Healthcheck.app_factory
      backends: disable_by_file
      disable_by_file_path: /etc/zun/healthcheck_disable
  # ────────────────────────────────────────────────────────────────────
  # 5.1 测试和审计配置
  # ────────────────────────────────────────────────────────────────────
  rally_tests:
    tests: {}                                  # Rally 测试配置

  api_audit_map: {}                           # API 审计映射配置

  policy: {}                                  # 策略配置

  # ────────────────────────────────────────────────────────────────────
  # 5.2 WSGI 配置
  # ────────────────────────────────────────────────────────────────────
  zun:
    # === 基本配置 ===
    DEFAULT:
      debug: false                             # 调试模式
      use_syslog: false                        # 使用系统日志
      use_forwarded_for: true                  # 使用转发头

      # 容器运行时配置
      container_driver: docker                 # 容器驱动
      capsule_driver: cri                      # Capsule 驱动
      container_runtime: runc                  # 容器运行时

      # 默认可用区
      default_availability_zone: nova

      # 时间配置
      default_sleep_time: 1                    # 默认睡眠时间
      default_timeout: 600                     # 默认超时时间

      # 资源限制配置
      default_memory_swap: -1                  # 默认内存交换
      minimum_memory: 4                        # 最小内存（MB）
      maximum_memory: 8192                     # 最大内存（MB）
      minimum_cpus: 0.1                        # 最小 CPU 核数
      maximum_cpus: 16.0                       # 最大 CPU 核数
      minimum_disk: 1                          # 最小磁盘（GB）
      maximum_disk: 160                        # 最大磁盘（GB）
      default_memory: 512                      # 默认内存（MB）
      default_cpu: 1.0                         # 默认 CPU 核数
      default_disk: 10                         # 默认磁盘（GB）

      # 镜像驱动配置
      image_driver_list: glance,docker         # 镜像驱动列表
      default_image_driver: docker             # 默认镜像驱动

      # 沙箱容器配置
      sandbox_image: kubernetes/pause          # 沙箱镜像
      sandbox_image_driver: docker             # 沙箱驱动
      sandbox_image_pull_policy: ifnotpresent  # 拉取策略

      # 路径配置
      state_path: /var/lib/zun                 # 状态路径

      # 周期性任务配置
      periodic_interval_max: 60                # 周期任务最大间隔
      service_down_time: 180                   # 服务下线时间
      sync_container_state_interval: 60        # 容器状态同步间隔

      # Rootwrap 配置
      rootwrap_config: /etc/zun/rootwrap.conf  # Rootwrap 配置文件

      # 加密密钥
      auth_encryption_key: "notgood but just long enough i t"

    # === 数据库配置 ===
    database:
      max_retries: -1                          # 最大重试次数

    # === Keystone 认证配置 ===
    keystone_authtoken:
      auth_type: password                      # 认证类型
      auth_version: v3                         # 认证版本
      memcache_security_strategy: ENCRYPT      # Memcache 安全策略
      service_type: container                  # 服务类型
      service_token_roles_required: true       # 需要服务令牌角色

    keystone_auth:
      auth_type: password                      # 认证类型
      auth_version: v3                         # 认证版本

    # === API 服务配置 ===
    api:
      port: 9517                              # API 端口
      host_ip: 0.0.0.0                       # 监听地址
      enable_ssl_api: false                   # 启用 SSL
      workers: 1                              # 工作进程数
      max_limit: 1000                         # 最大限制
      api_paste_config: api-paste.ini         # API paste 配置
      enable_image_validation: false          # 启用镜像验证

    # === WebSocket 代理配置 ===
    websocket_proxy:
      wsproxy_port: 6784                      # WebSocket 端口
      wsproxy_host: 0.0.0.0                  # WebSocket 地址
      base_url: ws://0.0.0.0:6784/           # 基础 URL
      allowed_origins: []                     # 允许的源
      ssl_only: false                         # 仅 SSL

    # === Docker 配置 ===
    docker:
      docker_remote_api_version: "1.40"       # Docker API 版本;与上游 Zun 默认一致,也是 Docker 29 接受的最低版本(1.26 会被拒:client version too old)
      default_timeout: 45                     # 运行时调用的上限;必须低于 rpc_response_timeout(默认 60),否则两者同时到期、RPC 必输,任何慢调用都变成"节点不再应答"
      api_url: unix:///var/run/docker.sock   # API URL
      docker_remote_api_port: 2375            # Docker API 端口
      api_insecure: false                     # API 不安全模式
      execute_timeout: 30                     # 同上:5 秒太短,凡是等网络的命令都会撞上

    # === 计算服务配置 ===
    compute:
      topic: zun-compute                      # 消息队列主题
      unique_container_name_scope: ""         # 容器名称唯一性范围
      resume_container_state: false           # 恢复容器状态
      remount_container_volume: true          # 重新挂载容器卷
      reserve_disk_for_image: 0.2             # 为镜像预留磁盘
      enable_cpu_pinning: false               # 启用 CPU 绑定
      resource_provider_association_refresh: 300  # 资源提供者关联刷新
      host_shared_with_nova: false            # 与 Nova 共享主机

      # 资源预留配置
      reserved_host_disk_mb: 0                # 预留磁盘（MB）
      reserved_host_memory_mb: 512            # 预留内存（MB）
      reserved_host_cpus: 0                   # 预留 CPU

      # 资源分配比率
      cpu_allocation_ratio: 16.0              # CPU 分配比率
      ram_allocation_ratio: 1.5               # 内存分配比率
      disk_allocation_ratio: 1.0              # 磁盘分配比率
      initial_cpu_allocation_ratio: 16.0      # 初始 CPU 分配比率
      initial_ram_allocation_ratio: 1.5       # 初始内存分配比率
      initial_disk_allocation_ratio: 1.0      # 初始磁盘分配比率

    # === 网络配置（自动从顶级配置同步）===
    network: {}                               # 保持空，让模板自动填充

    # === CNI 守护进程配置（自动从顶级配置同步）===
    cni_daemon: {}                            # 保持空，让模板自动填充

    # === os-vif OVS 插口(CNI daemon 用)===
    # 容器化 OVS 的 ovsdb 在宿主机 /run/openvswitch/db.sock(daemon 已挂载);
    # 不依赖默认的 tcp:127.0.0.1:6640 是否恰好开着
    os_vif_ovs:
      ovsdb_connection: unix:/run/openvswitch/db.sock

    # === Neutron 配置 ===
    neutron:
      ovs_bridge: br-int                      # OVS 网桥

    # === 客户端配置 ===
    cinder_client:
      endpoint_type: internalURL              # 端点类型
      api_version: "3"                        # API 版本
      insecure: false                         # 不安全模式

    glance:
      images_directory: /var/lib/zun/images   # 镜像目录

    glance_client:
      endpoint_type: internalURL              # 端点类型
      api_version: "2"                        # API 版本
      insecure: false                         # 不安全模式

    neutron_client:
      endpoint_type: internalURL              # 端点类型
      insecure: false                         # 不安全模式

    placement_client:
      endpoint_type: internalURL              # 端点类型
      insecure: false                         # 不安全模式

    zun_client:
      endpoint_type: internalURL              # 端点类型
      insecure: false                         # 不安全模式

    # === 卷配置 ===
    volume:
      driver_list: cinder,local               # 卷驱动列表
      volume_dir: /var/lib/zun/volumes        # 卷目录
      fstype: ext4                           # 文件系统类型
      use_multipath: false                   # 使用多路径
      timeout_wait_volume_available: 60      # 卷可用等待超时
      timeout_wait_volume_deleted: 60        # 卷删除等待超时

    # === 调度器配置 ===
    scheduler:
      driver: filter_scheduler                # 调度器驱动
      available_filters: zun.scheduler.filters.all_filters  # 可用过滤器
      enabled_filters: AvailabilityZoneFilter,ComputeFilter,RuntimeFilter  # 启用过滤器
      max_placement_results: 1000             # 最大放置结果

    # === 配额配置 ===
    quota:
      containers: 40                          # 容器配额
      memory: 51200                          # 内存配额（MB）
      cpu: 20                                # CPU 配额
      disk: 100                              # 磁盘配额（GB）
      driver: zun.common.quota.DbQuotaDriver  # 配额驱动

    # === PCI 配置 ===
    pci:
      alias: "{}"                            # PCI 别名
      passthrough_whitelist: "[]"            # PCI 直通白名单

    # === Oslo 库配置 ===
    oslo_concurrency:
      lock_path: /var/lib/zun/tmp             # 锁文件路径

    oslo_messaging_notifications:
      driver: messagingv2                     # 通知驱动
      topics: notifications                   # 通知主题

    oslo_messaging_rabbit:
      # -- Durable queues are required by RabbitMQ 4.x, which denies
      ## transient non-exclusive queues by default. Also valid on 3.x.
      amqp_durable_queues: true
      # -- Quorum queues, which RabbitMQ 4.x requires: it denies transient
      ## non-exclusive queues, and oslo.messaging declares its reply and fanout
      ## queues that way unless the transient ones are quorum too.
      ## amqp_durable_queues alone only covers the RPC and notification queues.
      rabbit_quorum_queue: true
      rabbit_transient_quorum_queue: true
      use_queue_manager: true

  # ────────────────────────────────────────────────────────────────────
  # 5.3.1 zun-api 的 uWSGI 配置(渲染为 /etc/zun/zun-api-uwsgi.ini)
  # ────────────────────────────────────────────────────────────────────
  # zun-api 命令用的是 oslo.service 的 WSGI 服务器,它是 eventlet 的,在原生线程下
  # 拒绝启动,所以 API 一律走 zun-api-wsgi。参数照 watcher chart。http-socket
  # 留空时由 configmap-etc 按 endpoints 的 api 端口填。lazy-apps 必须为 true:
  # 每个 worker 各自加载应用,也各自起一个用量监听器(同一消费者组)。
  zun_api_uwsgi:
    uwsgi:
      add-header: "Connection: close"
      buffer-size: 65535
      die-on-term: true
      enable-threads: true
      exit-on-reload: false
      hook-master-start: unix_signal:15 gracefully_kill_them_all
      lazy-apps: true
      log-x-forwarded-for: true
      master: true
      need-app: true
      procname-prefix-spaced: "zun-api:"
      route-user-agent: '^kube-probe.* donotlog:'
      thunder-lock: true
      worker-reload-mercy: 80
      wsgi-file: /var/lib/openstack/bin/zun-api-wsgi
      processes: 2
      stats: 0.0.0.0:1717
      stats-http: true

  # ────────────────────────────────────────────────────────────────────
  # 5.4 日志配置
  # ────────────────────────────────────────────────────────────────────
  logging:
    # 日志记录器配置
    loggers:
      keys:
        - root
        - zun

    # 日志处理器配置
    handlers:
      keys:
        - stdout
        - stderr
        - "null"

    # 日志格式器配置
    formatters:
      keys:
        - context
        - default

    # 根日志记录器
    logger_root:
      level: WARNING
      handlers: 'null'

    # Zun 日志记录器
    logger_zun:
      level: INFO
      handlers:
        - stdout
        - stderr
      qualname: zun

    # 其他组件日志记录器
    logger_amqp:
      level: WARNING
      handlers: stderr
      qualname: amqp

    logger_amqplib:
      level: WARNING
      handlers: stderr
      qualname: amqplib

    logger_eventletwsgi:
      level: WARNING
      handlers: stderr
      qualname: eventlet.wsgi.server

    logger_sqlalchemy:
      level: WARNING
      handlers: stderr
      qualname: sqlalchemy

    logger_boto:
      level: WARNING
      handlers: stderr
      qualname: boto

    # 日志处理器定义
    handler_null:
      class: logging.NullHandler
      formatter: default
      args: ()

    handler_stdout:
      class: StreamHandler
      args: (sys.stdout,)
      formatter: context

    handler_stderr:
      class: StreamHandler
      args: (sys.stderr,)
      formatter: context

    # 日志格式器定义
    formatter_context:
      class: oslo_log.formatters.ContextFormatter
      datefmt: "%Y-%m-%d %H:%M:%S"

    formatter_default:
      format: "%(message)s"
      datefmt: "%Y-%m-%d %H:%M:%S"

# ════════════════════════════════════════════════════════════════════
# 6. 安全配置 (Security Configuration)
# ════════════════════════════════════════════════════════════════════

secrets:
  # Keystone 身份认证密钥
  identity:
    admin: zun-keystone-admin                 # 管理员密钥
    zun: zun-keystone-user                    # Zun 用户密钥

  # 数据库连接密钥
  oslo_db:
    admin: zun-db-admin                       # 数据库管理员密钥
    zun: zun-db-user                          # Zun 数据库用户密钥

  # 消息队列连接密钥
  oslo_messaging:
    admin: zun-rabbitmq-admin                 # RabbitMQ 管理员密钥
    zun: zun-rabbitmq-user                    # Zun RabbitMQ 用户密钥

  # TLS 证书配置
  tls:
    identity:
      api:
        public: zun-tls-public                # 公共 TLS 证书
        internal: zun-tls-internal            # 内部 TLS 证书
    container:
      api:
        public: zun-api-tls-public            # API 公共 TLS 证书
        internal: zun-api-tls-internal        # API 内部 TLS 证书
    websocket_proxy:
      wsproxy:
        public: zun-wsproxy-tls-public        # WebSocket 公共 TLS 证书
        internal: zun-wsproxy-tls-internal    # WebSocket 内部 TLS 证书

# ════════════════════════════════════════════════════════════════════
# 7. 依赖关系配置 (Dependencies Configuration)
# ════════════════════════════════════════════════════════════════════

dependencies:
  static:
    # API 服务依赖
    api:
      jobs:
        - zun-db-sync                         # 数据库同步任务
        - zun-ks-user                         # Keystone 用户创建
        - zun-ks-endpoints                    # Keystone 端点创建
        - zun-rabbit-init                     # RabbitMQ 初始化
      services:
        - endpoint: internal
          service: oslo_db                    # 数据库服务
        - endpoint: internal
          service: identity                   # 身份认证服务
        - endpoint: internal
          service: oslo_messaging             # 消息队列服务

    # 计算服务依赖
    compute:
      jobs:
        - zun-db-sync                         # 数据库同步任务
        - zun-rabbit-init                     # RabbitMQ 初始化
      services:
        - endpoint: internal
          service: identity                   # 身份认证服务
        - endpoint: internal
          service: container                  # 容器服务
        - endpoint: internal
          service: oslo_messaging             # 消息队列服务
        - endpoint: internal
          service: oslo_db                    # 数据库服务

    # CNI 守护进程依赖（无依赖）
    cni_daemon:
      jobs: []
      services: []

    # WebSocket 代理依赖
    wsproxy:
      jobs:
        - zun-db-sync                         # 数据库同步任务
        - zun-ks-user                         # Keystone 用户创建
        - zun-ks-endpoints                    # Keystone 端点创建
        - zun-rabbit-init                     # RabbitMQ 初始化
      services:
        - endpoint: internal
          service: oslo_db                    # 数据库服务
        - endpoint: internal
          service: identity                   # 身份认证服务
        - endpoint: internal
          service: container                  # 容器服务

    # 各种任务的依赖关系
    db_drop:
      services:
        - endpoint: internal
          service: oslo_db

    db_init:
      services:
        - endpoint: internal
          service: oslo_db

    db_sync:
      jobs:
        - zun-db-init
      services:
        - endpoint: internal
          service: oslo_db

    ks_endpoints:
      jobs:
        - zun-ks-service
      services:
        - endpoint: internal
          service: identity

    ks_service:
      services:
        - endpoint: internal
          service: identity

    ks_user:
      services:
        - endpoint: internal
          service: identity

    rabbit_init:
      services:
        - endpoint: internal
          service: oslo_messaging

    tests:
      services:
        - endpoint: internal
          service: identity
        - endpoint: internal
          service: container

    image_repo_sync:
      services:
        - endpoint: internal
          service: local_image_registry

# ════════════════════════════════════════════════════════════════════
# 8. 服务端点配置 (Endpoints Configuration)
# ════════════════════════════════════════════════════════════════════

endpoints:
  cluster_domain_suffix: cluster.local

  # ────────────────────────────────────────────────────────────────────
  # 8.1 基础设施服务端点
  # ────────────────────────────────────────────────────────────────────

  # 本地镜像仓库
  local_image_registry:
    name: docker-registry
    namespace: docker-registry
    hosts:
      default: localhost
      internal: docker-registry
      node: localhost
    host_fqdn_override:
      default: null
    port:
      registry:
        node: 5000

  # Keystone 身份认证服务
  identity:
    name: keystone
    auth:
      admin:
        region_name: RegionOne
        username: admin
        password: password
        project_name: admin
        user_domain_name: default
        project_domain_name: default
      zun:
        # admin,service like nova/neutron/cinder: neutron's default policy
        # (2026.2) lets only the service role set a port's binding:profile,
        # which unbinding a PCI-passthrough port needs. The ks-user job
        # grants every role listed here.
        role: admin,service
        region_name: RegionOne
        username: zun
        password: password
        project_name: service
        user_domain_name: service
        project_domain_name: service
    hosts:
      default: keystone
      internal: keystone-api
    host_fqdn_override:
      default: null
    path:
      default: /v3
    scheme:
      default: http
    port:
      api:
        default: 80
        internal: 5000

  # ────────────────────────────────────────────────────────────────────
  # 8.2 Zun 服务端点
  # ────────────────────────────────────────────────────────────────────

  # Zun 容器服务
  container:
    name: zun
    hosts:
      default: zun-api
      # public: zun.example.com
    host_fqdn_override:
      default: null
      # public: zun.example.com
    path:
      default: /v1
    scheme:
      default: http
      # public: https
    port:
      api:
        default: 9517
        # public: 443

  # Zun WebSocket 代理
  websocket_proxy:
    name: zun-wsproxy
    hosts:
      default: zun-wsproxy
      public: zun-console
    host_fqdn_override:
      default: null
      public: null
    path:
      default: /
    scheme:
      default: ws
      public: wss
    port:
      wsproxy:
        default: 6784
        public: 443

  # ────────────────────────────────────────────────────────────────────
  # 8.3 OpenStack 服务端点
  # ────────────────────────────────────────────────────────────────────

  # 数据库服务
  oslo_db:
    auth:
      admin:
        username: root
        password: password
        secret:
          tls:
            internal: mariadb-tls-direct
      zun:
        username: zun
        password: password
    hosts:
      default: mariadb
    host_fqdn_override:
      default: null
    path: /zun
    scheme: mysql+pymysql
    port:
      mysql:
        default: 3306

  # 缓存服务
  oslo_cache:
    auth:
      memcache_secret_key: null
    hosts:
      default: memcached
    host_fqdn_override:
      default: null
    port:
      memcache:
        default: 11211

  # 消息队列服务
  oslo_messaging:
    auth:
      admin:
        username: rabbitmq
        password: password
        secret:
          tls:
            internal: rabbitmq-tls-direct
      zun:
        username: zun
        password: password
    statefulset:
      replicas: 2
      name: rabbitmq-rabbitmq
    hosts:
      default: rabbitmq
    host_fqdn_override:
      default: null
    path: /zun
    scheme: rabbit
    port:
      amqp:
        default: 5672
      http:
        default: 15672

  # Neutron 网络服务
  network:
    name: neutron
    hosts:
      default: neutron-server
      public: neutron
    host_fqdn_override:
      default: null
    path:
      default: null
    scheme:
      default: http
    port:
      api:
        default: 9696
        public: 80

  # Glance 镜像服务
  image:
    name: glance
    hosts:
      default: glance-api
      public: glance
    host_fqdn_override:
      default: null
    path:
      default: null
    scheme:
      default: http
    port:
      api:
        default: 9292
        public: 80

  # Glance Registry 服务
  image_registry:
    name: glance-registry
    hosts:
      default: glance-registry
      public: glance-reg
    host_fqdn_override:
      default: null
    path:
      default: null
    scheme:
      default: 'http'
    port:
      api:
        default: 9191
        public: 80

  # Cinder 卷服务
  volume:
    name: cinder
    hosts:
      default: cinder-api
      public: cinder
    host_fqdn_override:
      default: null
    path:
      default: /v3/%(tenant_id)s
    scheme:
      default: http
    port:
      api:
        default: 8776
        public: 80

  volumev2:
    name: cinderv2
    hosts:
      default: cinder-api
      public: cinder
    host_fqdn_override:
      default: null
    path:
      default: /v2/%(tenant_id)s
    scheme:
      default: http
    port:
      api:
        default: 8776
        public: 80

  volumev3:
    name: cinderv3
    hosts:
      default: cinder-api
      public: cinder
    host_fqdn_override:
      default: null
    path:
      default: /v3/%(tenant_id)s
    scheme:
      default: http
    port:
      api:
        default: 8776
        public: 80

  # Placement 服务
  placement:
    name: placement
    hosts:
      default: placement-api
      public: placement
    host_fqdn_override:
      default: null
    path:
      default: /
    scheme:
      default: http
    port:
      api:
        default: 8778
        public: 80

  # Fluentd 日志服务
  fluentd:
    namespace: null
    name: fluentd
    hosts:
      default: fluentd-logging
    host_fqdn_override:
      default: null
    path:
      default: null
    scheme: 'http'
    port:
      service:
        default: 24224
      metrics:
        default: 24220

# ════════════════════════════════════════════════════════════════════
# 9. 清单控制配置 (Manifests Control)
# ════════════════════════════════════════════════════════════════════
# 控制哪些 Kubernetes 资源会被创建

manifests:
  # ────────────────────────────────────────────────────────────────────
  # 9.1 配置映射和密钥
  # ────────────────────────────────────────────────────────────────────
  configmap_bin: true                         # 二进制文件配置映射
  configmap_etc: true                         # 配置文件配置映射
  configmap_cni: false                        # CNI 配置映射

  # ────────────────────────────────────────────────────────────────────
  # 9.2 工作负载
  # ────────────────────────────────────────────────────────────────────
  daemonset_compute: true                     # 计算服务守护进程集
  daemonset_cni_daemon: false                 # CNI 守护进程集
  deployment_api: true                        # API 服务部署
  deployment_wsproxy: true                    # WebSocket 代理部署
  # 每个计算节点一个 WebSocket 代理(宿主机网络),胶囊(CRI)的 exec/attach
  # 必须用它:运行时的流服务器只监听节点回环地址。见 network.wsproxy。
  daemonset_wsproxy: false

  # ────────────────────────────────────────────────────────────────────
  # 9.4 任务
  # ────────────────────────────────────────────────────────────────────
  job_bootstrap: true                         # 引导任务
  job_db_init: true                           # 数据库初始化任务
  job_db_sync: true                           # 数据库同步任务
  job_db_drop: false                          # 数据库删除任务（默认禁用）
  job_image_repo_sync: true                   # 镜像仓库同步任务
  job_rabbit_init: true                       # RabbitMQ 初始化任务
  job_ks_endpoints: true                      # Keystone 端点创建任务
  job_ks_service: true                        # Keystone 服务创建任务
  job_ks_user: true                           # Keystone 用户创建任务

  # ────────────────────────────────────────────────────────────────────
  # 9.5 服务和策略
  # ────────────────────────────────────────────────────────────────────
  pdb_api: true                               # API 服务 Pod 中断预算
  pod_test: true                              # 测试 Pod
  network_policy: false                       # 网络策略（默认禁用）

  # ────────────────────────────────────────────────────────────────────
  # 9.6 密钥和服务
  # ────────────────────────────────────────────────────────────────────
  secret_db: true                             # 数据库连接密钥
  secret_keystone: true                       # Keystone 认证密钥
  secret_rabbitmq: true                       # RabbitMQ 连接密钥

  service_api: true                           # API 服务
  service_wsproxy: true                       # WebSocket 代理服务

# ════════════════════════════════════════════════════════════════════
# 配置文件结束
# ════════════════════════════════════════════════════════════════════
# -- Extra K8s manifests to deploy. Either a list or a map of manifests.
## Note: Supports use of custom Helm templates
## Note: Helm replaces (instead of merging) list values when several values
## files are combined, so if you need to define extraObjects in more than one
## overrides file, use the map form and make sure the keys are unique across
## those files. With the list form only the last file takes effect.
extraObjects: {}
